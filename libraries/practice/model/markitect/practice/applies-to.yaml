imports:
  - {package: markitect/core, as: Core}
id: appliesTo
kind: Core.Property
body: >-
  The Packages the rule governs, as Package paths; a dot names the root
  Package. A named Package includes the Packages below it. Absent or empty,
  the rule governs only the Package it is defined in, not those below it.
spec:
  valueType: string
  minCount: 0
  maxCount: -1
