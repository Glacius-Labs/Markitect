imports:
  - {package: markitect/core, as: Core}
id: Project
kind: Core.Kind
body: >-
  The anchor of a project: its language, module root, permitted third-party
  dependencies and the commands that build and test it. The required checks
  in the project's execution.yaml are authoritative; these fields describe
  them for readers and agents.
spec:
  properties: [language, moduleRoot, permittedDependencies, buildCommand, testCommand]
