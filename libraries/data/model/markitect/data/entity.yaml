imports:
  - {package: markitect/core, as: Core}
  - {package: markitect/values, as: Values}
id: Entity
kind: Core.Kind
body: >-
  A record type: named fields, each with a field type. A field whose type is
  an Entity embeds that record; refersTo says the value identifies an
  existing record of that type instead. The body states what the record
  stands for and how its fields change.
spec:
  implements: [Values.FieldType]
  properties: [fields, key]
