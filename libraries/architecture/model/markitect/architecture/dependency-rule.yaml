imports:
  - {package: markitect/core, as: Core}
  - {package: markitect/practice, as: Practice}
id: DependencyRule
kind: Core.Kind
body: >-
  An allowlist: the Packages in appliesTo may depend only on themselves and
  on the Packages in mayDependOn. A dependency is any typed reference or body
  link in the model and any import in the code that realizes it.
spec:
  implements: [Practice.Rule]
  properties: [Practice.appliesTo, mayDependOn]
