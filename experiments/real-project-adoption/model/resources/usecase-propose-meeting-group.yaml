apiVersion: architecture.mymeetings.example/v1alpha1
kind: UseCase
metadata:
  name: propose-meeting-group
  namespace: architecture
  labels:
    feature-ownership: required
spec:
  intent: Command
  summary: Submit a proposal for a MeetingGroup.
  module: {apiVersion: architecture.mymeetings.example/v1alpha1, kind: Module, name: meetings, namespace: architecture}
  feature: {apiVersion: architecture.mymeetings.example/v1alpha1, kind: Feature, name: meeting-groups, namespace: architecture}
  handler: {apiVersion: architecture.mymeetings.example/v1alpha1, kind: Handler, name: propose-meeting-group, namespace: architecture}
  sourceFiles:
    - src/Modules/Meetings/Application/MeetingGroupProposals/ProposeMeetingGroup/ProposeMeetingGroupCommand.cs
  aggregates:
    - {apiVersion: architecture.mymeetings.example/v1alpha1, kind: Aggregate, name: meeting-proposal, namespace: architecture}
  validators:
    - {apiVersion: architecture.mymeetings.example/v1alpha1, kind: Validator, name: propose-meeting-group, namespace: architecture}
