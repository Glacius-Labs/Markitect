apiVersion: architecture.mymeetings.example/v1alpha1
kind: UseCase
metadata:
  name: authenticate
  namespace: architecture
  labels:
    feature-ownership: required
spec:
  intent: Command
  summary: Authenticate a user with credentials.
  module: {apiVersion: architecture.mymeetings.example/v1alpha1, kind: Module, name: user-access, namespace: architecture}
  feature: {apiVersion: architecture.mymeetings.example/v1alpha1, kind: Feature, name: authentication, namespace: architecture}
  handler: {apiVersion: architecture.mymeetings.example/v1alpha1, kind: Handler, name: authenticate, namespace: architecture}
  sourceFiles:
    - src/Modules/UserAccess/Application/Authentication/Authenticate/AuthenticateCommand.cs
  aggregates:
    - {apiVersion: architecture.mymeetings.example/v1alpha1, kind: Aggregate, name: user, namespace: architecture}
  validators:
    - {apiVersion: architecture.mymeetings.example/v1alpha1, kind: Validator, name: authenticate, namespace: architecture}
