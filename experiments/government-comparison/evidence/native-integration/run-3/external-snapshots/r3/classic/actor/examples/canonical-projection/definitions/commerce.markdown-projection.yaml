apiVersion: markitect.foundation/v1
kind: Projection
metadata:
  namespace: commerce
  name: application-markdown
purpose: Materializes an independent documentation representation of the same commerce scope.
spec:
  source:
    definitions:
      - apiVersion: commerce.example.org/v1
        kind: UseCase
        namespace: commerce
        name: create-order
      - apiVersion: commerce.example.org/v1
        kind: Handler
        namespace: commerce
        name: create-order-handler
      - apiVersion: commerce.example.org/v1
        kind: EffectAxis
        namespace: commerce
        name: create-order-effects
  policies:
    - apiVersion: markitect.foundation/v1
      kind: ProjectionPolicy
      namespace: commerce
      name: usecase-markdown
    - apiVersion: markitect.foundation/v1
      kind: ProjectionPolicy
      namespace: commerce
      name: handler-markdown
    - apiVersion: markitect.foundation/v1
      kind: ProjectionPolicy
      namespace: commerce
      name: effectaxis-markdown
  representation: markdown
  target:
    repository: .
    path: docs/represented/
