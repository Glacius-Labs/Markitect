apiVersion: markitect.foundation/v1
kind: ProjectionPolicy
metadata:
  namespace: example
  name: process-to-codex
purpose: Provides bounded codex rendering guidance for the selected Process Kind.
spec:
  sourceKind:
    apiVersion: workflow.example.org/v1
    kind: Process
  targetTechnology: codex
  guidance: >
    Render a concise AGENTS.md projection. Begin by stating that canonical Definitions and their Schema remain authoritative. Preserve each selected Definition identity, purpose, typed facts, and exact referenced identity with source provenance. Use only semantics and guidance present in this input; do not invent workflow steps or claim the file has been adopted.
