apiVersion: architecture.mymeetings.example/v1alpha1
kind: UseCase
metadata:
  name: register-new-user
  namespace: architecture
  labels:
    feature-ownership: required
spec:
  intent: Command
  summary: Register a new user and publish the registration event.
  module: {apiVersion: architecture.mymeetings.example/v1alpha1, kind: Module, name: registrations, namespace: architecture}
  feature: {apiVersion: architecture.mymeetings.example/v1alpha1, kind: Feature, name: user-registration, namespace: architecture}
  handler: {apiVersion: architecture.mymeetings.example/v1alpha1, kind: Handler, name: register-new-user, namespace: architecture}
  sourceFiles:
    - src/Modules/Registrations/Application/UserRegistrations/RegisterNewUser/RegisterNewUserCommand.cs
  aggregates:
    - {apiVersion: architecture.mymeetings.example/v1alpha1, kind: Aggregate, name: user-registration, namespace: architecture}
  validators:
    []
