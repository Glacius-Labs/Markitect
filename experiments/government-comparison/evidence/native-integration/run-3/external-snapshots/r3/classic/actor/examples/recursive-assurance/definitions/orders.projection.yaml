apiVersion: markitect.foundation/v1
kind: Projection
metadata:
  namespace: recursive-assurance
  name: orders-dotnet
purpose: Independently represents the Orders leaf Definition in its own .NET root.
spec:
  source:
    definitions:
      - apiVersion: commerce.recursive-assurance/v1
        kind: OrderRules
        namespace: orders
        name: calculate-line-total
  representation: dotnet
  target:
    repository: .
    path: src/Orders/
  policies:
    - apiVersion: markitect.foundation/v1
      kind: ProjectionPolicy
      namespace: recursive-assurance
      name: orders-dotnet