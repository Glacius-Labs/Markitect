      package: mymeetings-architecture
      packageVersion: 1.0.0
      hash: sha256:adfee2bbdc34f299c45dae48383c3f1c9a2a18b225ae0ac2c02792d9b273ef13
      reason: required by engineering/Skill/architecture-review via uses
