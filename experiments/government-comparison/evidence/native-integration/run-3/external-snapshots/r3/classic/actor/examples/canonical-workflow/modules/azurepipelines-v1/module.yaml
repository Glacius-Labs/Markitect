apiVersion: markitect.example.org/module/v1alpha1
name: markitect-azure-pipelines
version: 1.0.0
type: projection
purpose: Provides a target-specific Azure Pipelines projection capability for selected workflow intent.
requires:
  core: "1"
  modules: []
provides:
  schemas:
    []
  projectors:
    - id: azure-pipeline
      version: 1.0.0
      target: azurepipelines
      allKinds: true
      allowedRoots:
        - ci/azure/
      requiredChecks:
        - canonical-workflow-check
      guidance: >
        Render selected workflow intent as a reviewable Azure Pipelines file. Consume only supplied named checks and canonical inputs.
