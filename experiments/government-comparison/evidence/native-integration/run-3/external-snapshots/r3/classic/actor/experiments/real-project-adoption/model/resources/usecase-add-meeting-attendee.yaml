apiVersion: architecture.mymeetings.example/v1alpha1
kind: UseCase
metadata:
  name: add-meeting-attendee
  namespace: architecture
  labels:
    feature-ownership: required
    validation: required
spec:
  intent: Command
  summary: Add a member to a Meeting as an attendee.
  module: {apiVersion: architecture.mymeetings.example/v1alpha1, kind: Module, name: meetings, namespace: architecture}
  feature: {apiVersion: architecture.mymeetings.example/v1alpha1, kind: Feature, name: meeting-attendance, namespace: architecture}
  handler: {apiVersion: architecture.mymeetings.example/v1alpha1, kind: Handler, name: add-meeting-attendee, namespace: architecture}
  sourceFiles:
    - src/Modules/Meetings/Application/Meetings/AddMeetingAttendee/AddMeetingAttendeeCommand.cs
  aggregates:
    - {apiVersion: architecture.mymeetings.example/v1alpha1, kind: Aggregate, name: meeting, namespace: architecture}
  validators:
    []
