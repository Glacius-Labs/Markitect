apiVersion: markitect.example.org/module/v1alpha1
name: markitect-dotnet
version: 1.0.0
type: projection
purpose: Registers target guidance and an internal .NET execution entrypoint for bounded agent projections.
requires:
  core: "1"
  modules: []
provides:
  schemas: []
  projectors:
    - id: dotnet-source
      version: 1.0.0
      target: dotnet
      allKinds: true
      allowedRoots:
        - src/
      guidance: >
        Use canonical semantics and applicable ProjectionPolicy guidance as
        inputs to a bounded Executor task. Escalate when representation intent
        is missing or ambiguous; return a candidate for independent verification.
