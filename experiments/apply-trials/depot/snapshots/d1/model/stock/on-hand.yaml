imports:
  - package: software
    as: Software
  - package: catalog
    as: Catalog
  - package: orders
    as: Orders
id: on-hand
kind: Software.Concept
body: |-
  Every [[Catalog.item]] has an on-hand quantity: the units physically in the
  depot. It is 0 for a new item, rises only through [[receive]] and falls only
  when [[Orders.fulfil-order]] takes the lines of an order out of stock. It
  always stays within [[limits]]. The stock record is a JSON object with
  exactly sku (string) and onHand (integer).
spec: {}
