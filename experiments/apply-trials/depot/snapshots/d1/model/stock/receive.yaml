imports:
  - package: software
    as: Software
  - package: depot
    as: Depot
  - package: catalog
    as: Catalog
id: receive
kind: Software.UseCase
body: |-
  At [[Depot.interface]], `receive --sku SKU --qty N` adds N to the [[on-hand]]
  quantity of the existing [[Catalog.item]] with that SKU under [[Catalog.sku]],
  commits the change through [[Depot.storage]] and returns the item's stock
  record. An invalid or unknown SKU, an invalid quantity under [[Depot.inputs]]
  or a result above [[limits]] is refused with stored data unchanged.
spec: {}
