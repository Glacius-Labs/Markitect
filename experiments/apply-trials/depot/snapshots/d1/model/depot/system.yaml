imports:
  - package: software
    as: Software
  - package: catalog
    as: Catalog
  - package: stock
    as: Stock
  - package: orders
    as: Orders
  - package: reports
    as: Reports
id: system
kind: Software.Concept
body: |-
  A small local depot CLI for one operator. The catalog registers
  [[Catalog.item|items]] with [[Catalog.add-item]]. Stock records goods received
  with [[Stock.receive]] and keeps each item's [[Stock.on-hand]] quantity.
  Customer [[Orders.order|orders]] reserve stock when they are placed with
  [[Orders.place-order]], take it out of stock with [[Orders.fulfil-order]] and
  release it with [[Orders.cancel-order]]; [[Orders.list-orders]] shows them.
  Reports show the [[Reports.stock-view|stock of every item]] and the
  [[Reports.reorder|items to reorder]]. [[inputs]], [[storage]] and
  [[interface]] govern every command, and [[realization]] requires code,
  meaningful tests and usage documentation. Use the Python 3.13 standard
  library, with no service, network or package installation. There are no
  prices, customers' data, locations, users, partial fulfilment, editing or
  deletion of items and orders.
spec: {}
