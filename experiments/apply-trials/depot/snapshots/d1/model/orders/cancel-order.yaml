imports:
  - package: software
    as: Software
  - package: depot
    as: Depot
id: cancel-order
kind: Software.UseCase
body: |-
  At [[Depot.interface]], `cancel-order --id N` cancels the open [[order]] with
  that id: its status becomes cancelled, which releases its reservation under
  [[availability]]; on-hand quantities do not change. It commits through
  [[Depot.storage]] and returns the order record. Cancelling an already
  cancelled order succeeds without a change and returns its record. An invalid
  id under [[Depot.inputs]], an unknown id or a fulfilled order is refused with
  stored data unchanged.
spec: {}
