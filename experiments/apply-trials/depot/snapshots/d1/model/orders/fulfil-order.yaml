imports:
  - package: software
    as: Software
  - package: depot
    as: Depot
  - package: stock
    as: Stock
id: fulfil-order
kind: Software.UseCase
body: |-
  At [[Depot.interface]], `fulfil-order --id N` fulfils the open [[order]] with
  that id: its status becomes fulfilled and every line's quantity is taken out
  of the item's [[Stock.on-hand]] quantity, which releases its reservation
  under [[availability]]. It commits through [[Depot.storage]] and returns the
  order record. An invalid id under [[Depot.inputs]], an unknown id or an order
  that is not open is refused with stored data unchanged.
spec: {}
