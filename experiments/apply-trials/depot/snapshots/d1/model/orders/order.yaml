imports:
  - package: software
    as: Software
  - package: depot
    as: Depot
  - package: catalog
    as: Catalog
id: order
kind: Software.Concept
body: |-
  An order of [[Depot.system]] has an integer id, a status and one to ten
  lines. The first placed order gets id 1 and every later placed order the next
  integer; a refused request uses no id, and ids are never reused. The status
  is open, fulfilled or cancelled: [[place-order]] creates an open order,
  [[fulfil-order]] makes it fulfilled and [[cancel-order]] makes it cancelled;
  fulfilled and cancelled orders never change again. A line names one
  [[Catalog.item]] by its normalized SKU and a quantity under [[Depot.inputs]];
  no item appears in two lines of one order, and the lines keep the order in
  which they were given. The order record is a JSON object with exactly id
  (integer), status (string) and lines (array of objects with exactly sku and
  qty).
spec: {}
