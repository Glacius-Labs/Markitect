apiVersion: markitect.registry/v1
artifacts:
  - path: realization/catalog/__init__.py
    form: code
    realizes: [catalog/item]
    why: Makes the catalog an importable package.
  - path: realization/catalog/items.py
    form: code
    realizes: [catalog/item, catalog/sku, catalog/add-item]
    why: Normalizes SKUs for every part, adds items and validates the stored catalog.
  - path: realization/catalog/test_items.py
    form: test
    realizes: [catalog/sku, catalog/add-item]
    why: Tests SKU normalization, the SKU format and adding items.
