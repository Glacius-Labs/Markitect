imports:
  - package: markitect/core
    as: Core
id: PriceRule
kind: Core.Kind
body: >-
  A pricing rule. Its structured values bind how a price is computed, and its
  body states the conditions under which they apply.
spec:
  properties:
    - maxDiscountPercent
    - allowStacking
    - taxRate
    - tiers
    - basis
