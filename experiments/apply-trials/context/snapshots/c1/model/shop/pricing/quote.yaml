imports:
  - package: software
    as: Software
  - package: shop/catalog
    as: Catalog
id: quote
kind: Software.UseCase
title: Quote a price
body: |-
  A quote states the price of a quantity of one [[Catalog.product]] after the
  [[discount]]. A quote for a discontinued product is refused. How quotes are
  cached between requests is the realization's choice. The quoted quantity is
  a whole number from 1 to 999.
spec: {}
