imports:
  - package: shop
    as: Shop
  - package: shop/catalog
    as: Catalog
id: discount
kind: Shop.PriceRule
title: Volume discount
body: |-
  The volume discount lowers the [[Catalog.list-price]] of one product in a
  [[quote]] by the percent of the highest tier whose minQuantity the quoted
  quantity reaches. The discount is never more than maxDiscountPercent of the
  list price. When allowStacking is false, no other discount combines with
  this one. The quote adds tax at taxRate of the discounted price, rounded
  down to whole cents. A discount never applies to a product whose list price
  is below 50 cents.
spec:
  maxDiscountPercent: 25
  allowStacking: false
  taxRate: 0.075
  tiers:
    - minQuantity: 10
      percent: 5
    - minQuantity: 50
      percent: 12
  basis: Catalog.product
