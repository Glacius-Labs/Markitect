apiVersion: markitect.registry/v1
artifacts:
  - path: realization/jobs/__init__.py
    form: code
    realizes: [shop/jobs/job]
    why: Makes the jobs part an importable package.
  - path: realization/jobs/jobs.py
    form: code
    realizes: [shop/jobs/job, shop/jobs/open-job, shop/jobs/add-labor, shop/jobs/use-part, shop/jobs/close-job, shop/jobs/list-jobs]
    why: Opens, works on, closes and lists repair jobs, reserving and consuming parts through the parts part.
  - path: realization/jobs/test_jobs.py
    form: test
    realizes: [shop/jobs/job, shop/jobs/add-labor, shop/jobs/use-part, shop/jobs/close-job]
    why: Tests reservations, consumption on closing, labor limits and closed jobs.
