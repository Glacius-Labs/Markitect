imports:
  - package: software
    as: Software
  - package: shop/customers
    as: Customers
  - package: shop/jobs
    as: Jobs
  - package: shop/parts
    as: Parts
id: pricing
kind: Software.Rule
title: Pricing and tax
body: |-
  The labor amount of an [[invoice]] is 1500 cents for every 15 minutes of
  its [[Jobs.job]]. Its parts amount is the sum, over the job's parts, of the
  units used times the price of that [[Parts.part]]. For a customer with the
  tier loyal under [[Customers.loyalty]] when the invoice is written, the
  discount is 10 percent of the labor amount plus 5 percent of the parts
  amount, each rounded to whole cents with an exact half rounded to the even
  number of cents; for a standard customer it is 0. The net amount is labor
  plus parts minus discount. The tax (vat) is 19 percent of the net amount,
  rounded to whole cents in the same way, and the total is the net amount
  plus the tax.
spec: {}
