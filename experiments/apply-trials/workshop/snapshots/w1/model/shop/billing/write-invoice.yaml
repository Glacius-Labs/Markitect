imports:
  - package: software
    as: Software
  - package: shop
    as: Shop
id: write-invoice
kind: Software.UseCase
title: Write an invoice
body: |-
  At [[Shop.interface]], `invoice --job ID` creates the unpaid [[invoice]] of
  the existing closed job with that id under [[pricing]], commits it through
  [[Shop.storage]] and returns the invoice record. An unknown job, a job that
  is still open and a job that already has an invoice are refused with
  stored data unchanged.
spec: {}
