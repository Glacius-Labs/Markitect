imports:
  - package: software
    as: Software
  - package: shop
    as: Shop
id: pay
kind: Software.UseCase
title: Record a payment
body: |-
  At [[Shop.interface]], `pay --invoice NUMBER` marks the existing unpaid
  [[invoice]] with that number paid, commits the change through
  [[Shop.storage]] and returns the invoice record. An unknown number or an
  invoice that is already paid is refused with stored data unchanged.
spec: {}
