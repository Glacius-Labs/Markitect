imports:
  - package: software
    as: Software
  - package: shop
    as: Shop
id: list-invoices
kind: Software.UseCase
title: List the invoices
body: |-
  At [[Shop.interface]], `invoices` returns an object whose only field,
  invoices, holds every [[invoice]] record in the order in which they were
  written, which is the order of their sequence numbers.
  With `--customer ID` it holds only the invoices of that customer, which
  must exist. Without --customer, a missing data file is empty data under
  [[Shop.storage]]. The query never changes stored data.
spec: {}
