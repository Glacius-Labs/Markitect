imports:
  - package: software
    as: Software
  - package: shop
    as: Shop
id: add-part
kind: Software.UseCase
title: Register a part
body: |-
  At [[Shop.interface]], `add-part --sku SKU --name NAME --price CENTS` creates
  one [[part]] with the normalized SKU, the name and the price of
  [[Shop.inputs]] and no stock, commits it through [[Shop.storage]] and
  returns the part record. An invalid SKU, name or price, or a SKU that
  already exists after normalization, is refused with stored data unchanged.
spec: {}
