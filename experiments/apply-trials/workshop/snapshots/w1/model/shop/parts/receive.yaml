imports:
  - package: software
    as: Software
  - package: shop
    as: Shop
id: receive
kind: Software.UseCase
title: Receive parts
body: |-
  At [[Shop.interface]], `receive --sku SKU --qty N` adds N to the on-hand
  quantity of the existing [[part]] with that normalized SKU, commits the
  change through [[Shop.storage]] and returns the part record. An invalid or
  unknown SKU, an invalid quantity or a result above the limit of [[stock]]
  is refused with stored data unchanged; reaching exactly 9999 is allowed.
spec: {}
