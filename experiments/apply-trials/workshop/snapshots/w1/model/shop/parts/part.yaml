imports:
  - package: software
    as: Software
  - package: shop
    as: Shop
id: part
kind: Software.Concept
title: Part
body: |-
  A part of [[Shop.system]] has a SKU, a name and a price in cents under
  [[Shop.inputs]], and the quantities of [[stock]]. [[add-part]] creates it;
  its SKU, name and price never change afterwards, and parts are never
  deleted. At most one part exists per normalized SKU. The part record is a
  JSON object with exactly sku (string), name (string), price (integer),
  onHand (integer), reserved (integer) and available (integer).
spec: {}
