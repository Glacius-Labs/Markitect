imports:
  - package: software
    as: Software
  - package: shop
    as: Shop
id: add-customer
kind: Software.UseCase
title: Register a customer
body: |-
  At [[Shop.interface]], `add-customer --name NAME` creates one [[customer]]
  with the next id and the name of [[Shop.inputs]], commits it through
  [[Shop.storage]] and returns the customer record. An invalid name is
  refused with stored data unchanged.
spec: {}
