imports:
  - package: software
    as: Software
  - package: shop
    as: Shop
id: customer
kind: Software.Concept
title: Customer
body: |-
  A customer of [[Shop.system]] has an id and a name under [[Shop.inputs]].
  [[add-customer]] creates the customer with the next id: C1 for the first
  customer, then C2, C3 and so on. Customers never change and are never
  deleted; names need not be unique. The customer record is a JSON object
  with exactly id (string), name (string), paidInvoices (integer) and tier
  (string), where paidInvoices and tier follow [[loyalty]] at the time the
  record is shown.
spec: {}
