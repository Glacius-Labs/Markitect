imports:
  - package: software
    as: Software
  - package: shop
    as: Shop
  - package: shop/parts
    as: Parts
id: close-job
kind: Software.UseCase
title: Close a repair job
body: |-
  At [[Shop.interface]], `close-job --job ID` closes the existing open [[job]]:
  for every part the job used, its units leave both the on-hand and the
  reserved quantity under [[Parts.stock]]. It commits all changes through
  [[Shop.storage]] and returns the job record with status closed. An unknown
  or already closed job is refused with stored data unchanged.
spec: {}
