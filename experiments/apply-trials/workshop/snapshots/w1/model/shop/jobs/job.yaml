imports:
  - package: software
    as: Software
  - package: shop
    as: Shop
  - package: shop/customers
    as: Customers
  - package: shop/parts
    as: Parts
id: job
kind: Software.Concept
title: Repair job
body: |-
  A repair job of [[Shop.system]] belongs to one existing
  [[Customers.customer]] and describes the bicycle under [[Shop.inputs]].
  [[open-job]] creates it open, with the next id (J1 for the first job, then
  J2, J3 and so on), no labor and no parts. While it is open, [[add-labor]]
  adds minutes, at most 2400 in total, and [[use-part]] reserves parts under
  [[Parts.stock]]. [[close-job]] closes it once; a closed job never changes
  again and is never reopened or deleted. The job record is a JSON object with
  exactly id (string), customer (string, the customer's id), bike (string),
  status (open or closed), minutes (integer) and parts (an array of objects
  with exactly sku and qty, one per SKU in the order of its first use, qty
  being the total units used of that SKU).
spec: {}
