imports:
  - package: software
    as: Software
  - package: shop
    as: Shop
id: list-jobs
kind: Software.UseCase
title: List the jobs
body: |-
  At [[Shop.interface]], `jobs` returns an object whose only field, jobs,
  holds every [[job]] record in the order of their creation. With
  `--status open` or `--status closed` it holds only the jobs with that
  status; any other status is refused. A missing data file is empty data
  under [[Shop.storage]]. The query never changes stored data.
spec: {}
