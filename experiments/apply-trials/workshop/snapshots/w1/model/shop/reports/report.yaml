imports:
  - package: software
    as: Software
  - package: shop
    as: Shop
  - package: shop/jobs
    as: Jobs
  - package: shop/billing
    as: Billing
  - package: shop/parts
    as: Parts
id: report
kind: Software.UseCase
title: Workshop report
body: |-
  At [[Shop.interface]], `report` returns an object with exactly openJobs
  (the number of open [[Jobs.job|jobs]]), unpaidTotal and paidTotal (the sums
  of the totals of the unpaid and of the paid [[Billing.invoice|invoices]], in
  cents) and lowStock (the SKUs of every [[Parts.part]] whose available
  quantity under [[Parts.stock]] is below 3, in ascending code-point order). A
  missing data file gives zeros and an empty list under [[Shop.storage]]. The
  query never changes stored data.
spec: {}
