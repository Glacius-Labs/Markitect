apiVersion: markitect.registry/v1
artifacts:
  - path: realization/README.md
    form: doc
    realizes: [hall/realization, hall/interface, hall/inputs, hall/storage]
    why: Documents the commands, inputs, reserve, output, data file and the single-writer limitation.
  - path: realization/app.py
    form: code
    realizes: [hall/system, hall/interface]
    why: Parses the command line, runs one command and writes the JSON result or error object with its exit code.
  - path: realization/hall/__init__.py
    form: code
    realizes: [hall/system]
    why: Makes the shared foundations an importable package.
  - path: realization/hall/errors.py
    form: code
    realizes: [hall/interface]
    why: Defines the refusal that every part raises.
  - path: realization/hall/inputs.py
    form: code
    realizes: [hall/inputs]
    why: Validates numbers and the seats of rooms and bookings.
  - path: realization/hall/store.py
    form: code
    realizes: [hall/storage]
    why: Reads and validates the data file and replaces it atomically.
  - path: realization/tests/__init__.py
    form: test
    realizes: [hall/interface]
    why: Makes the end-to-end tests an importable package.
  - path: realization/tests/test_cli.py
    form: test
    realizes: [hall/interface, hall/storage]
    why: Exercises the command line end to end, including usage errors and malformed data.
