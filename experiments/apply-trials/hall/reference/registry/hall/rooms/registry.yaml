apiVersion: markitect.registry/v1
artifacts:
  - path: realization/rooms/__init__.py
    form: code
    realizes: [hall/rooms/room]
    why: Makes the rooms part an importable package.
  - path: realization/rooms/rooms.py
    form: code
    realizes: [hall/rooms/room, hall/rooms/room-code, hall/rooms/add-room, hall/rooms/list-rooms]
    why: Applies the room code rule, registers rooms and lists them with their bookable seats.
  - path: realization/rooms/test_rooms.py
    form: test
    realizes: [hall/rooms/room, hall/rooms/room-code, hall/rooms/add-room, hall/rooms/list-rooms]
    why: Tests the room code rule, registration, refusals and the listing order.
