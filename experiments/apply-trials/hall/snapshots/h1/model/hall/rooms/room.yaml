imports:
  - package: software
    as: Software
  - package: hall
    as: Hall
  - package: hall/bookings
    as: Bookings
id: room
kind: Software.Concept
body: |-
  A room of [[Hall.system]] has a code under [[room-code]] and a number of
  seats under [[Hall.inputs]]. [[add-room]] creates it; afterwards it never
  changes and is never deleted. At most one room exists per code. The room
  record is a JSON object with exactly code (string), seats (integer) and
  bookable (integer), where bookable is the room's bookable seats under
  [[Bookings.reserve]].
spec: {}
