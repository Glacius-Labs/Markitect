imports:
  - package: software
    as: Software
  - package: hall/rooms
    as: Rooms
  - package: hall/bookings
    as: Bookings
id: interface
kind: Software.Rule
body: |-
  From realization/, invoke [[system]] as:
  `python -B app.py --db PATH COMMAND ...`
  Use the Python 3.13 standard library; no network, service or external package.
  Every successful command writes exactly one JSON object to stdout and exits 0.
  Invalid input, an unknown or missing command or option, and every refusal
  write exactly one JSON object to stdout whose only field is error, holding an
  understandable nonempty string; they exit 2 and leave stored data unchanged.
  Expected failures never end in an unhandled crash. Exact error wording is free.

  Commands, each returning the record or object its use case names:
  - `add-room --code CODE --seats N` follows [[Rooms.add-room]].
  - `rooms` follows [[Rooms.list-rooms]].
  - `book --code CODE --seats N` follows [[Bookings.book]].
  - `bookings [--code CODE]` follows [[Bookings.list-bookings]].

  [[inputs]] governs values and [[storage]] governs the data file. Automated
  tests are test_*.py modules in importable packages below realization/; from
  realization/, `python -B -m unittest discover -s . -p "test_*.py"` runs all
  of them, as [[realization]] requires. These fixed entry points do not
  prescribe any other module organization.
spec: {}
