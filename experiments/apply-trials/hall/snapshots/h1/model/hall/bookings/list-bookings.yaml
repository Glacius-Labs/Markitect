imports:
  - package: software
    as: Software
  - package: hall
    as: Hall
  - package: hall/rooms
    as: Rooms
id: list-bookings
kind: Software.UseCase
body: |-
  At [[Hall.interface]], `bookings` returns an object whose only field,
  bookings, holds every [[booking]] record, sorted by id. With `--code CODE` it holds
  only the bookings of that room; the code follows [[Rooms.room-code]] and must
  name an existing room. Without --code, a missing data file is an empty
  result under [[Hall.storage]]. The query never changes stored data.
spec: {}
