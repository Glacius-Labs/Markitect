imports:
  - package: software
    as: Software
  - package: hall
    as: Hall
  - package: hall/rooms
    as: Rooms
id: book
kind: Software.UseCase
body: |-
  At [[Hall.interface]], `book --code CODE --seats N` takes a room code under
  [[Rooms.room-code]] that must name an existing room and the seats of a
  booking under [[Hall.inputs]]. It is admitted only when the seats already
  booked in that room plus N are at most the room's bookable seats under
  [[reserve]]; then it creates one [[booking]], commits it through
  [[Hall.storage]] and returns the booking record. Otherwise it is refused
  with stored data unchanged. Bookings of other rooms do not count.
spec: {}
