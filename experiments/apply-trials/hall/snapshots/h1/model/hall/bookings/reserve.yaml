imports:
  - package: software
    as: Software
  - package: hall
    as: Hall
  - package: hall/rooms
    as: Rooms
id: reserve
kind: Software.Rule
body: |-
  Every [[Rooms.room]] holds back the same number of its seats from booking:
  the reserve. The reserve is one whole number from 0 to 2, the same for every
  room; the bookings part chooses it, and the README of [[Hall.realization]]
  states it. The bookable seats of a room are its seats minus the reserve.
  [[book]] never lets the seats of all bookings of a room exceed its bookable
  seats, and the room record of [[Rooms.room]] shows the same bookable seats.
spec: {}
