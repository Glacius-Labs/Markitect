imports:
  - package: software
    as: Software
id: item
kind: Software.Concept
body: |-
  An item of [[system]] has a SKU, a name and an on-hand quantity. [[add-item]]
  creates it with on-hand 0. The SKU identifies the item: at most one item
  exists per SKU after the normalization of [[inputs]]. The name is a
  descriptive label and need not be unique. The on-hand quantity is a whole
  number that changes only through [[receive]] and [[issue]] and always stays
  within [[stock-limits]]. The public record has exactly the fields sku, name
  and onHand, as [[interface]] returns it.
spec: {}
