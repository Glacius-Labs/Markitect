imports:
  - package: software
    as: Software
id: add-item
kind: Software.UseCase
body: |-
  At [[interface]], `add-item --sku SKU --name NAME` creates one [[item]] with
  the normalized SKU and name of [[inputs]] and on-hand 0, commits it through
  [[storage]] and returns the new record. An invalid SKU or name, or a SKU that
  already exists after normalization, is refused with stored data unchanged.
  Other items are not changed.
spec: {}
