imports:
  - package: software
    as: Software
id: interface
kind: Software.Rule
body: |-
  From realization/, invoke [[system]] as:
  `python -B app.py --db PATH COMMAND ...`
  Use the Python 3.13 standard library; no network, service or external package.
  Every successful command writes exactly one JSON object to stdout and exits 0.
  Invalid input, an unknown or missing command or option, and every refusal
  write exactly one JSON object to stdout whose only field is error, holding an
  understandable nonempty string; they exit 2 and leave stored data unchanged.
  Expected failures never end in an unhandled crash. Exact error wording is free.

  Commands:
  - `add-item --sku SKU --name NAME` follows [[add-item]] and returns the record.
  - `receive --sku SKU --qty N` follows [[receive]] and returns the record.
  - `issue --sku SKU --qty N` follows [[issue]] and returns the record.
  - `list` follows [[list]] and returns {"items": [...]}.

  An [[item]] record is a JSON object with exactly sku (string), name (string)
  and onHand (integer). [[inputs]] governs values and [[storage]] governs the
  data file. From realization/, `python -B -m unittest discover -s tests` runs
  the automated tests that [[realization]] requires. These fixed entry points do
  not prescribe the internal module organization.
spec: {}
