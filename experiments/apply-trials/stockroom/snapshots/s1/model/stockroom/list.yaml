imports:
  - package: software
    as: Software
id: list
kind: Software.UseCase
body: |-
  At [[interface]], `list` returns an object whose items field holds every
  [[item]] record, sorted by normalized SKU in ascending code-point order. With
  no items the array is empty; a missing data file is such an empty result
  under [[storage]]. The query never changes stored data.
spec: {}
