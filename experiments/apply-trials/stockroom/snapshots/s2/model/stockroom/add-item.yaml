imports:
  - package: software
    as: Software
id: add-item
kind: Software.UseCase
body: |-
  At [[interface]], `add-item --sku SKU --name NAME [--reorder N]` creates one
  [[item]] with the normalized SKU and name of [[inputs]], on-hand 0 and the
  given reorder point, or reorder point 0 when --reorder is omitted. It commits
  the item through [[storage]] and returns the new record. An invalid SKU, name
  or reorder point, or a SKU that already exists after normalization, is
  refused with stored data unchanged. Other items are not changed.
spec: {}
