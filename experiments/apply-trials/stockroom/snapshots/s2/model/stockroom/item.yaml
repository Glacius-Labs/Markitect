imports:
  - package: software
    as: Software
id: item
kind: Software.Concept
body: |-
  An item of [[system]] has a SKU, a name, an on-hand quantity and a reorder
  point. [[add-item]] creates it with on-hand 0 and its reorder point. The SKU
  identifies the item: at most one item exists per SKU after the normalization
  of [[inputs]]. The name is a descriptive label and need not be unique. The
  on-hand quantity is a whole number that changes only through [[receive]] and
  [[issue]] and always stays within [[stock-limits]]. The reorder point is a
  whole number from 0 to 9999 that does not change after the item was added;
  the item is low when its on-hand quantity is below its reorder point. The
  public record has exactly the fields sku, name, onHand and reorderPoint, as
  [[interface]] returns it.
spec: {}
