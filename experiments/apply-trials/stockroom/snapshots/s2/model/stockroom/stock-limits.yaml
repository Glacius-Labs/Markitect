imports:
  - package: software
    as: Software
id: stock-limits
kind: Software.Rule
body: |-
  The on-hand quantity of an [[item]] is never negative and never exceeds 9999.
  A [[receive]] that would raise it above 9999 is refused; reaching exactly
  9999 is allowed. An [[issue]] of more than the current on-hand quantity is
  refused; issuing exactly the on-hand quantity is allowed and leaves 0. A
  refusal fails through [[interface]] and leaves stored data unchanged under
  [[storage]].
spec: {}
