apiVersion: markitect.registry/v1
artifacts:
  - path: realization/README.md
    form: doc
    realizes: [stockroom/realization, stockroom/interface, stockroom/inputs, stockroom/stock-limits, stockroom/storage]
    why: Documents the commands, inputs, limits, output, data file and the single-writer limitation.
  - path: realization/app.py
    form: code
    realizes: [stockroom/interface, stockroom/add-item, stockroom/receive, stockroom/issue, stockroom/list]
    why: Parses the command line, runs one command and writes the JSON result or error object with its exit code.
  - path: realization/limits.json
    form: config
    realizes: [stockroom/inputs, stockroom/stock-limits]
    why: Holds the quantity, on-hand and name-length limit values that the stock rules read.
  - path: realization/stockroom.py
    form: code
    realizes: [stockroom/item, stockroom/inputs, stockroom/stock-limits, stockroom/add-item, stockroom/receive, stockroom/issue, stockroom/list]
    why: Validates inputs and applies the item and stock-limit rules of every command.
  - path: realization/store.py
    form: code
    realizes: [stockroom/storage]
    why: Reads and validates the data file and replaces it atomically.
  - path: realization/tests/test_cli.py
    form: test
    realizes: [stockroom/interface, stockroom/storage, stockroom/add-item, stockroom/receive, stockroom/issue, stockroom/list]
    why: Exercises the command line end to end, including refusals that leave the data file unchanged.
  - path: realization/tests/test_rules.py
    form: test
    realizes: [stockroom/inputs, stockroom/stock-limits, stockroom/item, stockroom/list]
    why: Tests the input normalization, quantity and on-hand limits and list order.
