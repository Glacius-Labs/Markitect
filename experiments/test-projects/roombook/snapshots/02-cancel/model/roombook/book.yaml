imports:
  - package: software
    as: Software
id: book
kind: Software.UseCase
body: |-
  At [[interface]], accept --room, --start, --end and --title under [[inputs]].
  Admit a reservation only when all inputs are valid and no conflict exists under
  [[availability]]. Success creates one active [[reservation]], assigns its new
  integer identifier, commits it durably through [[storage]] and returns that
  record. Preserve all other records. Invalid input or a same-room active overlap
  returns the existing error envelope with exit 2 and unchanged stored state.
  Adjacent intervals are permitted, as are overlapping intervals in other rooms.
spec: {}
