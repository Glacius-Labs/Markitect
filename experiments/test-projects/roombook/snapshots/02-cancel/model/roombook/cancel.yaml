imports:
  - package: software
    as: Software
id: cancel
kind: Software.UseCase
body: |-
  At [[interface]], `cancel --id INTEGER` identifies a stored [[reservation]] by
  its integer id. Success changes its status to canceled, preserves every other
  field and all other records, commits through [[storage]], and returns that record.
  Repeated cancellation of an already canceled record succeeds idempotently and
  returns the existing record. A missing/unknown or invalid id fails through the
  existing error envelope with exit 2 and unchanged stored state. Retain canceled
  history in [[list]]; its interval no longer blocks [[availability]], so a later
  valid [[book]] may use that interval. Never reuse the canceled record's id.
spec: {}
