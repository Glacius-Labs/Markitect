imports:
  - package: software
    as: Software
id: availability
kind: Software.Rule
body: |-
  For [[book]], active [[reservation|reservations]] in the same normalized room
  must not overlap. Treat intervals as half-open: an end equal to another start
  is allowed. Intersecting active intervals in the same room cause refusal through
  [[interface]] without changing [[storage]]. Reservations in different rooms do
  not conflict. Canceled records remain history but no longer block that room.
  [[cancel]] releases an active reservation interval by changing only its status.
spec: {}
