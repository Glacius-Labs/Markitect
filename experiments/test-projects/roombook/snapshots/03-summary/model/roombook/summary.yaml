imports:
  - package: software
    as: Software
id: summary
kind: Software.UseCase
body: |-
  At [[interface]], `summary` returns an object with rooms, an array of objects
  with room, active and minutes, in lexical room order. Group only currently active
  [[reservation|reservations]]. For each included room, active is their count and
  minutes is the sum of their exact UTC-minute durations. Omit every room without
  an active reservation, including rooms whose only history is canceled by
  [[cancel]]. Thus empty state and all-canceled state both return an empty rooms
  array. Canceled history remains available through [[list]]. This query changes
  no stored state and uses the existing [[storage]]/[[interface]] failure contract.
spec: {}
