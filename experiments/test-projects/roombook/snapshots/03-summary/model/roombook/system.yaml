imports:
  - package: software
    as: Software
id: system
kind: Software.Concept
body: |-
  A small local room reservation CLI supports [[book]], [[list]] and [[cancel]] for one
  operator. [[reservation]] describes the records, [[availability]] governs
  conflicts, and [[inputs]], [[storage]] and [[interface]] govern every command.
  [[realization]] requires code, meaningful tests and usage documentation. This
  is greenfield: no application or test implementation is supplied. Use Python
  3.13 standard library, with no service, network or package installation.
  Internal source organization is free within the public command boundary.
  [[summary]] reports active reservation counts and exact minutes per room.
spec: {}
