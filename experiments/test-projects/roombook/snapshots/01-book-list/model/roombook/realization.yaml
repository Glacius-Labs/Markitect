imports:
  - package: software
    as: Software
id: realization
kind: Software.Rule
body: |-
  Deliver working code, meaningful automated tests and current README usage for
  [[system]] and every currently modeled command. Keep code, tests and docs
  consistent with [[reservation]], [[inputs]], [[storage]], [[availability]] and
  [[interface]]. Document run/test commands, JSON output, failures without
  mutation, persistent data behavior and the lack of concurrent independent-writer
  or distributed-system guarantees. The fixture supplies no application, tests,
  reference solution or expected-outcome evaluator. Internal organization is free
  within the Python standard-library command/test boundary.
spec: {}
