apiVersion: markitect.execution/v1
strategy: recursive-apply-v1
limits:
  maxRuns: 5
  maxSessionStarts: 160
  maxSteps: 320
  maxExecutionTime: 16h
  maxStepTimeout: 10m
  hostOperationTimeout: 2m
  maxRejectionLimit: 3
  maxContextBytes: 400000
  maxSessionSteps: 40
  maxTransientRetries: 2
  creationRoots: [realization]
assignment:
  runs: 3
  sessionStarts: 80
  steps: 160
  executionTime: 8h
completionReserve:
  sessionStarts: 24
  steps: 40
  executionTime: 2h
defaults:
  profiles:
    manager: roombook-agent
    reviewer: roombook-agent
  rejectionLimit: 3
  batchNoChangeReviews: false
  stepTimeout: 10m
  creationRoots: [realization]
packages: {}
checks:
  - id: project-tests
    profile: python-tests
    directory: realization
    args: [-B, -m, unittest, discover, -s, tests]
    requiredBy: roombook/interface
    timeout: 2m
acceptance:
  ownerApproval: []
