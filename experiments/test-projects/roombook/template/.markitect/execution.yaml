apiVersion: markitect.execution/v1
strategy: staged
budget:
  executionTime: 20m
  turnTimeout: 8m
  agentTurns: 60
  passes: 8
profiles:
  execute: roombook-agent
  verify: roombook-agent
packages: {}
ownership:
  - path: ./
    owner: .
    reason: Root coordinates and owns the files outside the delivery directory.
  - path: realization/
    owner: roombook
    reason: The fixed delivery boundary puts app.py and tests/ directly in realization/; the single domain Package realizes them and Root keeps only coordination.
checks:
  - id: project-tests
    profile: python-tests
    directory: realization
    args: [-B, -m, unittest, discover, -s, tests]
    requiredBy: roombook/interface
    timeout: 2m
