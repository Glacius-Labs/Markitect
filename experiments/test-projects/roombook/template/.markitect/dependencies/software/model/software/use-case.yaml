imports:
  - package: markitect/core
    as: Core
id: UseCase
kind: Core.Kind
body: >-
  Describes an operation available to an actor: its inputs, conditions, successful
  outcome and expected refusals. The body specifies observable state changes or
  read-only behavior and connects the relevant concepts and rules. A UseCase does
  not choose a transport, implementation file or Agent team.
