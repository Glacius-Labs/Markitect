apiVersion: markitect.execution/v1
strategy: shared-workspace-v1
budget:
  executionTime: 8h
  turnTimeout: 10m
  agentTurns: 160
  rounds: 4
profiles:
  execute: readinglog-agent
  verify: readinglog-agent
packages: {}
checks:
  - id: project-tests
    profile: python-tests
    directory: realization
    args: [-B, -m, unittest, discover, -s, tests]
    requiredBy: readinglog/interface
    timeout: 2m
