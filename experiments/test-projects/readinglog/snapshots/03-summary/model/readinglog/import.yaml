imports:
  - package: software
    as: Software
id: import
kind: Software.UseCase
body: |-
  At [[interface]], `import --csv PATH` reads a UTF-8 CSV with exactly the header
  id,title,author,pages in that order. Reject incorrect, missing or extra columns.
  Validate the entire file before changing [[storage]], using the same text
  normalization, positive integer pages and case-sensitive IDs as [[add]] and
  [[inputs]]. Reject invalid rows, duplicate IDs within the file or IDs already
  stored; any invalid input rejects the entire import without changing data.
  On success append unread [[book|books]] in CSV input order and commit atomically
  through [[storage]]. Return an object with imported equal to the imported count.
  A file containing only the valid header imports zero. Existing records and their
  order remain intact. Expected file/CSV/input failures use the existing error
  object and exit code from [[interface]].
spec: {}
