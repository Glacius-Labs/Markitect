imports:
  - package: software
    as: Software
id: list
kind: Software.UseCase
body: |-
  At [[interface]], return an object with books containing every stored [[book]],
  including unread and finished records, in insertion order. A missing data file
  returns an empty array. Apply [[storage]] to malformed existing data. This is a
  read-only operation: never change or rewrite the database.
  The optional `--status unread|finished` filter selects that exact status while
  preserving insertion order. Without a filter, retain every status and the
  existing books envelope. An invalid filter is an input error at [[interface]].
spec: {}
