imports:
  - package: software
    as: Software
id: add
kind: Software.UseCase
body: |-
  Given --id, --title, --author and --pages at [[interface]], normalize and validate
  through [[inputs]], then add exactly one [[book]] with those fields and unread
  status. Reject an ID already in [[storage]], including after command-input
  normalization, without changing data or replacing its record. Names and authors
  need not be unique. Return the created record and commit it atomically through
  [[storage]]. Other records and their insertion order remain unchanged.
spec: {}
