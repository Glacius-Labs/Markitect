imports:
  - package: software
    as: Software
  - package: library
    as: Library
  - package: members
    as: Members
id: inspect-loans
kind: Software.UseCase
body: >-
  Support inspection of a known [[loan]] by its identifier, returning its loan,
  member and copy identifiers, borrowing and due dates, open or closed state,
  and return date when closed. Also support inspecting a known [[Members.member]]
  for its currently open loans and count, following [[loan-policy]]. An empty
  list and zero count are valid. Unknown or invalid requested identifiers are
  refused under [[Library.inputs]]. Both queries are read-only and describe
  current state; returned loan order is unrestricted.
spec: {}
