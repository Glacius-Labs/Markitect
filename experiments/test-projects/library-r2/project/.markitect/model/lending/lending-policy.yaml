imports:
  - package: markitect/core
    as: Core
id: LendingPolicy
kind: Core.Kind
body: >-
  States the numeric admission limit and calendar-day duration used for new
  loans in its stated scope. Both required values must be positive integers.
  The individual policy connects the operations and explains how the values
  apply. Values do not authorize deletion or forced return of existing loans.
spec:
  properties:
    - maxOpenLoans
    - loanPeriodDays
