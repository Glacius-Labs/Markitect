imports:
  - package: software
    as: Software
  - package: library
    as: Library
  - package: members
    as: Members
  - package: catalog
    as: Catalog
id: borrow
kind: Software.UseCase
body: >-
  The operator supplies a [[Members.member]] identifier, a [[Catalog.copy]]
  identifier and a borrowing date under [[Library.inputs]] in [[Library.library]].
  Admit the request only when the member is registered and active under
  [[Members.eligibility]], the copy is registered and available under
  [[Catalog.availability]], and the resulting open-loan count satisfies
  [[loan-policy]]. The borrowing date must also permit the due date calculated
  with that exact policy interval to remain within the Gregorian date range in
  [[Library.callable-interface]]. If the calculated due date is outside that
  range, refuse the request with an understandable reason and no observable
  state change; never truncate the interval or widen the date representation.
  Success creates exactly one open [[loan]], returns its
  identifier and due date, makes the copy unavailable and increases the
  member's open-loan count by one. Other members and copies remain unchanged.
  Unknown members or copies, suspension, an already borrowed copy, a reached
  limit or invalid inputs cause refusal with no loan created and no observable
  state change. Repeating a successful request for the same copy is refused
  because it is now borrowed; this is a new transaction, not a retry-safe
  command with duplicate-request detection.
spec: {}
