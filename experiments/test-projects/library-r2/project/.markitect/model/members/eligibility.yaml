imports:
  - package: software
    as: Software
  - package: lending
    as: Lending
id: eligibility
kind: Software.Rule
body: >-
  Only a registered active [[member]] may start [[Lending.borrow|a new loan]].
  Suspension prevents new borrowing but preserves every existing [[Lending.loan]],
  including its due date and open state. It does not prevent [[Lending.return]].
  Restoring active status removes the suspension restriction; all other borrowing
  conditions still apply. Lending must enforce this membership rule when
  admitting a new loan, rather than relying on membership status being checked
  somewhere else.
spec: {}
