imports:
  - package: software
    as: Software
  - package: library
    as: Library
id: member
kind: Software.Concept
body: >-
  A registered member of [[Library.library]] has a unique stable identifier,
  a nonempty name and a status, active or suspended. Different members may have
  the same name. Identifier and name follow [[Library.inputs]] and remain
  unchanged after registration. Registration creates an active member.
  The status controls borrowing according to [[eligibility]]. This describes
  the member concept; it does not pre-create any live members.
spec: {}
