imports:
  - package: software
    as: Software
  - package: lending
    as: Lending
id: availability
kind: Software.Rule
body: >-
  A registered [[copy]] is available exactly when it has no open [[Lending.loan]].
  Across all members, at most one open loan may refer to the same copy.
  [[Lending.borrow]] must enforce availability and makes the copy unavailable
  by creating an open loan. [[Lending.return]] releases the copy only when it
  closes that copy's current open loan. Availability is derived from loans;
  there is no independent stock count. Returning an old closed loan cannot
  release a copy now held by a newer open loan.
spec: {}
