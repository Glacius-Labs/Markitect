apiVersion: markitect.execution/v1
strategy: direct
budget:
  executionTime: 8h
  turnTimeout: 10m
  agentTurns: 160
  passes: 10
profiles:
  execute: library-agent
  verify: library-agent
packages: {}
ownership:
  - path: ./
    owner: .
    reason: Root owns the project-level files, such as the Go module and the documentation of the whole realization.
  - path: realization/catalog/
    owner: catalog
  - path: realization/lending/
    owner: lending
  - path: realization/lending/reminders/
    owner: lending/reminders
  - path: realization/library/
    owner: library
  - path: realization/members/
    owner: members
  - path: realization/cmd/library/
    owner: library
    reason: library/callable-interface fixes the executable at realization/cmd/library.
checks:
  - id: project-tests
    profile: library-tests
    directory: realization
    args: [test, ./...]
    requiredBy: library/callable-interface
    timeout: 2m
