    - path: .artifacts/autonomous-ab-gauntlet/ops-v3-t1a-assessment-plan-v1.json
      sha256: b161e6e2f82ca93c776200fc3f37f052c66ad6f5cddddab40edd380ce5bb89b2
    - path: external/postrun-ops-a1-plan-review-v1.yaml
      sha256: 854a967306424c95f1a375734beef02ae1849a1b6df1bd8d557c438e169dcf70
    - path: external/postrun-copy-tools-v4-2026-10-05/final-review-v1.yaml
      sha256: 6585919c9ae6b07d080c53710f3538b0daef86ac184c0e18169428a3653330fa
  method: static source/plan review only; driver not executed
  excluded:
    - arena operation or source-native reread
