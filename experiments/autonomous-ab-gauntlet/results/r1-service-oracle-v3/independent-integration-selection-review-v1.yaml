  static_binding_result: matches
  runtime_metadata_result: matches planned task/evaluation-task/prior-through/marker fields; direct child is recorded completed with exit 0 for both captures
  ordinary_task_08_caveat: Its expected-affected/escalation metadata cannot establish combined integration truth; it represents only origin task 08. The integration selector uses P01/P02 scopes and cumulative vectors through task 08.
  integration_truth: not adjudicated. Raw evaluator status remains descriptive; ordinary Task 08 expectations do not establish that the combined integration is correct.
  comparison: paired trial 1 is excluded; this review does not reinstate comparison eligibility or human acceptance.
limitations:
  - Runtime command arguments are not separately serialized in the permitted public result fields; exact argv was not recovered from logs.
  - Static selector correctness and matching native/plan metadata prove intended selection, not semantic correctness of the integrated application.
  - No task 09-12, B-arm, holdout, actor response/patch, or evaluator output payload was inspected for this review.