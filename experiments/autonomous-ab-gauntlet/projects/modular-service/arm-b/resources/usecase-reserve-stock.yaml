apiVersion: architecture.markitect.org/v1alpha1
kind: UseCase
metadata:
  name: reserve-stock
  namespace: architecture
  labels:
    feature-ownership: required
spec:
  handler: {kind: Handler, name: reserve-stock, namespace: architecture}
  intent: Command
  module: {kind: Module, name: inventory, namespace: architecture}
  feature: {kind: Feature, name: stock-management, namespace: architecture}
  summary: Reserve positive requested quantity while stock is available.
