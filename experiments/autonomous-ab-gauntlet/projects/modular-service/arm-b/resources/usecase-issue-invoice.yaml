apiVersion: architecture.markitect.org/v1alpha1
kind: UseCase
metadata:
  name: issue-invoice
  namespace: architecture
  labels:
    feature-ownership: required
spec:
  handler: {kind: Handler, name: issue-invoice, namespace: architecture}
  intent: Command
  module: {kind: Module, name: billing, namespace: architecture}
  feature: {kind: Feature, name: invoicing, namespace: architecture}
  summary: Issue one positive-amount invoice for a stable order identifier.
