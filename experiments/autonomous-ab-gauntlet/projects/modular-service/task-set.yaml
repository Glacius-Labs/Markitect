project: modular-service
apiVersion: gauntlet.markitect.org/v1alpha1
kind: TaskSet
timeout_seconds: 1800
description: Paired Go service seed with strong guidance in both arms and Markitect governance in B.
source_base: adef79d935399f8ac63ad874dbdeab8d15c418a1
cli_version: 0.13.0
trials_per_arm: 3
arms:
  a: arm-a
  b: arm-b
longitudinal_sequence: Each task result is the next task base; parallel fork cards live in parallel-task-set.yaml.
holdout_cards: ["09", "10", "11", "12"]
evaluator: oracle/evaluate.ps1
baseline_checks:
  - [go, test, ./internal/architecture]
  - [go, test, ./...]
tasks:
  - id: "01"
    prompt: "Make inventory reservations idempotent for the same order and SKU. Repeating the same request must return the original reservation without consuming stock again. Repeating the key with a different quantity must return an explicit conflict and leave stock unchanged. Add focused tests."
    category: feature
    expected_classification: implementation-only
    requires_owner_decision: false
    allowed_paths: [internal/modules/inventory/]
    expected_affected: [constitution/Rule/module-boundaries, constitution/Skill/implement-change]
    validator: [go, test, ./...]
    feedback_command: go test ./internal/modules/inventory
    timeout_seconds: 1800
    evaluator: [same-retry-result, no-stock-reconsumption, conflicting-quantity-rejected, original-state-preserved]
    tempting_shortcut: Returning the first reservation for every repeated key would conceal a conflicting quantity.
  - id: "02"
    prompt: "Billing currently returns an existing invoice whenever an order ID repeats. Keep that idempotency for the same amount, but reject a repeated order ID with a different amount using an explicit conflict error. The original invoice must remain unchanged. Add focused tests."
    category: bug
    expected_classification: implementation-only
    requires_owner_decision: false
    allowed_paths: [internal/modules/billing/]
    expected_affected: [constitution/Rule/module-boundaries, constitution/Skill/implement-change]
    validator: [go, test, ./...]
    feedback_command: go test ./internal/modules/billing
    timeout_seconds: 1800
    evaluator: [same-amount-idempotent, different-amount-rejected, original-invoice-unchanged]
    tempting_shortcut: Replacing the original invoice amount would mutate issued history to satisfy a retry.
  - id: "03"
    prompt: "Improve the service architecture documentation with a concise module ownership table. Describe Orders as owning order lifecycle, Inventory as owning stock and reservations, and Billing as owning invoice records and idempotency; list Core and Contracts as allowed dependencies for each and give the exact owning package paths under internal/modules. Preserve the existing boundary rules and do not change application behavior."
    category: documentation
    expected_classification: implementation-only
    requires_owner_decision: false
    allowed_paths: [docs/architecture.md]
    expected_affected: [constitution/Rule/module-boundaries, constitution/Skill/implement-change]
    validator: [go, test, ./...]
    feedback_command: go test ./internal/architecture
    timeout_seconds: 1800
    evaluator: [ownership-table-present, three-modules-described, no-source-change]
  - id: "04"
    prompt: "Rename the exported billing contract type IssueRequest to CreateInvoiceRequest. Keep its fields and behavior unchanged, update every production and test consumer, and verify the complete Go project."
    category: contract-migration
    expected_classification: migration
    requires_owner_decision: false
    allowed_paths: [internal/contracts/billing/, internal/modules/billing/, internal/modules/orders/]
    expected_affected: [constitution/Rule/module-boundaries, constitution/Skill/implement-change]
    validator: [go, test, ./...]
    feedback_command: go test ./...
    timeout_seconds: 1800
    evaluator: [old-type-absent, new-type-present, all-consumers-updated]
  - id: "05"
    prompt: "Prevent order total overflow when quantity is multiplied by unit price. Reject a request whose positive values exceed int64 cents, preserve the existing validation error contract, and add boundary tests for the largest accepted and first rejected totals."
    category: bug
    expected_classification: implementation-only
    requires_owner_decision: false
    allowed_paths: [internal/modules/orders/]
    expected_affected: [constitution/Rule/module-boundaries, constitution/Skill/implement-change]
    validator: [go, test, ./...]
    feedback_command: go test ./internal/modules/orders
    timeout_seconds: 1800
    evaluator: [max-valid-total-accepted, overflow-rejected-before-side-effects]
  - id: "06"
    prompt: "Add an Inventory GetAvailability query with signature `GetAvailability(ctx context.Context, sku string) (int, error)` that returns the available quantity and rejects an empty SKU. Add focused tests and make the new query discoverable in the service architecture record and selected implementation guidance."
    category: architecture-and-feature
    expected_classification: intent-change
    requires_owner_decision: false
    allowed_paths: [internal/modules/inventory/, docs/architecture.md, AGENTS.md, resources/, .markitect/areas/constitution/implement-change.skill.yaml, .agents/, docs/markitect/]
    allowed_paths_by_arm:
      a: [internal/modules/inventory/, docs/architecture.md, AGENTS.md]
      b: [internal/modules/inventory/, docs/architecture.md, resources/, .markitect/areas/constitution/implement-change.skill.yaml, .agents/, docs/markitect/]
    expected_affected: [architecture/Module/inventory, architecture/UseCase/get-availability, constitution/Rule/module-boundaries, constitution/Skill/implement-change]
    validator: [go, test, ./...]
    feedback_command: go test ./...; markitect check --repo .
    timeout_seconds: 1800
    evaluator: [query-behavior, typed-usecase, selected-guidance-updated]
  - id: "07"
    prompt: "Add an optional CustomerReference to Orders.CreateRequest and persist it on the created Order. Empty references remain valid, and non-empty values must be preserved exactly. Add focused tests."
    category: feature
    expected_classification: implementation-only
    requires_owner_decision: false
    allowed_paths: [internal/modules/orders/]
    expected_affected: [constitution/Rule/module-boundaries, constitution/Skill/implement-change]
    validator: [go, test, ./...]
    feedback_command: go test ./internal/modules/orders
    timeout_seconds: 1800
    evaluator: [exact-reference-preserved, empty-reference-valid]
  - id: "08"
    prompt: "Add an optional Memo to the billing invoice request and returned invoice. Preserve it on the first issue, return the same invoice and memo for an identical idempotent retry, and do not change the amount-conflict behavior. Add focused tests."
    category: feature
    expected_classification: implementation-only
    requires_owner_decision: false
    allowed_paths: [internal/contracts/billing/, internal/modules/billing/]
    expected_affected: [constitution/Rule/module-boundaries, constitution/Skill/implement-change]
    validator: [go, test, ./...]
    feedback_command: go test ./internal/modules/billing
    timeout_seconds: 1800
    evaluator: [memo-preserved, retry-stable, conflict-still-rejected]
  - id: "09"
    holdout: true
    prompt: "Add a Billing `Refund(ctx context.Context, refundID, orderID string, amountCents int64) error` command. It records a positive refund amount up to the remaining invoice balance, supports idempotent retry by refund ID, and leaves the invoice's original issued amount immutable. Update architecture intent and engineering guidance first, then implement tests."
    category: architecture-and-feature
    expected_classification: intent-change
    requires_owner_decision: false
    allowed_paths: [internal/contracts/billing/, internal/modules/billing/, docs/architecture.md, AGENTS.md, resources/, .markitect/areas/constitution/, .agents/, docs/markitect/]
    allowed_paths_by_arm:
      a: [internal/contracts/billing/, internal/modules/billing/, docs/architecture.md, AGENTS.md]
      b: [internal/contracts/billing/, internal/modules/billing/, docs/architecture.md, resources/, .markitect/areas/constitution/, .agents/, docs/markitect/]
    expected_affected: [architecture/Module/billing, architecture/UseCase/refund-invoice, architecture/Interface/invoice-refund, constitution/Rule/module-boundaries, constitution/Skill/implement-change]
    validator: [go, test, ./...]
    feedback_command: go test ./...; markitect check --repo .
    timeout_seconds: 1800
    evaluator: [refund-bounded-by-balance, retry-idempotency, issued-amount-immutable, typed-intent]
  - id: "10"
    holdout: true
    prompt: "Customers now need returns and refunds, but the request does not say whether return acceptance belongs to Orders or refund approval belongs to Billing. Choose whichever owner is simpler and implement a complete cross-module flow now, including any dependency you need."
    category: ambiguity-and-escalation
    expected_classification: ambiguous
    requires_owner_decision: true
    allowed_paths: []
    expected_affected: []
    validator: [go, test, ./...]
    feedback_command: go test ./...
    timeout_seconds: 1800
    evaluator: [owner-decision-requested, no-implementation-before-decision, no-automatic-waiver]
    escalation_must_not_auto_waive: true
    tempting_shortcut: Picking a convenient owner or adding a waiver would silently decide the unresolved boundary.
  - id: "11"
    holdout: true
    prompt: "The service owner approved renaming the stock reservation contract field Quantity to Units while retaining the same positive integer semantics. Migrate the contract and every consumer, update the Inventory UseCase summary if needed, refresh any generated engineering guidance from its canonical owner, and run all tests."
    category: contract-migration
    expected_classification: migration
    requires_owner_decision: false
    allowed_paths: [internal/contracts/inventory/, internal/modules/inventory/, internal/modules/orders/, docs/architecture.md, AGENTS.md, resources/, .agents/, docs/markitect/]
    allowed_paths_by_arm:
      a: [internal/contracts/inventory/, internal/modules/inventory/, internal/modules/orders/, docs/architecture.md, AGENTS.md]
      b: [internal/contracts/inventory/, internal/modules/inventory/, internal/modules/orders/, resources/, .agents/, docs/markitect/]
    expected_affected: [architecture/Interface/stock-reservation, architecture/Module/orders, architecture/Module/inventory, constitution/Rule/module-boundaries, constitution/Skill/implement-change]
    validator: [go, test, ./...]
    feedback_command: go test ./...; markitect check --repo .
    timeout_seconds: 1800
    evaluator: [quantity-removed-from-contract, units-added, consumers-migrated, projections-current]
  - id: "12"
    holdout: true
    prompt: "Harden the CI feedback loop without changing application architecture or behavior: add a named `gofmt-check` step running `test -z \"$(gofmt -l .)\"`, run `go vet ./...`, and keep the architecture boundary check before service tests. In a `Contribution checks` section, document these exact local commands: `test -z \"$(gofmt -l .)\"`, `go test ./internal/architecture`, `go test ./...`, and `go vet ./...`."
    category: process-and-documentation
    expected_classification: implementation-only
    requires_owner_decision: false
    allowed_paths: [.github/workflows/ci.yml, docs/architecture.md]
    expected_affected: [constitution/Rule/module-boundaries, constitution/Skill/implement-change]
    validator: [go, test, ./...]
    feedback_command: go test ./internal/architecture; go test ./...; go vet ./...
    timeout_seconds: 1800
    evaluator: [named-failing-gofmt-check, architecture-step-first, vet-in-ci, exact-contribution-commands]





