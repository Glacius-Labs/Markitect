      hash: sha256:77dd51692ed252962d067dfc9848b3d1c94237d66c99bdf5acccb61f8aab00be
      reason: declared input of engineering/Skill/implement-commerce
      text: |
        using Commerce.Billing.Contracts;
        using Commerce.Inventory.Contracts;
        using Commerce.Orders.Domain;
        namespace Commerce.Orders.Application.PlaceOrder;
        public sealed class PlaceOrderHandler(IStockAvailability stock, IPaymentAuthorizer payments)
        {
            public Order Handle(PlaceOrderCommand command)
            {
                var order = Order.Place(command.OrderId, command.CreatedAt, command.Lines);
                if (command.Lines.Any(line => !stock.CanReserve(line.ProductId, line.Quantity))) throw new InvalidOperationException("Insufficient stock.");
                if (!payments.CanAuthorize(command.PaymentToken, order.Total)) throw new InvalidOperationException("Payment could not be authorized.");
                return order;
            }
        }
    - key: file:src/Commerce/Orders/Domain/Order.cs
      path: src/Commerce/Orders/Domain/Order.cs
      hash: sha256:53aa47b98dd96090c70f3d9b1fe16267137a207ab3e9bc23134409f8ad30c841
      reason: declared input of engineering/Skill/implement-commerce
      text: |
        namespace Commerce.Orders.Domain;
        public sealed class Order
        {
            private Order(string id, DateTimeOffset createdAt, IReadOnlyList<OrderLine> lines) { Id = id; CreatedAt = createdAt; Lines = lines; }
            public string Id { get; }
            public DateTimeOffset CreatedAt { get; }
            public IReadOnlyList<OrderLine> Lines { get; }
            public OrderStatus Status { get; private set; } = OrderStatus.Open;
            public decimal Total => Lines.Sum(line => line.Total);
            public static Order Place(string id, DateTimeOffset createdAt, IReadOnlyList<OrderLine> lines)
            {
                if (string.IsNullOrWhiteSpace(id)) throw new ArgumentException("Order id is required.", nameof(id));
                if (lines.Count == 0) throw new ArgumentException("At least one line is required.", nameof(lines));
                if (lines.Any(line => string.IsNullOrWhiteSpace(line.ProductId) || line.Quantity <= 0 || line.UnitPrice < 0m)) throw new ArgumentException("Order lines require a product, positive quantity, and non-negative price.", nameof(lines));
                return new Order(id, createdAt, lines.ToArray());
            }
            public void MarkShipped() { if (Status != OrderStatus.Open) throw new InvalidOperationException("Only an open order can ship."); Status = OrderStatus.Shipped; }
        }
