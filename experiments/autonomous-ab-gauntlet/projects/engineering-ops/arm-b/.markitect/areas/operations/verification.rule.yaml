apiVersion: markitect.example.org/v1alpha1
kind: Rule
metadata:
    name: verification
    namespace: operations
spec:
    text: |
        CI and pre-commit both run root Go tests and nested-module Go tests; root go test ./... does not test the nested module. Run the configured Markitect artifact and hook/pipeline checks. The excluded testdata/vendor-snapshots tree is immutable parser-test input and has no production-policy ownership.
    files:
        - .githooks/pre-commit
        - .github/workflows/ci.yaml
        - .markitect/modules/githooks.config
        - .markitect/modules/pipelines.config
