name: CI
on: [push, pull_request]
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
      - name: Verify Markitect and declared checks
        run: markitect verify --repo . --revision $GITHUB_SHA
      - name: Root module tests
        run: go test ./...
      - name: Nested module tests
        run: go -C tools/process-sentinel test ./...
