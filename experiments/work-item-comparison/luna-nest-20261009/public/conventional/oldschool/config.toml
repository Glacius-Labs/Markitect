# In den pro Zelle vorbereiteten CODEX_HOME/config.toml übernehmen.
# Bestehende Authentifizierung wird von Scientist vorbereitet, niemals mitgeloggt.
model = "gpt-6-luna"
model_reasoning_effort = "high"
approval_policy = "never"
sandbox_mode = "workspace-write"

[features]
multi_agent = true

[agents]
max_threads = 4
max_depth = 2
