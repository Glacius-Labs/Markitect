apiVersion: project.markitect.example.org/v1alpha1
kind: Artifact
metadata:
  name: implementation
  namespace: ""
purpose: "Owns implementation representations of the accepted public contract"
spec:
  role: implementation
  realizes:
    - namespace: ""
      name: reservation
    - namespace: ""
      name: booking-contract
    - namespace: ""
      name: durable-state
  paths:
    - "app.py"
  checks:
    - namespace: ""
      name: project-tests
  required: true
  reason: "Expected realizations, not proof of implementation or genuine installation; validate at the owner setup boundary."
