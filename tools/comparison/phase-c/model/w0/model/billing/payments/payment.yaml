imports:
  - package: software
    as: Software
  - package: billing/invoices
    as: Invoices
id: payment
kind: Software.Concept
body: |-
  A payment pays one [[Invoices.invoice|invoice]]. The part of a payment that exceeds the invoice's balance becomes credit on the member's account. Admins can also [[issue-credit|issue credit]] as a goodwill gesture. Credit is applied automatically to the next invoices generated ([[Invoices.invoice|charges and invoices]]); it is never applied to an invoice that already exists.
spec: {}
