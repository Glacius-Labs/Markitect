id: create-reservation
kind: Software.UseCase
body: |-
  Operation `createReservation`. [[Workshop.request-processing|Request processing]] and [[Workshop.delivery|delivery]] apply.

  Mutation.

  - Arguments: `memberId` (identifier, an existing member), `machineId` (identifier, an existing machine), `start` (timestamp), `end` (timestamp).
  - Refusals, in this order:
    - `invalid_interval` when `end` is not after `start`;
    - `invalid_slot` when `start` or `end` is not on a 15-minute boundary or the length is outside 15 to 240 minutes;
    - `starts_in_past` when `start` is before the request time;
    - `outside_opening_hours` when the slot is not inside the opening hours of its start date;
    - `member_suspended` when the member is not in good standing;
    - `account_overdue` when the member is [[Invoices.blocked-member|blocked]];
    - `not_certified` when the member has no certification for the machine's family valid on the date of `start`;
    - `machine_in_maintenance` when a scheduled maintenance window of the machine overlaps the slot;
    - `machine_locked` when a [[Safety.lockout|lockout]] of the machine overlaps the slot;
    - `machine_booked` when another active reservation of the machine overlaps the slot;
    - `member_double_booked` when another active reservation of the member overlaps the slot.
  - Effect: creates the [[reservation|reservation]] with status `reserved`.
  - Result: `reservation`.

  Examples: on Sunday `2026-03-08`, `12:00`–`12:15` is accepted and `11:45`–`12:15` is refused with `outside_opening_hours`. On Friday `2026-03-06`, `19:45`–`20:00` is inside opening hours and `19:45`–`20:15` is not. On Tuesday `2026-03-03`, `10:15`–`10:30` is accepted and `10:10`–`10:30` is refused with `invalid_slot`.
spec: {}
