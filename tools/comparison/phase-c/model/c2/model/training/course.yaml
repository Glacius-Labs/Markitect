imports:
  - package: software
    as: Software
  - package: equipment/catalog
    as: Catalog
id: course
kind: Software.Concept
body: |-
  A course teaches the safe use of one [[Catalog.catalog|tool family]]. It has a fee and a capacity. A member [[enroll-in-course|enrolls]]; staff [[complete-course|record completion]], which [[certification|certifies]] the member for the course's family. There is one enrollment record per course and member. It is created by the first enrollment; a later enrollment after completion reuses and resets it.

  The course's `enrolledCount` is the number of its enrollments with status `enrolled`. A place becomes free when an enrollment is completed.
spec: {}
