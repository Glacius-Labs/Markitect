imports:
  - package: software
    as: Software
  - package: billing/invoices
    as: Invoices
  - package: safety
    as: Safety
  - package: workshop
    as: Workshop
id: revenue-report
kind: Software.UseCase
body: |-
  Operation `revenueReport`. [[Workshop.request-processing|Request processing]], [[Workshop.results|results]] and [[Workshop.delivery|delivery]] apply.

  Read. Summarizes billing for one month.

  - Arguments: `month` (month).
  - Result fields:
    - `month`;
    - `invoicesGenerated`: whether [[Invoices.invoice|invoices]] for the month have been generated;
    - `invoiceCount`: the number of invoices of the month;
    - `membershipCents`, `usageCents`, `materialCents`, `courseCents`: the sums of the [[Invoices.charge|line amounts]] of each kind on the invoices of the month;
    - `invoicedCents`: the sum of those four;
    - `creditAppliedCents`: the sum of `creditAppliedCents` over the invoices of the month;
    - `outstandingCents`: the sum of `balanceCents` over the invoices of the month at the request time;
    - `paymentsCents`: the sum of `amountCents` of all [[Invoices.payment|payments]] whose `at` lies in the month, for any invoice, including the parts that became credit;
    - `creditsIssuedCents`: the sum of [[Invoices.issue-credit|credits issued]] with `issueCredit` whose request time lies in the month, and of the [[Safety.lock-machine|lockout credits]] whose `lockMachine` request time lies in the month. Credit from overpayments is not included.
  - For a month without generated invoices, the invoice figures are 0 and `invoicesGenerated` is `false`; payments and issued credits are still reported.
spec: {}
