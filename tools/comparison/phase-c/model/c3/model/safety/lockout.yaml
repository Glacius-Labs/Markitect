id: lockout
kind: Software.Concept
body: |-
  Staff can use an open [[incident|incident]] to [[lock-machine|lock its machine]] for a time window. A lockout cancels the reservations that have not started being used in that window, gives each affected member a credit, prevents new reservations in the window and is excluded from the machine's available time in the [[Reporting.utilization-report|utilization report]].

  A lockout belongs to one incident and locks that incident's machine for an interval `[start, end)`. Like [[Maintenance.maintenance-window|maintenance windows]], lockouts may use any minute, are not limited to opening hours and may overlap each other and maintenance windows. An incident can have several lockouts. A lockout cannot be changed, cancelled or ended early; resolving its incident does not end it.

  A lockout never interrupts a checked-in session: a session already checked in when the lockout is created, and a session that overruns its reservation's end into a lockout, both keep metering until check-out. [[Maintenance.schedule-maintenance|Scheduling maintenance]] that overlaps a lockout is allowed, and a lockout never causes `reservation_conflict`.
