apiVersion: markitect.execution/v2
ownership:
  - {path: ./, owner: .}
  - {path: realization/billing/, owner: billing}
  - {path: realization/billing/invoices/, owner: billing/invoices}
  - {path: realization/bookings/, owner: bookings}
  - {path: realization/equipment/, owner: equipment}
  - {path: realization/equipment/catalog/, owner: equipment/catalog}
  - {path: realization/equipment/maintenance/, owner: equipment/maintenance}
  - {path: realization/materials/, owner: materials}
  - {path: realization/members/, owner: members}
  - {path: realization/members/memberships/, owner: members/memberships}
  - {path: realization/members/registry/, owner: members/registry}
  - {path: realization/policies/, owner: policies}
  - {path: realization/policies/audit/, owner: policies/audit}
  - {path: realization/policies/authorization/, owner: policies/authorization}
  - {path: realization/policies/money/, owner: policies/money}
  - {path: realization/policies/time/, owner: policies/time}
  - {path: realization/reporting/, owner: reporting}
  - {path: realization/safety/, owner: safety}
  - {path: realization/training/, owner: training}
  - {path: realization/workshop/, owner: workshop}
  - {path: realization/cmd/makerspace/, owner: workshop}
checks:
  - id: project-build
    profile: go
    directory: realization
    args: [build, ./cmd/makerspace]
    requiredBy: workshop/program
    timeout: 2m
  - id: project-tests
    profile: go
    directory: realization
    args: [test, ./...]
    requiredBy: workshop/delivery
    timeout: 5m
