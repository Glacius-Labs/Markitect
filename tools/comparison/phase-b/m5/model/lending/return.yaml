imports:
  - package: software
    as: Software
  - package: library
    as: Library
  - package: catalog
    as: Catalog
id: return
kind: Software.UseCase
body: >-
  The operator supplies a [[loan]] identifier and a valid return date on or
  after its borrowing date under [[Library.inputs]]. Return an open loan by
  closing exactly that loan and recording the date. The member's open-loan
  count decreases by one and the [[Catalog.copy]] becomes available under
  [[Catalog.availability]]. Neither overdue state nor the current limit in
  [[loan-policy]] blocks it. There is no fee or penalty. For a closed loan, a
  repeated return with a valid date on or after its borrowing date reports
  already returned and changes nothing, preserving the original return date.
  If its copy was lent again, the newer loan stays open and the copy stays
  unavailable. An unknown loan or a date before the borrowing date is refused
  without changing state. A copy identifier alone is insufficient to identify
  the transaction being returned.
spec: {}
