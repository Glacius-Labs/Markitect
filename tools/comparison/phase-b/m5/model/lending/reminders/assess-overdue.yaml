imports:
  - package: software
    as: Software
  - package: library
    as: Library
  - package: lending
    as: Lending
id: assess-overdue
kind: Software.UseCase
body: >-
  Given a valid explicit assessment date under [[Library.inputs]], calculate
  overdue notices for [[Library.library]]. Include exactly the currently open
  [[Lending.loan|loans]] whose due dates, established by [[Lending.loan-policy]],
  are strictly earlier than the assessment date. A loan due on that date is
  not yet overdue. Returned loans are excluded. Return exactly one notice per
  qualifying loan, identifying its loan, member, copy and due date, or an empty
  list when none qualify. Notice order is unrestricted. Send no message,
  schedule no job and change no library state. The same state and date yield
  the same notice contents. This is an assessment of current open loans, not a
  historical-state query; a loan already returned in current state remains
  excluded even when assessing an earlier date.
spec: {}
