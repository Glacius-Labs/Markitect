imports:
  - package: software
    as: Software
  - package: library
    as: Library
id: member
kind: Software.Concept
body: >-
  A registered member of [[Library.library]] has a unique stable identifier and
  a nonempty name. Different members may have the same name. Identifier and name
  follow [[Library.inputs]] and remain unchanged after registration. Members
  have no status: the library does not suspend members, and every registered
  member may borrow according to [[eligibility]]. This describes the member
  concept; it does not pre-create any live members.
spec: {}
