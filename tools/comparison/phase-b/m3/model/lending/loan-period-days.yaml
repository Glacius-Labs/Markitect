imports:
  - package: markitect/core
    as: Core
id: loanPeriodDays
kind: Core.Property
body: >-
  Positive integer giving the number of calendar days added to the borrowing
  date to determine a new loan's due date for a standard copy. Weekends and
  holidays do not alter this interval. This does not describe a time of day or
  a scheduled job.
spec:
  valueType: integer
  minCount: 1
  maxCount: 1
