imports:
  - package: software
    as: Software
  - package: members
    as: Members
  - package: catalog
    as: Catalog
  - package: lending
    as: Lending
  - package: lending/reminders
    as: Reminders
id: realization
kind: Software.Rule
body: >-
  Across [[library]], deliver a callable local implementation of the operations
  concerning [[Members.member|members]], [[Catalog.copy|copies]], [[Lending.loan|loans]]
  and [[Reminders.assess-overdue|overdue assessment]], automated tests and concise
  usage documentation. These delivery obligations apply to every listed area.
  Tests cover
  successful operations, expected refusals, borrowing-limit and due-date
  boundaries for both loan classes, suspension across membership and lending,
  and repeated returns.
  Documentation explains how to run and test the implementation and its scope.
  Code, tests and documentation must agree with the model. No user interface,
  deployment or production database is required. [[callable-interface]] fixes
  the program boundary, language, build and test commands and wire format.
  Frameworks, internal source layout and domain design remain realization
  choices; no architecture is inferred from the historical library sketch.
spec: {}
