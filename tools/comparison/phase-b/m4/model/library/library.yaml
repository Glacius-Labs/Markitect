imports:
  - package: software
    as: Software
  - package: members
    as: Members
  - package: catalog
    as: Catalog
  - package: lending
    as: Lending
  - package: lending/reminders
    as: Reminders
id: library
kind: Software.Concept
body: >-
  One small library manages registered [[Members.member|members]], physical
  [[Catalog.copy|book copies]] and [[Lending.loan|loans]]. A trusted operator
  registers members and copies, changes membership status, borrows, renews and
  returns copies, inspects current state and requests [[Reminders.assess-overdue|overdue notices]].
  A member is domain data, not a login account. A new library starts empty;
  registration is ordinary supported behavior, not hardcoded example data.
  Operations are processed sequentially against current state. Accepted changes
  remain available to later operations in that state; persistence across process
  restarts is outside this example. There are no reservations, fees, lost or
  damaged books, branches, authentication, automatic scheduling or message
  delivery. Records are not edited or deleted except for member status, a loan's
  due date and renewal count through renewal, and loan return state. [[inputs]]
  governs all operations and [[realization]] governs the delivered
  implementation, tests and documentation.
spec: {}
