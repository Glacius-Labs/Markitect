imports:
  - {package: markitect/data, as: Data}
id: audit-entry
kind: Data.Entity
body: |-
  One entry of the audit log. Entries are never changed or removed. `target` is `null` in a refusal entry.
spec:
  fields:
    - {name: seq, fieldType: count}
    - {name: at, fieldType: timestamp}
    - {name: actor, fieldType: identifier}
    - {name: actorRole, fieldType: user-role}
    - {name: op, fieldType: operation-name}
    - {name: target, fieldType: audit-target-text, nullable: true}
    - {name: outcome, fieldType: audit-outcome}
