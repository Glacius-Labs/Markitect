imports:
  - {package: markitect/practice, as: Practice}
  - {package: makerspace/policies, as: Policies}
  - {package: makerspace/members, as: Members}
  - {package: makerspace/training, as: Training}
  - {package: makerspace/equipment, as: Equipment}
  - {package: makerspace/billing, as: Billing}
id: reservation-rules
kind: Practice.Rule
body: |-
  A new reservation is accepted only when all of the following hold. These rules connect members, training, equipment and time:

  1. its slot follows the [[Policies.booking-granularity|booking granularity]] and duration limits and starts at or after the request time;
  2. the slot lies inside the [[Policies.opening-hours|opening hours]] of its start date;
  3. the member is in good standing ([[Members.membership|membership]]);
  4. the member is not blocked by a long-overdue invoice ([[Billing.account-blocks|blocked members]]);
  5. the member holds a certification for the machine's family that is valid on the reservation date, which is the date of `start` ([[Training.certifications|certifications]]);
  6. no scheduled maintenance window of the machine overlaps the slot ([[Equipment.maintenance|maintenance]]);
  7. no lockout of the machine overlaps the slot ([[lockouts|lockouts]]);
  8. no other active reservation of the machine overlaps the slot;
  9. no other active reservation of the member, on any machine, overlaps the slot.
spec: {}
