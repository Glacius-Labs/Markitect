imports:
  - {package: markitect/practice, as: Practice}
id: invoices
kind: Practice.Rule
body: |-
  Billing is organized around the [[invoice|invoice]]. An invoice collects one member's charges for one calendar month. It is due 14 days after it is issued, receives payments until it is settled, and passes any overpayment to the member's credit, which in turn settles part of the member's later invoices.
spec: {}
