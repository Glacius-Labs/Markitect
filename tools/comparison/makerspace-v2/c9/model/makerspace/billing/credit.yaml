imports:
  - {package: markitect/practice, as: Practice}
id: credit
kind: Practice.Rule
body: |-
  **Credit.** Each member has a credit balance, initially 0. It increases by overpayments, by credits an admin issues as a goodwill gesture and by lockout credits. Credit is applied automatically to invoices generated later, as [[issuing-invoices|issuing invoices]] describes in step 5; it is never applied to an invoice that already exists and is never paid out.
spec: {}
