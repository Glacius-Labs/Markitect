imports:
  - {package: markitect/practice, as: Practice}
  - {package: makerspace/policies, as: Policies}
id: order-of-checks
kind: Practice.Rule
body: |-
  A well-formed request is checked in the following order. The first check that fails decides the refusal and its code.

  1. **Arguments:** every argument is present and valid by [[argument-values|argument values]] → otherwise [[Policies.invalid-argument|`invalid_argument`]].
  2. **Actor:** `actor` identifies an existing user of any role → otherwise [[Policies.unknown-actor|`unknown_actor`]].
  3. **Request time:** `at` is not earlier than the request time of the most recent request that was answered `ok` ([[Policies.time|time]]) → otherwise [[Policies.time-regression|`time_regression`]].
  4. **Role permission:** the actor's role may use the operation at all, as "all" or "own" in the operation's permissions → otherwise [[Policies.forbidden|`forbidden`]].
  5. **Referenced records:** every argument that refers to a record names one that exists, checked in the order the operation lists its arguments → otherwise [[Policies.not-found|`not_found`]]. An argument that names a member must name a user whose role is `member`; the identifier of a staff or admin user does not name a member.
  6. **Ownership:** when the actor's permission for the operation is "own", the record concerned belongs to the actor ([[Policies.authorization|authorization]]) → otherwise `forbidden`.
  7. **Operation rules:** the refusals listed for the operation, in the order listed.

  When a check fails, the response is `status: "refused"` with the code and a reason, and nothing else happens: no record is created or changed, no identifier number is consumed, no audit entry is written and the request-time order is not advanced. When every check passes, all of the operation's effects take place together and the response is `status: "ok"`.
spec:
  appliesTo: [makerspace]
