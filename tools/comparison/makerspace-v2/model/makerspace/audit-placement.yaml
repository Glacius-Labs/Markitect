imports:
  - {package: markitect/architecture, as: Architecture}
  - {package: makerspace/policies, as: Policies}
id: audit-placement
kind: Architecture.Placement
body: |-
  The protocol Package appends the audit entry after a mutation is answered `ok`, using the operation's audit target; area Packages do not write audit entries.
spec:
  appliesTo: [makerspace]
  concern: Policies.audit
  realizedIn: makerspace/protocol
