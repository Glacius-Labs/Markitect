imports:
  - {package: markitect/architecture, as: Architecture}
id: protocol-dependencies
kind: Architecture.DependencyRule
body: |-
  The protocol Package is the outer layer: it reads requests, runs the checks every operation shares and calls the area Packages. It may depend on every other Package; no Package depends on it.
spec:
  appliesTo: [makerspace/protocol]
  mayDependOn: [makerspace/policies, makerspace/members, makerspace/equipment, makerspace/billing, makerspace/training, makerspace/bookings, makerspace/materials, makerspace/safety, makerspace/reporting]
