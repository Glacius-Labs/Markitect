imports:
  - {package: markitect/architecture, as: Architecture}
id: training-interface
kind: Architecture.Interface
body: |-
  What other Packages may use of training: its operations, the course, enrollment and certification records, and the refusal `not_certified`. Other Packages also ask whether a member holds a certification for a family that is valid on a date.
spec:
  appliesTo: [makerspace]
  operations: [add-course, enroll-in-course, complete-course, revoke-certification, list-certifications]
  types: [course, enrollment, certification]
