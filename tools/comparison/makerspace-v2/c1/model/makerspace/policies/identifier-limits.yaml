imports:
  - {package: markitect/practice, as: Practice}
id: identifier-limits
kind: Practice.Rule
body: |-
  - **Generated identifiers stay valid identifiers.** A generated identifier is its prefix followed by a number. Within the integer limit it has at most 20 characters (a four-character prefix and at most 16 digits), so it always meets the [[identifier|identifier]] format and can be passed back as an argument.
  - **Audit targets are not identifiers.** An audit `target` is a plain string, or `null` in a refusal entry. A target that joins two values with `/` can be up to 129 characters long and need not meet the identifier format.
spec:
  appliesTo: [makerspace]
