imports:
  - {package: markitect/architecture, as: Architecture}
id: bookings-dependencies
kind: Architecture.DependencyRule
body: |-
  The bookings module depends only on members, training, equipment, billing, safety, policies. It depends on safety because a lockout belongs to an open incident.
spec:
  appliesTo: [makerspace/bookings]
  mayDependOn: [makerspace/members, makerspace/training, makerspace/equipment, makerspace/billing, makerspace/safety, makerspace/policies]
