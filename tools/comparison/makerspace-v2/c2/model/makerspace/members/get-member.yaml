imports:
  - {package: markitect/api, as: Api}
  - {package: makerspace/policies, as: Policies}
id: get-member
kind: Api.Operation
body: |-
  Returns the member.
spec:
  wireName: getMember
  mutation: false
  arguments:
    - {name: memberId, fieldType: Policies.identifier, refersTo: member}
  results:
    - {name: member, fieldType: member}
  permissions:
    - {role: Policies.member-role, scope: own}
    - {role: Policies.staff-role, scope: all}
    - {role: Policies.admin-role, scope: all}
