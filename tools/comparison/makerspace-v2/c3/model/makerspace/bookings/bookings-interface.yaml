imports:
  - {package: markitect/architecture, as: Architecture}
id: bookings-interface
kind: Architecture.Interface
body: |-
  What other modules may use of bookings: its operations and the reservation and lockout records. Other modules also ask whether an active reservation of a machine overlaps an interval, for the completed sessions of a machine and for the lockouts of a machine.
spec:
  appliesTo: [makerspace]
  operations: [create-reservation, cancel-reservation, check-in, check-out, list-member-reservations, get-machine-schedule, lock-machine]
  types: [reservation, lockout, opening-hours-of-day]
