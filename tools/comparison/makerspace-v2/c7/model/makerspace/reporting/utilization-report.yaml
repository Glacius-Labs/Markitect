imports:
  - {package: markitect/api, as: Api}
  - {package: makerspace/policies, as: Policies}
  - {package: makerspace/equipment, as: Equipment}
  - {package: makerspace/bookings, as: Bookings}
id: utilization-report
kind: Api.Operation
body: |-
  Shows how much each machine was used compared with the time it was available. The report range is the interval from `00:00` of `from` to `00:00` of `to`; `to` itself is excluded. `machines` has one row per machine that exists at the request time.

  - `openMinutes`: minutes of the range that lie inside [[Policies.opening-hours|opening hours]]. Every machine gets the full count, regardless of when it was added.
  - `maintenanceMinutes`: minutes of the range that lie inside opening hours and inside at least one scheduled [[Equipment.maintenance-window|maintenance window]] of the machine. Overlapping windows count once.
  - `lockoutMinutes`: minutes of the range that lie inside opening hours and inside at least one [[Bookings.lockout|lockout]] of the machine. Overlapping lockouts count once.
  - `availableMinutes`: `openMinutes` minus the minutes of the range that lie inside opening hours and inside at least one scheduled maintenance window or lockout of the machine, each minute counted once. A minute covered by both appears in `maintenanceMinutes` and `lockoutMinutes` but is subtracted once.
  - `usedMinutes`: for every completed [[Bookings.reservation|reservation]] of the machine, the minutes of `[checkedInAt, checkedOutAt)` that lie in the range, summed. Opening hours and lockouts do not limit this count. Reservations that are checked in but not checked out are not counted.
  - `utilizationPercent`: `(usedMinutes × 100 × 2 + availableMinutes) div (availableMinutes × 2)`, which is `usedMinutes × 100 / availableMinutes` rounded half up to an integer, or 0 when `availableMinutes` is 0. It can exceed 100.
  - `totals`: the sums of `openMinutes`, `maintenanceMinutes`, `lockoutMinutes`, `availableMinutes` and `usedMinutes` over all rows, and `utilizationPercent` computed from these sums with the same formula. With no machines, all totals are 0.
spec:
  wireName: utilizationReport
  mutation: false
  arguments:
    - {name: from, fieldType: Policies.date}
    - {name: to, fieldType: Policies.date}
  refusals:
    - {refusal: Policies.invalid-interval, when: "`to` is not after `from` or the range is longer than 366 days"}
  results:
    - {name: from, fieldType: Policies.date}
    - {name: to, fieldType: Policies.date}
    - {name: machines, fieldType: utilization-row, list: true}
    - {name: totals, fieldType: utilization-totals}
  permissions:
    - {role: Policies.staff-role, scope: all}
    - {role: Policies.admin-role, scope: all}
