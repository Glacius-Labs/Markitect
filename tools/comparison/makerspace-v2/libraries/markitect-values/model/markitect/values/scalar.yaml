imports:
  - {package: markitect/core, as: Core}
id: Scalar
kind: Core.Kind
body: >-
  A simple value: a string, integer, number or boolean, optionally bounded and
  measured in a unit. Format rules beyond the bounds are stated in the body of
  each Scalar.
spec:
  implements: [FieldType]
  properties: [base, lowest, highest, measuredIn]
