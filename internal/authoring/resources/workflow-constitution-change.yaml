apiVersion: markitect.example.org/v1alpha1
kind: Workflow
metadata:
    name: constitution-change
    namespace: core
spec:
    text: |
        Use this workflow for a separately authorized change to canonical engineering policy or its modeling language. An accepted discovery candidate is input evidence, not an instruction to auto-edit a Project.

        1. Confirm the human decision refers to the exact candidate and evidence hashes and explicitly accepts the proposed scope. Re-open the evidence and counterexamples. If either digest differs, return to review. A recorded name or digest does not authenticate a reviewer.

        2. Decide what the approved statement is: descriptive guidance, a normative Rule, a new Domain kind or relation, a bounded structural constraint, or a project-owned external check. Keep preferences and exceptions in human-readable guidance when no deterministic assertion can prove them. Do not promote a pattern solely because it is frequent.

        3. Make the change in a normal Project branch. If new vocabulary is required, load and validate the versioned Domain definition before authoring instances. Put project-owned Domain definitions in the Project's explicit `spec.domains`; put a genuinely shared Domain and its reusable resources in a versioned package, then pin that archive by exact version and digest and explicitly select each package Domain. Do not make a package or Domain active implicitly.

        4. Add or revise canonical resources in their owning configured Areas, with explicit typed relations and exact file inputs. Do not place a discovery candidate, raw evidence dossier, or review report in an Area as if it were authoritative. Add counterexample treatment and any approved exception to canonical guidance where that is part of the decision.

        5. Run formatting, `check`, selected `context`, and `impact --base BASE --revision CANDIDATE`; run only the checks configured by the owning Project. For implementation-specific facts, use an explicitly configured check or adapter with declared inputs. Markitect's structural result does not prove code conforms to prose, that the policy is wise, or that a human accepted the change.

        6. Have the owning human review the exact diff and evidence. Adoption is complete only when that ordinary Project change is explicitly accepted through its normal process. Preserve the decision record separately from machine-check output. Never treat a successful validator, package build, render, or adapter apply as policy approval.
