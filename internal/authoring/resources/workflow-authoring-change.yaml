apiVersion: markitect.example.org/v1alpha1
kind: Workflow
metadata:
  name: authoring-change
  namespace: core
spec:
  rules:
    - name: canonical-ownership
  uses:
    - kind: Text
      name: resource-modelling
  text: |
    For commands against a consumer repository, supply `--repo PATH` consistently.

    0. If the repository has no `markitect.yaml` and the task is to start a new Markitect project, run `init --repo PATH --name PROJECT --namespace OWNER` and review the exact read-only file plan. By default, the Project Area is `.markitect/areas/OWNER`, and init plans only `markitect.yaml` plus `.markitect/areas/OWNER/README.md`. Pass `--path AREA` only when the Project should use a different Area path; then the README is `AREA/README.md`. Preview also works outside Git. In a Git checkout, `--repo` must be the worktree root. Use `--write` only after confirming the names and paths; it recomputes and validates the plan and requires a named non-protected branch. It creates only the two planned files, and only when the Area directory is absent. It does not choose checks or other project policy. An empty Project can pass `check`, while `verify` remains incomplete until its owner declares real checks and commits the candidate. If the repository already has a Project or the task is not project setup, continue with the resource workflow below.

    1. Use `find --query TEXT` to discover candidate resources. Use `explain --kind KIND --name NAME --namespace NAMESPACE` to inspect a candidate's ownership and explicit graph. Choose the owner from existing responsibility and explicitly configured Project Areas; if multiple candidates remain plausible, keep that uncertainty visible and ask for semantic direction. For a new Project, recommend `.markitect/areas/<responsibility>/` and organize resources by responsibility before kind. Existing Projects keep their configured Area paths; do not migrate them just to match the convention. An optional filename suffix such as `.rule.yaml` or `.workflow.yaml` is only a reader aid; the YAML `kind` field is authoritative. For a dependency, prefer a local resource when the consumer owns its meaning, maintenance and lifecycle. Use an exported package resource when it is deliberately shared across independently maintained Projects. A shared keyword or repeated text alone does not establish package ownership.
    1a. For a Markdown documentation request, use `inventory` and the local README routers under configured documentation roots to locate existing canonical sources. Traverse from the root through direct children, then inspect the likely owner's documents and adjacent scope before writing. State the selected owner and why an existing document does or does not cover the change. Update that document when it already owns the subject. If a distinct subject needs a new document, add the direct link to its router and add a parent link when creating a directory. Additional cross-links are allowed; they provide navigation and do not declare graph dependencies. `check` can validate router structure but cannot establish semantic placement.
    2. Edit the existing canonical YAML resource where responsibility belongs. Select the existing kind that matches the responsibility. Put required relationships in typed fields and keep file dependencies explicit. Do not add organization, customer, provider or human-acceptance policy to these core resources.
    3. For a package dependency, select an exact direct Project pin and an exported entry; do not invent a floating version or second lock. `.markitect/packages/` is a recommended committed location for archives; other committed snapshot-included paths remain valid. Root `vendor/`, `.artifacts/`, `.cache/`, and build/cache directories are excluded from snapshots. Use `context --package PACKAGE ...` to inspect a package export. Package contents are read-only and do not activate Rules. Run `format --write` to canonicalize local YAML, then `render --write` to refresh Markitect-owned views. If the consumer owns provider projections, run its documented renderer. Run `check` and any applicable working-tree gates; review every changed file.
    4. Commit the complete candidate before gathering fixed-revision evidence. If the Project declares repository checks, run `verify --revision CANDIDATE`; otherwise report graph-only coverage from `check`. Run `impact --base BASE --revision CANDIDATE`, then compile `context --revision CANDIDATE --kind KIND --name NAME --namespace NAMESPACE` for affected entries. Conduct semantic review of the fixed context using its declared criteria. Only after an actual completed review, use `review --revision CANDIDATE --namespace NAMESPACE --kind KIND --name NAME --config CONFIG --report REPORT` to record the report. The command records evidence; it does not perform semantic review. A passing structural check does not establish truth, completeness, customer approval or human acceptance.
