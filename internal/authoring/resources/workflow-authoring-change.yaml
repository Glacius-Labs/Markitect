apiVersion: markitect.example.org/v1alpha1
kind: Workflow
metadata:
  name: authoring-change
  namespace: core
spec:
  rules:
    - name: canonical-ownership
  uses:
    - kind: Text
      name: resource-modelling
  text: |
    For commands against a consumer repository, supply `--repo PATH` consistently.

    1. Use `find --query TEXT` to discover candidate resources. Use `explain --kind KIND --name NAME --namespace NAMESPACE` to inspect a candidate's ownership and explicit graph. Choose the owner from paths and project areas; if multiple candidates remain plausible, keep that uncertainty visible and ask for semantic direction.
    2. Edit the existing canonical YAML resource where responsibility belongs. Select the existing kind that matches the responsibility. Put required relationships in typed fields and keep file dependencies explicit. Do not add organization, customer, provider or human-acceptance policy to these core resources.
    3. Run `format --write` to canonicalize YAML, then `render --write` to refresh Markitect-owned views. If the consumer owns provider projections, run its documented renderer. Run `check` and any applicable working-tree gates; review every changed file.
    4. Commit the complete candidate before gathering fixed-revision evidence. When supported, run `verify --revision CANDIDATE`. Run `impact --base BASE --revision CANDIDATE`, then compile `context --revision CANDIDATE --kind KIND --name NAME --namespace NAMESPACE` for affected entries. Conduct semantic review of the fixed context using its declared criteria. Only after an actual completed review, use `review --revision CANDIDATE --namespace NAMESPACE --kind KIND --name NAME --config CONFIG --report REPORT` to record the report. The command records evidence; it does not perform semantic review. A passing structural check does not establish truth, completeness, customer approval or human acceptance.
