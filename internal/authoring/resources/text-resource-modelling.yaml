apiVersion: markitect.example.org/v1alpha1
kind: Text
metadata:
  name: resource-modelling
  namespace: core
spec:
  text: |
    Use the smallest existing Markitect kinds that make responsibility and required context clear:

    - Project describes ownership areas, imports, rules and explicit bindings.
    - Rule states a scoped requirement; only a named supported check is executable.
    - Text holds reusable prose that has no separate procedure or requirement role.
    - Workflow describes ordered work and declares the resources it uses.
    - Skill is the agent-facing entrypoint and links to the workflow it should follow.
    - Agent describes a role and supported provider settings; provider settings do not own the role's canonical guidance.
    - Contract names a required interface and exact input/output signature for a bound implementation.

    Keep one canonical source. Add `uses`, `rules`, `needs` or `implements` only when the relationship is real and the field supports it. Declare file inputs explicitly. Do not infer dependencies from prose or paths, create duplicate provider copies, or add a resource only to avoid editing its actual owner. The longest containing Project area determines ownership; cross-area references require a direct import.
