apiVersion: markitect.example.org/v1alpha1
kind: Text
metadata:
  name: resource-modelling
  namespace: core
spec:
  text: |
    Use the smallest existing Markitect kinds that make responsibility and required context clear:

    - Project describes ownership areas, imports, rules and explicit bindings.
    - Rule states a scoped requirement; only a named supported check is executable.
    - Text holds reusable prose that has no separate procedure or requirement role.
    - Workflow describes ordered work and declares the resources it uses.
    - Skill is the agent-facing entrypoint and links to the workflow it should follow.
    - Agent describes a role and supported provider settings; provider settings do not own the role's canonical guidance.
    - Contract names a required interface and exact input/output signature for a bound implementation.

    Keep one canonical source. For a new Project, `.markitect/areas/<responsibility>/` is the recommended place for typed resources, with responsibility-first folders and optional kind suffixes such as `.rule.yaml` or `.workflow.yaml`. Keep existing Projects at their configured Area paths; layout conventions do not override `markitect.yaml`. The YAML `kind` field determines resource type, regardless of filename.

    Configure Areas to cover canonical resources and exact file inputs; ordinary documentation may be covered by a separate Area. Add `uses`, `rules`, `needs` or `implements` only when the relationship is real and the field supports it. Declare file inputs explicitly. Do not infer dependencies from prose, README links or paths, create duplicate provider copies, or add a resource only to avoid editing its actual owner. The longest containing configured Project area determines ownership; cross-area references require a direct import. README routers can guide people through human-owned documentation but do not add resources or graph edges.
