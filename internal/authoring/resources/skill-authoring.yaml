apiVersion: markitect.example.org/v1alpha1
kind: Skill
metadata:
  name: authoring
  namespace: core
spec:
  description: Author and review Markitect resources using their explicit ownership and dependency model.
  uses:
    - kind: Workflow
      name: authoring-change
    - kind: Text
      name: resource-modelling
  text: |
    Help an agent change Markitect's canonical engineering mechanisms.

    Begin with structural discovery: `find --query TEXT`, then inspect relevant candidates with `explain --kind KIND --name NAME --namespace NAMESPACE`. These queries expose structure, not semantic relevance. Select the owner using project area paths, existing responsibility and explicit dependencies. If the intent does not identify one defensible owner, ask before editing.

    Edit canonical YAML in place where possible. For a new Project, use `.markitect/areas/<responsibility>/` as the recommended typed-resource root and organize by responsibility before kind. Keep existing Projects at their configured Area paths; do not require migration. Kind suffixes in filenames are optional reader aids; the YAML `kind` field is authoritative. Configure Areas to cover canonical resources and exact file inputs. Ordinary docs may have a separate configured Area, with imports declared when a resource references inputs across Areas. Add only dependencies needed for context or behavior, using supported typed fields; never infer them from Markdown links or directory structure. Keep customer/provider policy with its owner. Follow the authoring Workflow for formatting, rendering, checking, fixed snapshots, impact, context and semantic review.

    For ordinary Markdown, follow the configured documentation root and local README routers, compare configured Areas and existing owner contracts, and search before creating a file. Prefer updating the current canonical page. README routers are human-owned navigation; their links are not dependencies or proof that a page is semantically correct.

    Keep dependencies local when the Project owns their meaning and change lifecycle. Refer to a content package only when its owner intentionally publishes a reusable contract, workflow, rule, skill, or other resource for independent consumers. Similar wording or a shared keyword is not enough reason to create or consume a package. Select only a declared export through a direct exact Project pin; inspect its compiled context with `context --package PACKAGE ...`. `.markitect/packages/` is a recommended committed location for archives; other committed snapshot-included paths remain valid. Root-level `vendor/`, `.artifacts/`, and `.cache/`, plus build/cache directories such as `bin/` and `obj/`, are excluded inputs. Imported content is read-only and does not activate Rules or providers.

    Report machine-checked structure separately from semantic confidence and human decisions. Do not claim customer compatibility, approval or human acceptance from a successful Markitect command.
