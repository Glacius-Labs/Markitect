packages:
  - path: internal/model
    layer: apply-model
    purpose: Pure canonical v1 Model check over explicit bytes.
    doc: docs/development/modules.md
  - path: internal/snapshot
    layer: apply-snapshot
    purpose: Pure immutable repository tree values.
    doc: docs/development/modules.md
  - path: internal/organization
    layer: apply-organization
    purpose: Pure Manager topology, context selection and settings.
    doc: docs/development/modules.md
  - path: internal/realization
    layer: apply-realization
    purpose: Pure ownership, accounting and candidate rules.
    doc: docs/development/modules.md
  - path: internal/run
    layer: apply-run
    purpose: Complete closed Manager hierarchy with direct delegation, questions, fixed Git handoffs and durable results.
    doc: docs/development/modules.md
  - path: internal/project
    layer: apply-project
    purpose: Structural model, registry, ownership, accounting, declared instructions and checks, and checked static Manager contexts.
    doc: internal/project/README.md
  - path: internal/runtimeconfig
    layer: runtime-config
    purpose: Closed acquired Runtime envelopes and source-bound static native or check image observations.
    doc: docs/development/modules.md
  - path: internal/harness
    layer: native-harness
    purpose: Pure complete model-derived instructions for native Manager Sessions.
    doc: internal/harness/README.md
  - path: internal/apply
    layer: apply-usecase
    purpose: Checked capture, closed workflow and stored-candidate publication.
    doc: docs/development/modules.md
  - path: internal/workflow
    layer: apply-workflow
    purpose: Direct Assessment, Implement and Verify sequence over fully closed Runs.
    doc: internal/apply/README.md
  - path: internal/modeldocs
    layer: model-view
    purpose: Deterministic readable view and reviewed source-bound write plan.
    doc: docs/development/modules.md
  - path: internal/adapters/checks
    layer: apply-adapter
    purpose: Check profile metadata and bounded container execution.
    doc: docs/development/modules.md
  - path: internal/adapters/cli
    layer: apply-adapter
    purpose: Command parsing and JSON reports for check, context, docs and explicit Apply.
    doc: docs/development/modules.md
  - path: internal/adapters/codexappserver
    layer: apply-adapter
    purpose: Codex native Manager Sessions, model-derived harness loading and direct Run tools in private assignment volumes.
    doc: internal/adapters/codexappserver/README.md
  - path: internal/adapters/container
    layer: apply-adapter
    purpose: Container engine client and the Orchestrator side of the agentd connection.
    doc: docs/development/modules.md
  - path: internal/adapters/documents
    layer: apply-adapter
    purpose: Concrete repository, profile metadata and document I/O.
    doc: docs/development/modules.md
  - path: internal/adapters/gitrepo
    layer: apply-adapter
    purpose: Complete repository capture, isolated Run Git copies and independently reopenable stored candidates.
    doc: docs/development/modules.md
  - path: internal/adapters/runner
    layer: apply-adapter
    purpose: Linux runner launch with read-only checkout, login and engine-socket mounts, the in-image clone and Apply hand-back, and import of the verified change as a branch.
    doc: docs/design/linux-runner.md
  - path: internal/adapters/runstore
    layer: apply-adapter
    purpose: Immutable terminal Run results, an index of completed Verify approvals and durable concurrent project Notes.
    doc: internal/run/README.md
  - path: internal/bootstrap
    layer: apply-bootstrap
    purpose: Composes structural Project, generated views, static metadata and closed Apply with guarded publication.
    doc: docs/development/modules.md
  - path: cmd/markitect
    layer: apply-command
    purpose: Thin entrypoint to product composition.
    doc: docs/development/modules.md
  - path: cmd/markitect-runner
    layer: apply-command
    purpose: Thin entrypoint of the Linux runner image.
    doc: docs/design/linux-runner.md
  - path: internal/agentd/frame
    layer: agent-protocol
    purpose: Frame protocol between the Orchestrator and the session helper.
    doc: docs/development/modules.md
  - path: internal/agentd
    layer: agent-runtime
    purpose: Session helper inside each Agent container.
    doc: docs/development/modules.md
  - path: cmd/markitect-agentd
    layer: runtime-command
    purpose: Thin entrypoint of the session helper.
    doc: docs/development/modules.md
  - path: internal/buildinfo
    layer: build-data
    purpose: Version identity and embedded license notices.
    doc: docs/development/modules.md
  - path: internal/tooling/licenses
    layer: build-data
    purpose: Version identity and embedded license notices.
    doc: docs/development/modules.md
  - path: internal/tooling/architecture
    layer: maintenance
    purpose: Explicitly separated release and repository tooling.
    doc: docs/development/modules.md
  - path: internal/tooling/architecturecli
    layer: maintenance
    purpose: Explicitly separated release and repository tooling.
    doc: docs/development/modules.md
  - path: internal/tooling/guardedwrite
    layer: maintenance
    purpose: Explicitly separated release and repository tooling.
    doc: docs/development/modules.md
  - path: internal/tooling/publish
    layer: maintenance
    purpose: Explicitly separated release and repository tooling.
    doc: docs/development/modules.md
  - path: internal/tooling/release
    layer: maintenance
    purpose: Explicitly separated release and repository tooling.
    doc: docs/development/modules.md
  - path: internal/tooling/release/install
    layer: maintenance
    purpose: Explicitly separated release and repository tooling.
    doc: docs/development/modules.md
  - path: internal/tooling/releasecli
    layer: maintenance
    purpose: Explicitly separated release and repository tooling.
    doc: docs/development/modules.md
  - path: internal/tooling/source
    layer: maintenance
    purpose: Explicitly separated release and repository tooling.
    doc: docs/development/modules.md
  - path: cmd/markitect-check-architecture
    layer: maintenance-command
    purpose: Thin entrypoints to maintenance services.
    doc: docs/development/modules.md
  - path: cmd/markitect-release
    layer: maintenance-command
    purpose: Thin entrypoints to maintenance services.
    doc: docs/development/modules.md
  - path: internal/testkit
    layer: test-support
    purpose: Hermetic fixture support available only to tests.
    doc: docs/development/modules.md
  - path: packaging/bootstrap
    layer: standalone
    purpose: Public bootstrap and source smoke with no product imports.
    doc: docs/development/modules.md
  - path: tools/smoke
    layer: standalone
    purpose: Public bootstrap and source smoke with no product imports.
    doc: docs/development/modules.md
