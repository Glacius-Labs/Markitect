packages:
  - path: internal/model
    layer: apply-model
    purpose: Pure canonical v1 Model check over explicit bytes.
    doc: docs/development/modules.md
  - path: internal/snapshot
    layer: apply-snapshot
    purpose: Pure immutable repository tree values.
    doc: docs/development/modules.md
  - path: internal/organization
    layer: apply-organization
    purpose: Pure Manager topology, context selection and settings.
    doc: docs/development/modules.md
  - path: internal/realization
    layer: apply-realization
    purpose: Pure ownership, accounting and candidate rules.
    doc: docs/development/modules.md
  - path: internal/run
    layer: apply-run
    purpose: Orchestrator for the recursive Pass process over ports for Agents, workspaces, checks, owner and evidence.
    doc: docs/development/modules.md
  - path: internal/apply
    layer: apply-usecase
    purpose: Preparation through consumer-owned ports and the Apply use case with team, Manager briefs, candidate accounting and guarded publication.
    doc: docs/development/modules.md
  - path: internal/authoring
    layer: apply-usecase
    purpose: Owner proposals for the project's .markitect inputs and the model sessions that make them, checked like the repository and published only on acceptance.
    doc: internal/authoring/README.md
  - path: internal/modeldocs
    layer: model-view
    purpose: Deterministic readable view and reviewed source-bound write plan.
    doc: docs/development/modules.md
  - path: internal/adapters/checks
    layer: apply-adapter
    purpose: Check profile metadata and bounded container execution.
    doc: docs/development/modules.md
  - path: internal/adapters/claudecode
    layer: apply-adapter
    purpose: Claude Code stream protocol and one-turn Agent adaptation through the container runtime.
    doc: internal/adapters/claudecode/README.md
  - path: internal/adapters/cli
    layer: apply-adapter
    purpose: Command parsing and JSON reports for preparation, Apply and owner answers.
    doc: docs/development/modules.md
  - path: internal/adapters/cockpit
    layer: apply-adapter
    purpose: Local read-only web cockpit over recorded run evidence, with boundary-bound projections, replay and transcripts.
    doc: internal/adapters/cockpit/README.md
  - path: internal/adapters/codexappserver
    layer: apply-adapter
    purpose: Prepares Codex image metadata and implements one-turn Agents through the container runtime.
    doc: internal/adapters/codexappserver/README.md
  - path: internal/adapters/container
    layer: apply-adapter
    purpose: Container engine client and the Orchestrator side of the agentd connection.
    doc: docs/development/modules.md
  - path: internal/adapters/documents
    layer: apply-adapter
    purpose: Concrete repository, profile metadata and document I/O.
    doc: docs/development/modules.md
  - path: internal/adapters/gitrepo
    layer: apply-adapter
    purpose: Repository capture, workspace volumes and guarded publication.
    doc: docs/development/modules.md
  - path: internal/bootstrap
    layer: apply-bootstrap
    purpose: Constructs actual services and adapters; owns the Agents router, file evidence, file owner channel and state lock.
    doc: docs/development/modules.md
  - path: cmd/markitect
    layer: apply-command
    purpose: Thin entrypoint to product composition.
    doc: docs/development/modules.md
  - path: internal/agentd/frame
    layer: agent-protocol
    purpose: Frame protocol between the Orchestrator and the session helper.
    doc: docs/development/modules.md
  - path: internal/agentd
    layer: agent-runtime
    purpose: Session helper inside each Agent container.
    doc: docs/development/modules.md
  - path: cmd/markitect-agentd
    layer: runtime-command
    purpose: Thin entrypoint of the session helper.
    doc: docs/development/modules.md
  - path: internal/buildinfo
    layer: build-data
    purpose: Version identity and embedded license notices.
    doc: docs/development/modules.md
  - path: internal/tooling/licenses
    layer: build-data
    purpose: Version identity and embedded license notices.
    doc: docs/development/modules.md
  - path: internal/tooling/architecture
    layer: maintenance
    purpose: Explicitly separated release and repository tooling.
    doc: docs/development/modules.md
  - path: internal/tooling/architecturecli
    layer: maintenance
    purpose: Explicitly separated release and repository tooling.
    doc: docs/development/modules.md
  - path: internal/tooling/guardedwrite
    layer: maintenance
    purpose: Explicitly separated release and repository tooling.
    doc: docs/development/modules.md
  - path: internal/tooling/modulechecks
    layer: maintenance
    purpose: Explicitly separated release and repository tooling.
    doc: docs/development/modules.md
  - path: internal/tooling/modulecli
    layer: maintenance
    purpose: Explicitly separated release and repository tooling.
    doc: docs/development/modules.md
  - path: internal/tooling/modules/githooks
    layer: maintenance
    purpose: Explicitly separated release and repository tooling.
    doc: docs/development/modules.md
  - path: internal/tooling/modules/pipelines
    layer: maintenance
    purpose: Explicitly separated release and repository tooling.
    doc: docs/development/modules.md
  - path: internal/tooling/publish
    layer: maintenance
    purpose: Explicitly separated release and repository tooling.
    doc: docs/development/modules.md
  - path: internal/tooling/release
    layer: maintenance
    purpose: Explicitly separated release and repository tooling.
    doc: docs/development/modules.md
  - path: internal/tooling/release/install
    layer: maintenance
    purpose: Explicitly separated release and repository tooling.
    doc: docs/development/modules.md
  - path: internal/tooling/releasecli
    layer: maintenance
    purpose: Explicitly separated release and repository tooling.
    doc: docs/development/modules.md
  - path: internal/tooling/source
    layer: maintenance
