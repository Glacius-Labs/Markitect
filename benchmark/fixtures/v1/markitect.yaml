apiVersion: markitect.example.org/v1alpha1
kind: Project
metadata:
    name: rollback-example
spec:
    areas:
        - name: sample
          path: docs
    bindings:
        - contract:
            kind: Contract
            name: rollback-assessment
            namespace: sample
          implementation:
            kind: Agent
            name: rollback-reviewer
            namespace: sample
    checks:
        - name: go-version
          run: [go, version]
