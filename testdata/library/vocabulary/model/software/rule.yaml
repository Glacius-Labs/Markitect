imports:
  - package: markitect/core
    as: Core
id: Rule
kind: Core.Kind
body: >-
  Describes a condition that must hold in its stated scope. Its body identifies
  the affected concepts or behavior and any applicability conditions. A link
  alone does not make a Rule apply to everything at its target. Natural-language
  obligations require semantic assessment, even when structural validation passes.
