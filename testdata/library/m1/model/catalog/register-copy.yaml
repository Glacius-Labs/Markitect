imports:
  - package: software
    as: Software
  - package: library
    as: Library
id: register-copy
kind: Software.UseCase
body: >-
  The operator supplies a new identifier and title under [[Library.inputs]] to
  register one [[copy]] in [[Library.library]]. It initially has no loans and is
  available according to [[availability]]. Reusing an existing copy identifier
  is refused without replacing that record or changing any state. Matching an
  existing title alone is not a duplicate registration.
spec: {}
