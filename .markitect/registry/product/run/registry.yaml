apiVersion: markitect.registry/v1
artifacts:
  - path: "experiments/apply-trials/night_run_test.py"
    form: test
    realizes: [product/run/confirmed-run-history]
    why: "Stops real owned subprocesses under injected registry, clock and recovery-marker failures without Docker or provider generation."
  - path: "docs/development/night-apply-stability-20261021.md"
    form: doc
    realizes: [product/run/confirmed-run-history]
    why: "Binds the separate NIGHT stabilization scope, model-first review gate, corrected controls and finite operator validation."
  - path: "experiments/apply-trials/night_run.py"
    form: code
    realizes: [product/run/confirmed-run-history]
    why: "Bounds separately released NIGHT groups against one durable six-start ledger, independent host time and the absolute overnight stop."
  - path: "experiments/recursive-apply-demo/README.md"
    form: doc
    realizes: [product/run/confirmed-run-history]
    why: "Explains the real library demonstration harness and its timed and untimed steps."
  - path: "experiments/recursive-apply-demo/analyze.py"
    form: code
    realizes: [product/run/confirmed-run-history]
    why: "Summarizes one Apply's evidence: rounds, turns, parallelism, findings and usage."
  - path: "experiments/recursive-apply-demo/extract-checklist.md"
    form: doc
    realizes: [product/run/confirmed-run-history]
    why: "Fixes the rubric an independent assessor scores an extracted library model with, including the seeded and conflict expectations."
  - path: "experiments/recursive-apply-demo/extract-checklist-readinglog.md"
    form: doc
    realizes: [product/run/confirmed-run-history]
    why: "Fixes the rubric for the second Extract project, Readinglog, marking reference obligations its two files cannot show."
  - path: "experiments/recursive-apply-demo/extract-execution.yaml"
    form: config
    realizes: [product/run/confirmed-run-history]
    why: "Declares the Extract run controls of the library case-3 target: ownership of the artifacts, budget and no required checks."
  - path: "experiments/recursive-apply-demo/library-execution.yaml"
    form: config
    realizes: [product/run/confirmed-run-history]
    why: "Declares the library target's ownership, budget, profiles and required checks for the demonstration."
  - path: "experiments/recursive-apply-demo/nochange_apply.sh"
    form: code
    realizes: [product/run/confirmed-run-history]
    why: "Runs the separate no-change Apply on the accepted A2 outside the timed demonstration."
  - path: "experiments/recursive-apply-demo/ra_assess.sh"
    form: code
    realizes: [examples/independent-oracles]
    why: "Assesses the published A1 and A2 with the independent oracle after the timed run."
  - path: "experiments/recursive-apply-demo/ra_bind.sh"
    form: code
    realizes: [product/run/confirmed-run-history]
    why: "Binds an attempt to one build with Sonnet Runtime profiles, check profiles, token file and frozen scripts."
  - path: "experiments/recursive-apply-demo/ra_build.sh"
    form: code
    realizes: [product/run/confirmed-run-history]
    why: "Builds the runtime, project and oracle images and the CLI from one exact commit."
  - path: "experiments/recursive-apply-demo/ra_cleanup.sh"
    form: code
    realizes: [product/run/confirmed-run-history]
    why: "Stops the remaining containers of the attempt's own store label within the hard limit."
  - path: "experiments/recursive-apply-demo/ra_demo.sh"
    form: code
    realizes: [product/run/confirmed-run-history]
    why: "Enforces the hard wall-clock limit of the timed demonstration outside every prompt."
  - path: "experiments/recursive-apply-demo/ra_extract.sh"
    form: code
    realizes: [product/run/confirmed-run-history]
    why: "Runs the timed library Extract with the scripted owner, the scripted adoption and, optionally, the rebuild from the extracted model judged by the oracle."
  - path: "experiments/recursive-apply-demo/ra_extract_project.sh"
    form: code
    realizes: [product/run/confirmed-run-history]
    why: "Projects the case-3 target: a published library realization with vocabulary but without any model."
  - path: "experiments/recursive-apply-demo/ra_inner.sh"
    form: code
    realizes: [product/run/confirmed-run-history]
    why: "Projects the target, runs both Applies and performs the owner's commit and model change between them."
  - path: "experiments/recursive-apply-demo/ra_project.sh"
    form: code
    realizes: [product/run/confirmed-run-history]
    why: "Creates the model-only Library M1 target repository."
  - path: "experiments/recursive-apply-demo/ra_runconfig.py"
    form: code
    realizes: [product/run/confirmed-run-history]
    why: "Writes each Apply's run configuration with the owner request and the shared deadline."
  - path: "experiments/recursive-apply-demo/rx_collect.py"
    form: code
    realizes: [product/run/confirmed-run-history]
    why: "Summarizes Extract attempts: phases, rounds, Verify depth, questions, deviations, model size, rebuild and oracle."
  - path: "experiments/recursive-apply-demo/rx_python_profile.py"
    form: code
    realizes: [product/run/confirmed-run-history]
    why: "Switches a bound attempt to the Python example runtime image and offers a Python check profile, for the Readinglog Extract runs."
  - path: "experiments/recursive-apply-demo/rx_rebuild_project.sh"
    form: code
    realizes: [product/run/confirmed-run-history]
    why: "Projects a case-1 target from an adopted Extract, so Apply can rebuild the realization from the extracted model alone."
  - path: "experiments/recursive-apply-demo/rx_seed.py"
    form: code
    realizes: [product/run/confirmed-run-history]
    why: "Plants known defects and source conflicts in a library realization, each with an expected Extract outcome."
  - path: "experiments/recursive-apply-demo/smoke_apply.sh"
    form: code
    realizes: [product/run/confirmed-run-history]
    why: "Runs one Apply with a short deadline as a plumbing smoke outside the timed demonstration."
  - path: "experiments/recursive-apply-demo/writes.py"
