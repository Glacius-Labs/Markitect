apiVersion: markitect.registry/v1
artifacts:
  - path: "internal/run/session_readiness_test.go"
    form: test
    realizes: [product/run/confirmed-run-history]
    why: Checks truthful ready-but-unbound startup, one first send, retained holds and the initial Explore gate.
  - path: "internal/run/binding_inventory.go"
    form: code
    realizes: [product/run/confirmed-run-history]
    why: Exposes copied historical basis inventories and checks versioned record agreement without recompilation.
  - path: "internal/run/binding_inventory_test.go"
    form: test
    realizes: [product/run/confirmed-run-history]
    why: Checks literal v1 compatibility and complete v2 inventories, refusals, copies and read budgets.
  - path: "internal/run/testdata/basis-v1.json"
    form: config
    realizes: [product/run/confirmed-run-history]
    why: Retains literal pre-v2 basis bytes captured before the inventory codec change.
  - path: "internal/run/testdata/prepared-v1.json"
    form: config
    realizes: [product/run/confirmed-run-history]
    why: Retains the original v1 preparation batch and its immutable basis reference for retry proof.
  - path: "internal/run/testdata/owner-v1.txt"
    form: config
    realizes: [product/run/confirmed-run-history]
    why: Retains the original owner input required by the pre-v2 preparation history.
  - path: "internal/run/workspace.go"
    form: code
    realizes: [product/run/confirmed-run-history]
    why: Defines the consumer-owned Workspaces port that materializes and observes step workspaces.
  - path: "internal/run/checks.go"
    form: code
    realizes: [product/run/confirmed-run-history]
    why: Defines the consumer-owned Checks port and what a check receipt establishes.
  - path: "internal/run/workspace_test.go"
    form: test
    realizes: [product/run/confirmed-run-history]
    why: Checks the bounds of workspace requests and when a harvest is complete.
  - path: "internal/run/checks_test.go"
    form: test
    realizes: [product/run/confirmed-run-history]
    why: Checks that check requests are complete and bounded and when a receipt passes.
  - path: "internal/run/step_contract.go"
    form: code
    realizes: [product/run/confirmed-run-history]
    why: Defines the step output contract, the Host tool names and the tool catalogue per phase.
  - path: "internal/run/step_contract_test.go"
    form: test
    realizes: [product/run/confirmed-run-history]
    why: Checks the step contract round trip and the tool catalogue schemas per phase.
  - path: "internal/run/session.go"
    form: code
    realizes: [product/run/confirmed-run-history]
    why: Defines the provider-neutral Session port and permitted journal wire representations.
  - path: "internal/run/session_io.go"
    form: code
    realizes: [product/run/confirmed-run-history]
    why: Confirms channel-bound callbacks and deduplicates persisted tool exchanges without executing tools.
  - path: "internal/run/session_state.go"
    form: code
    realizes: [product/run/confirmed-run-history]
    why: Reduces admitted session and step facts, send uncertainty and observed termination.
  - path: "internal/run/session_test.go"
    form: test
    realizes: [product/run/confirmed-run-history]
    why: Checks durable send ordering, tool deduplication, reference integrity and recovery holds.
  - path: "internal/run/assignment.go"
    form: code
    realizes: [product/run/confirmed-run-history]
    why: Records bounded cap extensions, quiescent closure and isolated historic assignment ledgers.
  - path: "internal/run/assignment_test.go"
    form: test
    realizes: [product/run/confirmed-run-history]
    why: Checks cap conservation, immutable closure and ordinary assignments through stored history.
  - path: "internal/run/README.md"
    form: doc
    realizes: [product/run/confirmed-run-history]
    why: Documents the implemented admission boundary and its explicit remaining gaps.
  - path: "internal/run/binding.go"
    form: code
    realizes: [product/run/confirmed-run-history]
    why: Binds complete supplied inputs and their provenance before run admission.
  - path: "internal/run/binding_test.go"
    form: test
    realizes: [product/run/confirmed-run-history]
    why: Checks fixed input identity, completeness and rejected preparation.
  - path: "internal/run/budget.go"
    form: code
    realizes: [product/run/confirmed-run-history]
    why: Accounts finite assignment capacity, completion reserve and uncertain holds.
  - path: "internal/run/command.go"
    form: code
    realizes: [product/run/confirmed-run-history]
    why: Defines closed commands and validates their intrinsic values.
  - path: "internal/run/commit.go"
    form: code
    realizes: [product/run/confirmed-run-history]
    why: Confirms exact journal commits and reconciles uncertain append outcomes.
  - path: "internal/run/core_fixture_test.go"
    form: test
    realizes: [product/run/confirmed-run-history]
    why: Supplies deterministic journal observations for admission and failure checks.
  - path: "internal/run/fixture_test.go"
    form: test
    realizes: [product/run/confirmed-run-history]
    why: Supplies actual model and organization producer values for run tests.
  - path: "internal/run/journal.go"
    form: code
    realizes: [product/run/confirmed-run-history]
    why: Defines the consumer-owned journal port and closed versioned byte records.
  - path: "internal/run/journal_test.go"
    form: test
    realizes: [product/run/confirmed-run-history]
    why: Checks closed records, exact retries and journal acknowledgement failures.
  - path: "internal/run/restore.go"
    form: code
    realizes: [product/run/confirmed-run-history]
    why: Reconstructs confirmed state from complete bounded journal reads without replaying effects.
  - path: "internal/run/restore_binding.go"
    form: code
    realizes: [product/run/confirmed-run-history]
    why: Validates historical basis records and their required owner payload references.
  - path: "internal/run/restore_test.go"
    form: test
    realizes: [product/run/confirmed-run-history]
    why: Checks pinned reconstruction, corrupt history refusal and retained recovery holds.
  - path: "internal/run/state.go"
    form: code
    realizes: [product/run/confirmed-run-history]
    why: Reduces confirmed lifecycle and budget transitions without ambient effects.
  - path: "internal/run/state_test.go"
    form: test
    realizes: [product/run/confirmed-run-history]
    why: Checks lifecycle admission, budget conservation and retained uncertainty.
  - path: "internal/run/manager.go"
    form: code
    realizes: [product/run/confirmed-run-history]
    why: Binds initial Explore inputs to actual compiler and organization preparation and closes inline report records.
  - path: "internal/run/manager_state.go"
    form: code
    realizes: [product/run/confirmed-run-history]
    why: Records every Manager's initial assessment and quiescence in the existing Coordinator without granting work authority.
  - path: "internal/run/manager_test.go"
    form: test
    realizes: [product/run/confirmed-run-history]
    why: Distinguishes initial participation, exact input provenance, protected review demand and historical replay from fresh execution.
