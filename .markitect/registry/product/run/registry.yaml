apiVersion: markitect.registry/v1
artifacts:
  - path: "experiments/recursive-apply-demo/README.md"
    form: doc
    realizes: [product/run/confirmed-run-history]
    why: "Explains the real library demonstration harness and its timed and untimed steps."
  - path: "experiments/recursive-apply-demo/analyze.py"
    form: code
    realizes: [product/run/confirmed-run-history]
    why: "Summarizes one Apply's evidence: rounds, turns, parallelism, findings and usage."
  - path: "experiments/recursive-apply-demo/extract-execution.yaml"
    form: config
    realizes: [product/run/confirmed-run-history]
    why: "Declares the Extract run controls of the library case-3 target: layout root, budget and no required checks."
  - path: "experiments/recursive-apply-demo/library-execution.yaml"
    form: config
    realizes: [product/run/confirmed-run-history]
    why: "Declares the library target's layout, budget, profiles and required checks for the demonstration."
  - path: "experiments/recursive-apply-demo/nochange_apply.sh"
    form: code
    realizes: [product/run/confirmed-run-history]
    why: "Runs the separate no-change Apply on the accepted A2 outside the timed demonstration."
  - path: "experiments/recursive-apply-demo/owner-decisions.json"
    form: config
    realizes: [product/run/confirmed-run-history]
    why: "Holds the two owner decisions bound with every demonstration run."
  - path: "experiments/recursive-apply-demo/ra_assess.sh"
    form: code
    realizes: [examples/independent-oracles]
    why: "Assesses the published A1 and A2 with the independent oracle after the timed run."
  - path: "experiments/recursive-apply-demo/ra_bind.sh"
    form: code
    realizes: [product/run/confirmed-run-history]
    why: "Binds an attempt to one build with Sonnet Host profiles, check profiles, token file and frozen scripts."
  - path: "experiments/recursive-apply-demo/ra_build.sh"
    form: code
    realizes: [product/run/confirmed-run-history]
    why: "Builds the runtime, project and oracle images and the CLI from one exact commit."
  - path: "experiments/recursive-apply-demo/ra_cleanup.sh"
    form: code
    realizes: [product/run/confirmed-run-history]
    why: "Stops every remaining demonstration container within the hard limit."
  - path: "experiments/recursive-apply-demo/ra_demo.sh"
    form: code
    realizes: [product/run/confirmed-run-history]
    why: "Enforces the hard wall-clock limit of the timed demonstration outside every prompt."
  - path: "experiments/recursive-apply-demo/ra_extract.sh"
    form: code
    realizes: [product/run/confirmed-run-history]
    why: "Runs the timed library Extract, the scripted adoption and the round-trip Apply."
  - path: "experiments/recursive-apply-demo/ra_extract_project.sh"
    form: code
    realizes: [product/run/confirmed-run-history]
    why: "Projects the case-3 target: a published library realization with vocabulary but without any model."
  - path: "experiments/recursive-apply-demo/ra_inner.sh"
    form: code
    realizes: [product/run/confirmed-run-history]
    why: "Projects the target, runs both Applies and performs the owner's commit and model change between them."
  - path: "experiments/recursive-apply-demo/ra_project.sh"
    form: code
    realizes: [product/run/confirmed-run-history]
    why: "Creates the model-only Library M1 target repository."
  - path: "experiments/recursive-apply-demo/ra_runconfig.py"
    form: code
    realizes: [product/run/confirmed-run-history]
    why: "Writes each Apply's run configuration with bound owner decisions and the shared deadline."
  - path: "experiments/recursive-apply-demo/smoke_apply.sh"
    form: code
    realizes: [product/run/confirmed-run-history]
    why: "Runs one Apply with a short deadline as a plumbing smoke outside the timed demonstration."
  - path: "experiments/recursive-apply-demo/writes.py"
    form: code
    realizes: [product/run/confirmed-run-history]
    why: "Approximates which areas each Manager wrote, from Execute transcripts."
  - path: "internal/run/agents.go"
    form: code
    realizes: [product/run/confirmed-run-history]
    why: Defines the Agents port, the Turn and tool contract and the usage a provider reports.
  - path: "internal/run/reconcile.go"
    form: code
    realizes: [product/run/confirmed-run-history]
    why: Defines the reconciliation contract with Config, Manager, Check, Finding, Outcome and Reconcile.
  - path: "internal/run/engine.go"
    form: code
    realizes: [product/run/confirmed-run-history]
    why: Validates the configuration, drives the rounds, captures candidates and owns the run's stop, evidence and volume handling.
  - path: "internal/run/verify.go"
    form: code
    realizes: [product/run/confirmed-run-history]
    why: Runs a Verify round with accounting, parallel required checks, fresh Verify turns children first, the assess tool and the open findings.
  - path: "internal/run/execute.go"
    form: code
    realizes: [product/run/confirmed-run-history]
    why: Schedules parallel Execute turns in the shared tree, routes messages along parent and child contacts and polls the owner's answers.
  - path: "internal/run/checktool.go"
    form: code
    realizes: [product/run/confirmed-run-history]
    why: Serves the optional Execute tool check, which peeks the shared tree and answers with the accounting findings, the caller's first.
  - path: "internal/run/turn.go"
    form: code
    realizes: [product/run/confirmed-run-history]
    why: Runs and records one Agent turn and checks tool arguments.
  - path: "internal/run/tools.go"
    form: code
    realizes: [product/run/confirmed-run-history]
    why: Defines the Host tool schemas of Execute and Verify turns.
  - path: "internal/run/prompts.go"
    form: code
    realizes: [product/run/confirmed-run-history]
    why: Renders the mandate, the Execute and Verify prompts and the finding items.
  - path: "internal/run/values.go"
    form: code
    realizes: [product/run/confirmed-run-history]
    why: Holds the shared validation helpers for identifiers, text and image identities.
  - path: "internal/run/workspace.go"
    form: code
    realizes: [product/run/confirmed-run-history]
    why: Defines the consumer-owned Workspaces port that materializes, harvests and closes volumes.
  - path: "internal/run/checks.go"
    form: code
    realizes: [product/run/confirmed-run-history]
    why: Defines the consumer-owned Checks port and what a check receipt establishes.
  - path: "internal/run/workspace_test.go"
    form: test
    realizes: [product/run/confirmed-run-history]
    why: Checks the bounds of workspace requests and when a harvest is complete.
  - path: "internal/run/checks_test.go"
    form: test
    realizes: [product/run/confirmed-run-history]
    why: Checks that check requests are complete and bounded and when a receipt passes.
  - path: "internal/run/fakes_test.go"
    form: test
    realizes: [product/run/confirmed-run-history]
    why: Supplies scripted Agents, in-memory Workspaces, Checks, Owner and recording Evidence for reconciliation tests.
  - path: "internal/run/reconcile_test.go"
    form: test
    realizes: [product/run/confirmed-run-history]
    why: Checks Verify order, parallel Execute, routing, owner questions, open findings, checks and observed writes.
  - path: "internal/run/directions_test.go"
    form: test
    realizes: [product/run/confirmed-run-history]
    why: Checks the custom mandate and Verify guidance, the unchanged Apply texts and the check tool.
  - path: "internal/run/artifact_findings_test.go"
    form: test
    realizes: [product/run/confirmed-run-history]
    why: Checks the assess schema with and without artifact findings, their refusals and that an artifact finding is stored non-blocking.
  - path: "internal/run/failure_test.go"
    form: test
    realizes: [product/run/confirmed-run-history]
    why: Checks unobserved stops, incomplete capture, deadline, turn and round budgets, evidence failure and invalid configuration.
  - path: "internal/run/README.md"
    form: doc
    realizes: [product/run/confirmed-run-history]
    why: Documents the reconciliation engine, its ports, tools and stopping rules.
