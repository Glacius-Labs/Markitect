apiVersion: markitect.registry/v1
artifacts:
  - path: "internal/run/check_observations_test.go"
    form: test
    realizes: [product/run/confirmed-run-history]
    why: "Refuses substituted or incomplete fixed-candidate receipt identities, directory inventory, exits and closure at Run and publication checkpoints."
  - path: "internal/run/checks.go"
    form: code
    realizes: [product/run/confirmed-run-history]
    why: "Defines the consumer-owned Checks port and what a check receipt establishes."
  - path: "internal/run/README.md"
    form: doc
    realizes: [product/run/confirmed-run-history]
    why: Documents the Orchestrator's one Pass process, its ports, tools, findings and stopping rules.
  - path: "internal/adapters/runstore/store.go"
    form: code
    realizes: [product/run/confirmed-run-history]
    why: "Executes or verifies a closed complete Manager hierarchy, exact durable handoffs, independent reopening and concurrent project Notes with bounded failure handling."
  - path: "internal/adapters/runstore/store_test.go"
    form: test
    realizes: [product/run/confirmed-run-history]
    why: "Executes or verifies a closed complete Manager hierarchy, exact durable handoffs, independent reopening and concurrent project Notes with bounded failure handling."
  - path: "internal/run/contracts.go"
    form: code
    realizes: [product/run/confirmed-run-history]
    why: "Executes or verifies a closed complete Manager hierarchy, exact durable handoffs, independent reopening and concurrent project Notes with bounded failure handling."
  - path: "internal/run/execute.go"
    form: code
    realizes: [product/run/confirmed-run-history]
    why: "Executes or verifies a closed complete Manager hierarchy, exact durable handoffs, independent reopening and concurrent project Notes with bounded failure handling."
  - path: "internal/run/inbox.go"
    form: code
    realizes: [product/run/confirmed-run-history]
    why: "Executes or verifies a closed complete Manager hierarchy, exact durable handoffs, independent reopening and concurrent project Notes with bounded failure handling."
  - path: "internal/run/hosttime.go"
    form: code
    realizes: [product/run/confirmed-run-history]
    why: "Lets a Session adapter spend host time outside the provider, such as the wait before repeating a response after a transient provider error, without counting it against the response clock; the Run deadline still bounds it."
  - path: "internal/run/hosttime_test.go"
    form: test
    realizes: [product/run/confirmed-run-history]
    why: "Checks that host time holds the response clock as a served tool call does, lets it run again afterwards and changes nothing without a clock."
  - path: "internal/run/inbox_test.go"
    form: test
    realizes: [product/run/confirmed-run-history]
    why: "Executes or verifies a closed complete Manager hierarchy, exact durable handoffs, independent reopening and concurrent project Notes with bounded failure handling."
  - path: "internal/run/handoff.go"
    form: code
    realizes: [product/run/confirmed-run-history]
    why: "Fixes checked handoffs, reviews, delegations and Root completion against the assignment state; a late finding invalidates the acceptances resting on it."
  - path: "internal/run/handover.go"
    form: code
    realizes: [product/run/confirmed-run-history]
    why: "Hands only Findings that name a current Definition to Implement, keeps the others as Notes, refuses unbound Verify reject Findings and states the already-verified fact only from a stored closed Verify approval under the same basis."
  - path: "internal/run/handover_test.go"
    form: test
    realizes: [product/run/confirmed-run-history]
    why: "Checks that tools refuse Findings naming unknown Definitions and unbound Verify reject Findings with the next step, and that long unbound Findings become complete Notes."
  - path: "internal/run/assignment.go"
    form: code
    realizes: [product/run/confirmed-run-history]
    why: "Holds the explicit per-Manager assignment state whose named events bind a judgment to its task and assessed state."
  - path: "internal/run/validate.go"
    form: code
    realizes: [product/run/confirmed-run-history]
    why: "Holds the one validation of closed Run results and the Run-internal closure names it requires, so workflow and publication name no Run resource."
  - path: "internal/run/validate_test.go"
    form: test
    realizes: [product/run/confirmed-run-history]
    why: "Proves the closed-result validation accepts every mandate and refuses each broken binding, decision, Findings, closure and hierarchy property."
