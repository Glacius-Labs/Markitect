apiVersion: markitect.registry/v1
artifacts:
  - path: "internal/adapters/checks/README.md"
    form: doc
    realizes: [product/ports-and-adapters]
    why: Documents disposable exact-tree check execution and its observation and source evidence boundaries.
  - path: "internal/adapters/checks/container_metadata.go"
    form: code
    realizes: [product/adapters/checks/closed-check-metadata]
    why: Observes the complete regular executable inside an explicitly selected immutable image and projects source-bound prepared container configuration.
  - path: "internal/adapters/checks/container_metadata_decode.go"
    form: code
    realizes: [product/adapters/checks/closed-check-metadata]
    why: Decodes the closed container/v1 Check section with explicit engine, image, executable, literal arguments, environment and resource and output bounds.
  - path: "internal/adapters/checks/container_metadata_test.go"
    form: test
    realizes: [product/adapters/checks/closed-check-metadata]
    why: Exercises source-bound container preparation with controlled image readers, exact projection and refusal of invalid configuration or incomplete and mismatched evidence.
  - path: "internal/adapters/checks/container_profile.go"
    form: code
    realizes: [product/ports-and-adapters]
    why: Projects explicit container configuration and a declared check into the existing exact-tree CheckRequest without effects or inferred settings.
  - path: "internal/adapters/checks/container_profile_test.go"
    form: test
    realizes: [product/ports-and-adapters]
    why: Verifies literal request projection, defensive copies, existing Runner composition with controlled peers and refusal before effects.
  - path: "internal/adapters/checks/fixture_test.go"
    form: test
    realizes: [product/adapters/checks/closed-check-metadata]
    why: Tests the stated responsibility and retains negative boundaries.
  - path: "internal/adapters/checks/profile.go"
    form: code
    realizes: [product/adapters/checks/closed-check-metadata]
    why: Implements the stated responsibility within its declared boundary.
  - path: "internal/adapters/checks/runner.go"
    form: code
    realizes: [product/ports-and-adapters]
    why: Runs an exact allowed check through the container runtime on a verified disposable workspace and preserves uncertain outcomes.
  - path: "internal/adapters/checks/runner_test.go"
    form: test
    realizes: [product/ports-and-adapters]
    why: Distinguishes literal command and resource binding, failed tree verification, known failed exits, cancellation and unconfirmed cleanup.
  - path: "internal/adapters/checks/container_setup.go"
    form: code
    realizes: [product/adapters/checks/closed-check-metadata]
    why: Encodes an explicit container check profile as the closed Runtime section that the container metadata decoder reads back.
  - path: "internal/adapters/checks/container_setup_test.go"
    form: test
    realizes: [product/adapters/checks/closed-check-metadata]
    why: Round-trips the encoded container Runtime section through the metadata decoder and projection and verifies refusal of invalid profiles.
  - path: "internal/adapters/checks/candidate.go"
    form: code
    realizes: [product/adapters/checks/closed-check-metadata]
    why: "Binds declared checks to closed static image metadata and exact disposable copies while retaining actual execution and cleanup observations."
  - path: "internal/adapters/checks/copies.go"
    form: code
    realizes: [product/adapters/checks/closed-check-metadata]
    why: "Binds declared checks to closed static image metadata and exact disposable copies while retaining actual execution and cleanup observations."
  - path: "internal/adapters/checks/copy_materializer.go"
    form: code
    realizes: [product/adapters/checks/closed-check-metadata]
    why: "Consumes exact disposable trees from the existing Run service and retains physical check and closure observations."
