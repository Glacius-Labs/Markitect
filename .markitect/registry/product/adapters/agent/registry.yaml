apiVersion: markitect.registry/v1
artifacts:
  - path: "internal/adapters/claudecode/README.md"
    form: doc
    realizes: [product/ports-and-adapters]
    why: Documents the selected pinned Claude wire shapes, provenance and source-only evidence limits.
  - path: "internal/adapters/claudecode/codec.go"
    form: code
    realizes: [product/ports-and-adapters]
    why: Encodes selected caller inputs and retains bounded immutable Claude protocol observations without I/O.
  - path: "internal/adapters/claudecode/codec_fixture_test.go"
    form: test
    realizes: [product/ports-and-adapters]
    why: Supplies independently authored synthetic stream fixtures without provider captures or copied schemas.
  - path: "internal/adapters/claudecode/codec_test.go"
    form: test
    realizes: [product/ports-and-adapters]
    why: Distinguishes framing limits, identity preservation, control acknowledgments and independent result statuses.
  - path: "internal/adapters/codexappserver/README.md"
    form: doc
    realizes: [product/adapters/agent/closed-agent-metadata, product/ports-and-adapters]
    why: Documents closed image metadata and the bounded pinned protocol codec with its evidence limits.
  - path: "internal/adapters/codexappserver/codec.go"
    form: code
    realizes: [product/ports-and-adapters]
    why: Encodes selected provider messages and preserves bounded protocol observations without executing effects.
  - path: "internal/adapters/codexappserver/codec_fixture_test.go"
    form: test
    realizes: [product/ports-and-adapters]
    why: Supplies synthetic pinned protocol shapes without a provider or copied upstream schemas.
  - path: "internal/adapters/codexappserver/codec_test.go"
    form: test
    realizes: [product/ports-and-adapters]
    why: Distinguishes framing bounds, malformed messages, true raw identities and provider request and session identifiers.
  - path: "internal/adapters/codexappserver/metadata.go"
    form: code
    realizes: [product/adapters/agent/closed-agent-metadata]
    why: Observes selected immutable image metadata and preserves failures and partial acquisition.
  - path: "internal/adapters/codexappserver/metadata_decode.go"
    form: code
    realizes: [product/adapters/agent/closed-agent-metadata]
    why: Validates the closed source-bound image profile and captured instruction references.
  - path: "internal/adapters/codexappserver/metadata_decode_test.go"
    form: test
    realizes: [product/adapters/agent/closed-agent-metadata]
    why: Checks closed metadata parsing, instruction acquisition and unsupported profile or version refusal.
  - path: "internal/adapters/codexappserver/metadata_engine.go"
    form: code
    realizes: [product/adapters/agent/closed-agent-metadata]
    why: Exposes only image inspection and copying through the explicitly configured engine factory.
  - path: "internal/adapters/codexappserver/metadata_fixture_test.go"
    form: test
    realizes: [product/adapters/agent/closed-agent-metadata]
    why: Supplies real Apply profile inputs from bounded model and source fixtures.
  - path: "internal/adapters/codexappserver/metadata_test.go"
    form: test
    realizes: [product/adapters/agent/closed-agent-metadata]
    why: Checks actual Apply image evidence, immutable identity, acquisition failures and factory boundaries with fake readers.
