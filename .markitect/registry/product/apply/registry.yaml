apiVersion: markitect.registry/v1
artifacts:
  - path: "internal/apply/assignment_publication.go"
    form: code
    realizes: [product/run/confirmed-run-history]
    why: Publishes only the exact independently verified assignment result through the existing guarded publisher and read-back.
  - path: "internal/apply/assignment_publication_test.go"
    form: test
    realizes: [product/run/confirmed-run-history]
    why: Refuses publication when the accepted assignment commit differs from the integrated tree or final independent Verify decision.
  - path: "internal/apply/assignment_workspace_ids.go"
    form: code
    realizes: [product/run/confirmed-run-history]
    why: Derives every possible Manager and independent reviewer Git workspace name from the prepared topology and finite invocation allowance for one Apply-lifetime Git container.
  - path: "internal/apply/assignment_realization.go"
    form: code
    realizes: [product/run/confirmed-run-history]
    why: "Executes separate model assessment, Implement assignments and independent final Verify over named Git results with shared finite bounds and targeted correction, without publication or legacy Outcome projection."
  - path: "internal/apply/assignment_context.go"
    form: code
    realizes: [product/organization/delegated-context]
    why: "Builds focused assignment briefs and independent review context from actual model selections, required checks, ownership and ordinary retained Git handoffs."
  - path: "internal/apply/assignment_realization_test.go"
    form: test
    realizes: [product/organization/delegated-context, product/run/confirmed-run-history]
    why: "Controls assignment ports against prepared model inputs to verify blocker stops, preservation, correction, named final checks, one invocation allowance and retained incomplete work; it is not provider evidence."
  - path: "internal/apply/README.md"
    form: doc
    realizes: [product/ports-and-adapters, product/apply/read-only-preparation]
    why: Documents captured preparation, the controlled state consumer and outstanding physical adapter obligations.
  - path: "internal/apply/brief.go"
    form: code
    realizes: [product/organization/delegated-context]
    why: Renders each Manager's standing Brief from its context selection, areas, registry shard, required checks and configured instructions.
  - path: "internal/apply/brief_values_test.go"
    form: test
    realizes: [product/organization/delegated-context]
    why: Checks against a tiny hand-written model that a stated Definition keeps every value kind exactly, its final sentence and each body link with the identity its alias resolves to, and that dropping any of them is detected.
  - path: "internal/apply/apply.go"
    form: code
    realizes: [product/run/confirmed-run-history]
    why: Binds the run and its strategy from one passed capture, composes the direct or staged work Passes and Verify with corrections and reassessment, and publishes a verified candidate through the guarded Publisher.
  - path: "internal/apply/assess.go"
    form: code
    realizes: [product/organization/delegated-context, product/run/confirmed-run-history]
    why: The mandatory Model assessment before any work, with Session C's method and the model problem classes, and the evaluation entry that runs only the assessment.
  - path: "internal/apply/apply_test.go"
    form: test
    realizes: [product/run/confirmed-run-history]
    why: Tests the organization, briefs, checks, budget deadline, gates and write plans of the run configuration, publication refusals and an unverified run with fake ports.
  - path: "internal/apply/assessment_test.go"
    form: test
    realizes: [product/run/confirmed-run-history]
    why: Tests the production assessment entry's frozen method reference, read-only reviewers without checks or publication, closed Run, confirmed finding classes and fresh reassessment of a disputed finding.
  - path: "internal/apply/binding.go"
    form: code
    realizes: [product/run/confirmed-run-history]
    why: Records what an Apply binds its Run to before any Agent work, the strategy with its work sequence, the effective settings and the implementation identity, for run.start and the report.
  - path: "internal/apply/compose_test.go"
    form: test
    realizes: [product/run/confirmed-run-history]
    why: Checks that direct runs Implement before Verify with Implement as its only correction, that staged runs Plan, Prepare and Implement, that both share Verify, and that work Passes repeat or restart only at an earlier purpose their own findings name and never skip a forward Pass.
  - path: "internal/apply/export_test.go"
    form: test
    realizes: [product/run/confirmed-run-history]
    why: Exposes the use case's configuration and publication steps to the external tests.
  - path: "internal/apply/candidates.go"
    form: code
    realizes: [product/realization/artifact-accounting]
    why: Accounts candidate trees against the captured start, owner by owner, for the closing structural gate.
  - path: "internal/apply/candidates_test.go"
    form: test
    realizes: [product/realization/artifact-accounting]
    why: Checks candidate ownership, areas and findings on the library layout, including a registration in the wrong shard.
