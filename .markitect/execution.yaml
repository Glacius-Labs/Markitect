apiVersion: markitect.execution/v1
strategy: recursive-apply-v1
limits:
  maxRuns: 5
  maxSessionStarts: 160
  maxSteps: 320
  maxExecutionTime: 16h
  maxStepTimeout: 10m
  hostOperationTimeout: 2m
  maxReviewRounds: 3
  maxContextBytes: 400000
  maxSessionSteps: 40
  maxTransientRetries: 2
  creationRoots: [cmd, internal, docs, integration, tools, experiments, .github, .githooks, .markitect/modules]
assignment:
  runs: 3
  sessionStarts: 80
  steps: 160
  executionTime: 8h
completionReserve:
  sessionStarts: 24
  steps: 40
  executionTime: 2h
defaults:
  profiles:
    manager: markitect-agent
    reviewer: markitect-agent
  reviewRounds: 3
  batchNoChangeReviews: false
  stepTimeout: 10m
  creationRoots: [cmd, internal, docs, integration, tools, experiments, .github, .githooks, .markitect/modules]
packages: {}
checks:
  - id: go-tests
    profile: go
    directory: .
    args: [test, ./..., -count=1]
    requiredBy: tooling/gates/go-tests
    timeout: 10m
acceptance:
  ownerApproval: []
