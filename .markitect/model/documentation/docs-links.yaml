apiVersion: project.markitect.example.org/v1alpha1
kind: Check
metadata:
  name: docs-links
  namespace: documentation
purpose: Checks local links in the maintained documentation.
spec:
  command:
    - python
    - -B
    - scripts/check-docs.py
  uses:
    - namespace: documentation
      name: documentation
    - namespace: ""
      name: repository
  limitation: The default corpus is the maintained entry documents; it checks local targets and anchors, not prose or dependencies.
