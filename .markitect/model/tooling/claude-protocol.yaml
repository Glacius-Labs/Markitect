apiVersion: project.markitect.example.org/v1alpha1
kind: Check
metadata:
  name: claude-protocol
  namespace: tooling
purpose: Checks the provider proposal adapter protocol with deterministic tests.
spec:
  command:
  - python
  - -B
  - -m
  - unittest
  - discover
  - -s
  - src/internal/tooling/clauderunner
  uses:
  - namespace: tooling
    name: tooling
  limitation: Tests the local adapter protocol without real providers; does not establish
    provider behavior.
