apiVersion: project.markitect.example.org/v1alpha1
kind: Statement
metadata:
  name: module-pin-contract
  namespace: tooling
purpose: Defines the deterministic hook and pipeline checks and their limits.
spec:
  category: rule
  description: Hook and pipeline configuration names exact tracked artifact paths
    and their canonical Artifact identities. Checks load one selected project snapshot,
    require a passed complete project model, validate exact bytes against recorded
    digests, and compare selected workflow YAML scalars to literal space-joined Check
    command arguments selected by unique check name. Check namespaces are not pipeline
    reference keys; duplicate names fail closed. They neither install or execute hooks nor execute workflows;
    these pins do not establish behavior or human acceptance.
  public: true
  uses:
  - namespace: ''
    name: canonical-sources
  requires: []
