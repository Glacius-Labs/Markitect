apiVersion: project.markitect.example.org/v1alpha1
kind: Check
metadata:
  name: module-checks
  namespace: tooling
purpose: Checks current project ownership and exact hook and pipeline pins.
spec:
  command:
  - go
  - run
  - ./src/cmd/markitect-check-modules
  - --repo
  - .
  - --hooks
  - .markitect/modules/githooks.config
  - --pipelines
  - .markitect/modules/pipelines.config
  uses:
  - namespace: tooling
    name: module-pin-contract
  - namespace: ''
    name: repository
  limitation: Compares bytes and selected literal YAML command scalars by unique check
    name in one snapshot; namespaces are not pipeline reference keys. Runs neither hooks nor workflows.
