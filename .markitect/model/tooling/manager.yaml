apiVersion: project.markitect.example.org/v1alpha1
kind: Manager
metadata:
  name: tooling
  namespace: tooling
purpose: "Owns maintainer tooling: the import gate, release building and publication, notices, packaging and the bootstrap."
spec:
  parent:
    namespace: ""
    name: markitect
  owns:
    - .markitect/modules/githooks.config
    - .markitect/modules/pipelines.config
    - .githooks/pre-commit
    - .github/workflows/ci.yaml
    - src/cmd/markitect-check-modules/
    - src/internal/application/modulecli/
    - src/internal/application/modulechecks/
    - src/internal/modules/githooks/
    - src/internal/modules/pipelines/
    - src/internal/application/architecturecli/
    - integration/
    - packaging/
    - src/cmd/markitect-check-architecture/
    - src/internal/tooling/
    - tools/
  instructions: Validate a release candidate and publish it only through the documented release process.
