apiVersion: project.markitect.example.org/v1alpha1
kind: Artifact
metadata:
  name: module-verification
  namespace: tooling
purpose: Declares the exact hook and pipeline inputs and the code that checks their
  pins.
spec:
  role: verification
  realizes:
  - namespace: tooling
    name: tooling
  - namespace: tooling
    name: module-pin-contract
  - namespace: ''
    name: canonical-sources
  paths:
  - .markitect/modules/githooks.config
  - .markitect/modules/pipelines.config
  - .githooks/pre-commit
  - .github/workflows/ci.yaml
  - src/cmd/markitect-check-modules/
  - src/internal/host/modulecli/
  - src/internal/host/modulechecks/
  - src/internal/modules/githooks/
  - src/internal/modules/pipelines/
  checks:
  - namespace: tooling
    name: module-checks
  - namespace: tooling
    name: architecture-gate
  - namespace: ''
    name: go-tests
  - namespace: ''
    name: go-vet
  required: true
  reason: These exact files and packages preserve byte, ownership and literal workflow-command
    checks without the retired Project/Domain model.
