imports:
  - package: vocabulary
    as: Vocab
id: delegated-context
kind: Vocab.Rule
body: >-
  Derive one ordinary Root and one Manager per local canonical Package from authoritative checked facts. Every Manager, including empty and intermediate Packages, participates in every Assessment, Implement and Verify Run; no Agent prunes the required hierarchy by relevance.
  Deliver each Manager's selected Definitions and contracts in full, with original bodies, typed values, resolved links, provenance and ownership. Give each parent, for each direct child, a compact index of every Definition in that child's subtree with its Kind, title and repository file, without bodies, and name the repository file of every delivered in-repository Definition. Label foreign context and Root's complete project inventory clearly. Include declared instructions, owned areas, scoped checks, mandate and mandatory Findings. Refuse mandatory-context overflow explicitly rather than silently truncating it.
  A Manager realizes its own responsibilities and coordinates, reviews and integrates its direct children. Parents supply foundations and actual task bases, inspect complete fixed child diffs, return gaps to their owner and integrate accepted commits. They do not subtract accepted child paths from later parent review or excuse a child's obligations.
  Managers communicate directly through correlated Run-local delegation, questions and replies, including crossed questions and later questions to completed Managers in the same conversation. No question crosses Root to the invoking AI or owner, and no preloaded owner decision supplies missing intent.
  Answers clarify the fixed model and never override it. Material contradictions or missing canonical policy are model blockers; ordinary implementation choices stay with their responsible Manager. Root reports confirmed model defects without publication so intent can be corrected outside the Run.
  Apply changes artifacts only for modeled obligations, required checks or necessary consequences of that work. Preserve conforming artifacts even when another design is preferred. A Definition is realized by its owner's artifacts; other areas use that realization rather than rebuilding it. Parents settle cross-area interactions within accepted intent.
  Independent fresh Verify judges the fixed integrated candidate and the actual assertions and limits of its tests. Concrete Findings survive review and closure and reach the responsible correction Run. Green totals, provider completion and unsupported self-approval do not establish semantic completeness. Required late findings invalidate affected acceptance.
  Shared Notes are attributed noncanonical hints, never authority or hidden requirements. Generated prompts express the bound model and mandate without becoming a second owner of binding project rules. Complete context delivery does not prove that an Agent followed it. The confirmed-run-history Rule owns lifecycle, mandate decisions, finite limits and durable results.
