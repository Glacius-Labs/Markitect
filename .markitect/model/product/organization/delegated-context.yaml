imports:
  - package: vocabulary
    as: Vocab
id: delegated-context
kind: Vocab.Rule
body: "Derive one ordinary root and one Manager per local canonical Package from authoritative compiled facts. Resolve settings exactly and select context only through declared model links and reasons. Preserve the provenance of limits and settings. Compile each Manager context deterministically from explicit model facts, never AI relevance selection or inferred missing relationships. Supply the same static operation instruction with separately compiled local context and configuration. Every local Manager, including empty and intermediate Packages, participates; do not optimize a Manager out. Require Managers and independent reviewers to derive relevant technical risks and necessary evidence from applicable obligations, available operating conditions and the actual realization, including interactions between areas. Reviewers first derive independent model-based expectations, then investigate implementation-specific risks when the candidate is supplied and request additional evidence through existing findings. Managers investigate and repair violations within their mandate without requiring the owner to enumerate each technical failure mode. Preserve existing intent; a derived technical consequence is not a new project rule, while a changed business policy or a necessary missing model link requires a separate model decision. Keep risks, evidence and unresolved concerns in existing assessments, reports and findings. Do not infer ownership, runtime state or provider facts."
spec: {}
