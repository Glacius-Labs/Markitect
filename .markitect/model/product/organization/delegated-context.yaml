imports:
  - package: vocabulary
    as: Vocab
id: delegated-context
kind: Vocab.Rule
body: >-
  Derive one ordinary Root and one Manager per local canonical Package from authoritative compiled facts.
  Keep responsibilities and artifact-area mappings persistent across Applies, with a mirrored model hierarchy as the default layout and explicit persistent project exceptions.
  Supply the same reconciliation mandate with separately compiled applicable model obligations, provenance, fixed owner decisions and direct-parent/child roles and contacts.
  Every local Manager, including empty and intermediate Packages, assesses its responsibility; do not select participants by AI relevance.
  Managers communicate only with their direct parent and children; only Root escalates to the human.
  Include required cross-area contracts without granting additional contacts, write ownership or inferred missing model links.
  A Manager realizes, coordinates and integrates its area and reviews it in fresh Verify conversations without the author's dialogue.
  A parent supplies the foundations its children need within its own area, coordinates and integrates them; it never implements their areas or releases them from their obligations.
  A Definition is realized by its owner's artifacts; other areas use that realization instead of rebuilding it, and no Manager touches anything outside its area. The parent settles cross-area matters between its children.
  Children begin after their parent's first Execute turn supplied the needed foundation; siblings then proceed in parallel.
  Parents inspect their own obligations and actual child interaction rather than merely collecting green reports.
  Derive technical risks and suitable evidence from the model and realization without a mandatory advance expectations phase or per-case ledger.
  Preserve intent; changed policy or a necessary missing canonical link needs a separate model decision.
  Per-area prompts explain responsibility and work but never become a second owner of binding project rules.
