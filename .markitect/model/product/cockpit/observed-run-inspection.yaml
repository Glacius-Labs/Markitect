imports:
  - package: vocabulary
    as: Vocab
id: observed-run-inspection
kind: Vocab.Rule
body: >-
  Present runs only through their recorded evidence under the state directory: the events, transcripts and report of each run, read as consistent prefixes up to an explicit record boundary; nothing recorded after the boundary reaches its view, and the report appears only at the final boundary.
  Show the organization, current work, recorded waits with the records and participants they name, exchanges with their direction and their author (an Agent, the Orchestrator or the owner channel), Passes, candidates, checks, findings, questions and the publication's read-back as recorded.
  Never infer a delivery, a reading, a correlation, a success or an authority the record does not establish; show outdated waits, missing outcomes or reports, unreadable or unknown records and absent bindings as limitations.
  Reading, replay, pause, selection and reconnection start, answer, stop, repair and publish nothing, and the view serves only the local machine.
spec: {}
