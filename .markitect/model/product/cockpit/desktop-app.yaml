imports:
  - package: vocabulary
    as: Vocab
id: desktop-app
kind: Vocab.Rule
body: >-
  The cockpit is the owner's desktop app for Markitect: opened without arguments it shows a per-user list of projects, each a repository with the runtime directory that setup fills, and it opens its local address in its own app window.
  A project is set up through the same function as markitect setup, which writes exactly what setup writes and refuses where setup refuses.
  Only the owner starts a run, after a confirmation that names the committed execution budget, the run configuration's deadline and the Agent profile; the cockpit never starts a run by itself.
  A started run is the same Apply as markitect apply with the same inputs, checks, budget, evidence and publication, and one run holds a state directory at a time.
  Stopping a run the cockpit started ends it incomplete with its report and evidence, as an interrupted markitect apply, and restores nothing; runs started elsewhere are only observed.
  Closing the window keeps the cockpit and its runs working; with the owner's permission it notifies when a run ends or a decision waits for the owner.
spec: {}
