imports:
  - package: vocabulary
    as: Vocab
id: observed-organization
kind: Vocab.Rule
body: >-
  Present the project organization as the model's complete local Package hierarchy with Root, an ordinary Manager for every Package, its own Definitions and the actual owned areas with more specific ownership exclusions.
  Show declared execution defaults, exact Package overrides, the project-wide helper team with profiles, write roles and maximum helpers active per Manager, the run-wide strategy and declared checks from the same structural observation as the model browser.
  Resolve product defaults, profile bindings and their provider models only on the owner's request with a configured Runtime profile, through the same committed-source capture as the run-start confirmation; retain progress, refusal and source identity, and clearly distinguish declared from resolved values.
  Display the organization as a top-down chart with the owner above the deterministic Orchestrator, Root and Package Managers, people cards and a separate independent reviewer seat on a dotted line; support collapse, pan, zoom, fit, a small-window tree, keyboard navigation and reduced motion.
  Organization selection links to its model responsibilities and the existing settings proposal flow; the chart itself changes no organization or settings.
  Reuse the chart for a Run's recorded binding and boundary, with an honest fallback where binding is absent; show only recorded work, waits, observations, exchanges and usage, preserve replay and selection, and show no live external owner channel in a closed Run.
spec: {}
