imports:
  - package: vocabulary
    as: Vocab
id: container-runtime
kind: Vocab.Rule
body: "Run every Agent session and project check in a hardened Linux container from a runtime image named by its engine image ID: a check, a probe and a helper turn in a fresh container of their own, the turns of one Manager's or reviewer's conversation in that working environment's kept container for exactly the turn's capabilities (image, mounts with their writability, home and resources), never with other rights than it was created with. Before a turn ends, every process it started has ended as a process census of the container observes, or the container is removed and its removal observed; otherwise the turn did not stop. Nothing runs in a kept container between turns, reviewers' containers end with their review Pass and all others with the Run, and the scheduling of a Run depends on no container engine. markitect-agentd is the only program the Orchestrator talks to: it starts the provider CLI, relays its standard streams, serves the Orchestrator tools over MCP on a Unix socket inside the container and reports exits, adding no policy. The Orchestrator passes only validated specs to the engine, gives containers named volumes and never host paths, mounts the shared tree read-only with only the session's permitted directories and exact files overlaid writable and other owners' deeper ones read-only, runs them as a non-root user with a read-only root filesystem, no capabilities and bounded resources, and refuses a different frame protocol."
spec: {}
