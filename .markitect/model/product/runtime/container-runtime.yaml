imports:
  - package: vocabulary
    as: Vocab
id: container-runtime
kind: Vocab.Rule
body: >-
  Every Run opens one fresh private Manager environment, working copy, provider home and conversation per required Manager, and one owned Git Workspace Service. Assessment, Implement and Verify use separate fresh Run environments; no Manager or Git service survives into a correction Run. Keep each Manager available for ordinary questions and renewed tasks until that Run closes.
  Native Managers and project checks execute in hardened Linux containers from explicitly prepared immutable engine image IDs. Give a Manager only its own private copy through an owned named-volume subpath; never synchronize a second writable host mirror or overlay other owners' paths. Responsibilities and reviewed handoffs govern work; per-write ACLs and custom evidence protocols are not prerequisites.
  Run as non-root with a read-only root filesystem, no capabilities or privilege escalation, and explicit finite CPU, memory, process and temporary-space limits. A narrow fixed initialization of a newly created empty owned volume may establish its non-root ownership; it grants no product work. Refuse mismatched images, unsafe mounts or incompatible frame protocols.
  markitect-agentd starts the native provider, relays framed streams and Run tools, and reports actual exits without owning model policy. Provision dedicated normal-account input privately into each Manager home; never put secrets into arguments, environment, transcripts, Notes or candidate bundles, and never share a mutable host login home. Codex has no API-key route. Provider support requires its own actual native evidence.
  Declared project checks use independent exact input and empty-home copies, preserve bytes, executable modes and required empty directories, and retain actual image, start, exit, timeout and closure observations. Publication reconstructs the stored candidate with host Git after Run closure and materializes its check copies independently; it never borrows a closed Run volume or Agent.
  Retain candidates before complete bounded resource closure. Persist and read back mandatory terminal results after closure, including actual cleanup observations and any uncertainty. Observe the end of every owned process, container, home, temporary copy and volume, including partial-start failures. Uncertain cleanup, acquisition, storage or transport blocks success and publication. The confirmed-run-history Rule owns the shared outer deadline, message allowance and closed terminal result.
