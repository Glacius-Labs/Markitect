imports:
  - package: vocabulary
    as: Vocab
id: container-runtime
kind: Vocab.Rule
body: "Run every Agent session and project check in its own hardened Linux container from a runtime image named by its engine image ID. markitect-agentd is the only program the Host talks to: it starts the provider CLI, relays its standard streams, serves the Host tools over MCP on a Unix socket inside the container and reports exits, adding no policy. The Host passes only validated specs to the engine, gives containers named volumes and never host paths, runs them as a non-root user with a read-only root filesystem, no capabilities and bounded resources, and refuses a different frame protocol."
spec: {}
