apiVersion: project.markitect.example.org/v1alpha1
kind: Manager
metadata:
  name: product
  namespace: product
purpose: "Owns the current product: its core, infrastructure, application and runtime packages and their executables."
spec:
  parent:
    namespace: ""
    name: markitect
  owns:
    - src/cmd/markitect/
    - src/cmd/markitect-exchange-executor/
    - src/cmd/markitect-release/
    - src/internal/core/
    - src/internal/infrastructure/
    - src/internal/runtime/agentexec/
    - src/internal/runtime/codexappserver/
    - src/internal/runtime/exchangecli/
    - src/internal/application/buildinfo/
    - src/internal/application/releaseinstall/
    - src/internal/application/mcp/
    - src/internal/application/projectadoption/
    - src/internal/application/projectapp/
    - src/internal/application/projecthistory/
    - src/internal/application/projectcli/
    - src/internal/application/projectcoverage/
    - src/internal/application/projectexplore/
    - src/internal/application/projectonboarding/
    - src/internal/runtime/projectconfig/
    - src/internal/runtime/projectexecutor/
    - src/internal/runtime/projectrun/
    - src/internal/runtime/projectsetup/
    - src/internal/application/projectwork/
    - src/internal/runtime/projectworkspace/
    - src/internal/application/releasecli/
  instructions: Read a package's owning document in the code map before you change the package, and update it when the package's behavior changes.
