apiVersion: project.markitect.example.org/v1alpha1
kind: Artifact
metadata:
  name: runtime-layer
  namespace: product
purpose: Maps the execution runtime to its packages and the reference executor.
spec:
  role: implementation
  realizes:
    - namespace: product
      name: product
    - namespace: product
      name: core-stays-generic
    - namespace: product
      name: explicit-relationships
    - namespace: legacy
      name: legacy-removal
    - namespace: product
      name: distinct-state
    - namespace: product
      name: evidence-not-acceptance
  paths:
    - src/cmd/markitect-exchange-executor/
    - src/internal/host/agentexec/
    - src/internal/host/codexappserver/
    - src/internal/host/exchangecli/
    - src/internal/host/projectrun/
    - src/internal/host/projectsetup/
    - src/internal/host/projectworkspace/
  checks:
    - namespace: ""
      name: go-tests
    - namespace: ""
      name: go-vet
    - namespace: tooling
      name: architecture-gate
  required: true
  reason: The runtime runs Manager, review and verify roles in owned workspaces and applies only verified candidates.
