imports:
  - package: vocabulary
    as: Vocab
id: artifact-accounting
kind: Vocab.Rule
body: >-
  Account for every observed regular file exactly once as a validated Markitect input, a registered artifact or an explicitly ignored file; Markitect inputs are the immutable authority inputs and the owner-writable local registries, and neither may be registered or ignored as an artifact.
  Ownership is the declared set of repository-relative directory and exact-file areas, each owned by Root or one local Package; the most specific area owns a path, equal specificity and files without an owner fail, and a broad area never absorbs a more specific one.
  Each Manager maintains only its own local registry of exact-file or directory entries with Definition links, forms and reasons; a directory entry covers only its registrant's eligible files below it, the most specific entry registers a file, and no file has two effective registrations.
  Missing paths, unexplained artifacts, duplicate accounting, wrong-owner registrations and changed authority inputs block, with machine-readable diagnostics addressed to the Manager that must act.
  A link to a Definition the checked model no longer has is stale realization, not invalid input: it is work for Implement, and neither a Manager's handoff nor a publication may keep one within its responsibility.
  So is the shard of a Package the model no longer has: the Manager owning the area of each file it still explains, or Root where no area owns it, registers that file in its own registry, which supersedes the orphaned entry, or removes it, and Root deletes the shard.
  Only the Orchestrator assembles the read-only derived registry view, from checked local versions, and records which versions it includes.
  Enforce writing ownership in every Agent's container: its own areas and its own registry writable, protected inputs and other owners' areas, deeper directories and exact files read-only; refuse an ownership shape that mounts cannot enforce instead of trusting prompts.
  Accept a basis or result only after the File check of the submitter's stable area composed with the accepted stand, so disjoint Managers work and finish concurrently without a mixed live view.
  Candidates preserve source identity and observed findings; pure accounting values do not schedule or publish work.
