imports:
  - package: vocabulary
    as: Vocab
id: ports-and-adapters
kind: Vocab.Rule
body: "Keep model, snapshot, organization and realization values independent of execution and infrastructure. Project owns structural acquisition, checked model-derived contexts and immutable candidate validation. Run consumes Project and organization directly and owns the complete closed hierarchy over consumer-owned Session, Git, check and record ports. Workflow selects fully closed Runs through its Run-only Executor boundary. Apply owns command preflight, the original shared allowance and independently reopened stored-candidate publication. Outer runtime configuration owns acquired static native/check profile metadata; it does not resolve model intent. Concrete adapters implement physical acquisition and protocols. Bootstrap composes actual services. All maintained Go code belongs to one root module and an explicit architecture responsibility; obsolete execution engines and their consumers retire together."
spec: {}
