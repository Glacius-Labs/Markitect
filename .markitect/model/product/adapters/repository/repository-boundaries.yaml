imports:
  - package: vocabulary
    as: Vocab
id: repository-boundaries
kind: Vocab.Rule
body: "Capture the complete actual repository census and selected original inputs with exact paths, modes and bytes. Working and fixed previews grant no publication guard; committed capture requires clean HEAD and retains its comparison guard. Resolve a symbolic revision once, retain the full identity, reject redirects and changed directory identity, and never replace historical sources with current external bytes."
spec: {}
