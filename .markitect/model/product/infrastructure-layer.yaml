apiVersion: project.markitect.example.org/v1alpha1
kind: Artifact
metadata:
  name: infrastructure-layer
  namespace: product
purpose: Maps the infrastructure layer to its packages.
spec:
  role: implementation
  realizes:
    - namespace: product
      name: product
    - namespace: product
      name: core-stays-generic
    - namespace: product
      name: explicit-relationships
    - namespace: product
      name: legacy-removal
    - namespace: ""
      name: canonical-sources
    - namespace: ""
      name: project-local-policy
    - namespace: product
      name: distinct-state
  paths:
    - internal/adapters/checks/
    - internal/adapters/codexappserver/
    - internal/adapters/gitrepo/
    - src/internal/infrastructure/
  checks:
    - namespace: ""
      name: go-tests
    - namespace: ""
      name: go-vet
    - namespace: tooling
      name: architecture-gate
  required: true
  reason: Repository inputs and guarded effects belong to infrastructure adapters.
