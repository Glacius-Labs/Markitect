imports:
  - package: vocabulary
    as: Vocab
id: confirmed-run-history
kind: Vocab.Rule
body: >-
  Bind each Run to the exact starting commit, model and dependency locks, ownership, execution settings, ignore policy, request, authority and finite limits; these authority inputs stay immutable, while owners change their own artifacts and local registry metadata only within the current Pass's write rights.
  Before any Agent work, run the strict Model check and File check of the captured stand; a failure ends the Run with its diagnostics, starts nothing and repairs nothing.
  The execution settings select the Apply strategy explicitly; before any Agent work the Run binds it with its effective settings and the implementation identity of the product build, records that binding in its evidence and refuses unknown strategies and settings, and tests and ordinary Apply resolve it through the same preparation and binding. Direct composes Implement, in which every Manager plans and prepares its own contribution, and staged composes Plan, Prepare and Implement, each then a separate Verify, as Passes of one recursive base process with a new identity each; a strategy changes only the work composition, never ownership, gates, evidence, Verify or acceptance strength, only the mandate, effects, purpose payload and acceptance differ between Passes, and no strategy, purpose or correction has an engine of its own; provider, model and container backend choices stay separate from the strategy.
  For every Manager, Root and leaves included: receive the Pass mandate, work locally, and submit an explicit basis that the Orchestrator checks technically on the stable submitted area and that the direct parent accepts semantically, Root's against the declared Pass requirements; only then release its children and stay available for their questions; review each child's basis and complete result, return gaps to their owner and integrate accepted results; submit the complete result; the Pass closes after whole-stand gates with one sealed result.
  A submitted proposal wakes its parent before the child is Done; a returned proposal stays its owner's work in the same Pass; a changed accepted basis explicitly invalidates its consumers.
  Managers are Ready, Working, Waiting or Done in each Pass, problems are structured reports, and a Turn ending, a provider exit, a timeout or an uncertain stop never establishes completion.
  A Manager its parent's basis released may answer routed questions in read-only turns while its productive dependencies are blocked; that neither releases its children nor completes its work.
  At every Pass boundary quiesce the writers, capture the whole stand, require it to equal the accepted stand and pass the Model check and the File check; a failure ends the Run failed without a repair Pass.
  Verify assesses one immutable candidate with fresh independent read-only reviewers and the required checks; a genuine finding stays open until a fresh independent assessment of its responsibility closes it, resolved on a corrected candidate or disproved with evidence on the unchanged one in a new complete Verify, and a failed required check cannot be disputed away.
  Implement and artifact-review coverage names material conditions, exceptions and interactions from the bound authority with concise source references and justified coverage, not only complete Definition identities. Done and preserved claims about executable public behavior need discriminating tool-produced receipts through its actual declared public entry on the submitted stand; private validators, source reassurance and suite totals do not close that behavior. Reasoned source inspection remains valid for static or documentary properties; required unavailable execution stays open.
  Every parent, including Root without own Definitions, records its own integration conditions and evidence for composed workflows and global invariants in the common basis/result mechanism; accepted children alone do not discharge integration and corrections remain with actual owners.
  Fresh independent reviewers derive their own conditions and counterexamples from the bound authority before assessing author coverage, including valid values wrongly refused and invalid values wrongly accepted; Extract retains fixed artifacts and documented intent as authority for its proposed model.
  In model-authoritative Apply Verify, all required reviewers first submit open model-derived bases without candidate evidence; their normal stopped Turns and parent decisions must accept every basis before any reviewer receives the candidate or author observations. Model questions and child-basis decisions remain available while waiting. A fresh Turn then introduces the immutable candidate in each reviewer's existing independent conversation and Home; the original precommitment remains visible and cannot be replaced after exposure. Fixed-artifact-authority Extract retains its existing process.
  Implement completion is a checked submission to Verify, not verified conformance. Bind an optional earlier finite work cutoff and preserve the declared capacity for independent Verify and observed stop/cleanup; expiry cancels unfinished work as Incomplete without skipping work or review, extending limits or publishing.
  Reviewers actively seek model-permitted counterexamples to material claims and assess public boundaries and interactions; accepting Managers challenge the actual assertions and evidence of their children rather than their success labels.
  Bind each executed behavioral observation used to accept conformance to a tool-produced receipt of the claim and expectation, exact candidate and probe bytes, permitted execution profile, actual invocation, outcome and observed stop; source-only observations identify the captured source and reasoning, and neither kind proves exhaustive coverage by its metadata.
  Retain adverse probe observations independently of report selection and require their explicit disposition before clean assessment; omission or unilateral optional relabeling cannot hide a failed required-claim probe, and an erroneous expectation needs independent reasoned disproof without weakening mandatory-check failures.
  An unsupported success claim or a concrete unresolved question affecting a required obligation cannot yield clean Verify; do not invent defects or optional changes to satisfy a finding quota.
  Declared start conditions name the needed accepted basis or complete result: in staged those of the accepted plans; in direct a Manager declares the accepted basis or complete result of another Manager outside its own line through its wait, which binds that accepted version unless the binding would close a cycle; a revision of it resets work whose basis built on it, which starts again only on the newly accepted version, and returns work whose result alone built on it to its integration; include implicit parent-first and integration edges when rejecting cycles, and unchanged idle waiting alone starts no Agent Turn while permitted routed communication retains finite Run limits.
  Route corrections through the earliest necessary normal work Pass of the bound strategy, Implement in direct and its own work purpose for Extract, followed by a complete fresh Verify; clean means no open genuine finding and passing required checks.
  Success requires clean Verify and an applied or no-change publication with exact read-back of the verified bytes; definite rejections fail, and unfinished work, exhausted limits, unresolved waits or uncertainty stay visibly incomplete with their evidence.
  Keep execution semantics independent of SQL, provider protocols and repository acquisition.
