imports:
  - package: vocabulary
    as: Vocab
id: confirmed-run-history
kind: Vocab.Rule
body: "Bind each run to its exact supplied model, repository, configuration and owner request. Admit work against finite assignment budgets and required review capacity. Change confirmed run state only after an exact journal acknowledgement. Preserve uncertain effects and their budget holds. The Orchestrator guarantees unchanged Apply propagation through every local Manager along direct parent-child edges. Managers act only on delivered messages and communicate only with their direct parent or children. Participation, required local and integration review, correction and completion follow a fixed Orchestrator protocol, never an AI plan. Managers judge local realization and integration, with reviewed change or no-change outcomes; parent-owned prerequisite work remains possible while children wait. Route cross-area questions through the tree and never compensate for missing model links. Finish only with current complete evidence and observed publication, not Agent consensus. Keep transition semantics separate from SQL, repository acquisition and provider protocols."
spec: {}
