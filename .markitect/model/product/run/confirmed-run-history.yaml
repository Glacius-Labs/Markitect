imports:
  - package: vocabulary
    as: Vocab
id: confirmed-run-history
kind: Vocab.Rule
body: >-
  Bind each Run to the exact starting commit, model and dependency locks, ownership, execution settings, ignore policy, request, authority and finite limits; these authority inputs stay immutable, while owners change their own artifacts and local registry metadata only within the current Pass's write rights.
  Before any Agent work, run the strict Model check and File check of the captured stand; a failure ends the Run with its diagnostics, starts nothing and repairs nothing.
  Apply composes Plan, Prepare and Implement and then a separate Verify as Passes of one recursive base process, each with a new identity; only the mandate, effects, purpose payload and acceptance differ, and no purpose or correction has an engine of its own.
  For every Manager, Root and leaves included: receive the Pass mandate, work locally, and submit an explicit basis that the Orchestrator checks technically on the stable submitted area and that the direct parent accepts semantically, Root's against the declared Pass requirements; only then release its children and stay available for their questions; review each child's basis and complete result, return gaps to their owner and integrate accepted results; submit the complete result; the Pass closes after whole-stand gates with one sealed result.
  A submitted proposal wakes its parent before the child is Done; a returned proposal stays its owner's work in the same Pass; a changed accepted basis explicitly invalidates its consumers.
  Managers are Ready, Working, Waiting or Done in each Pass, problems are structured reports, and a Turn ending, a provider exit, a timeout or an uncertain stop never establishes completion.
  A Manager its parent's basis released may answer routed questions in read-only turns while its productive dependencies are blocked; that neither releases its children nor completes its work.
  At every Pass boundary quiesce the writers, capture the whole stand, require it to equal the accepted stand and pass the Model check and the File check; a failure ends the Run failed without a repair Pass.
  Verify assesses one immutable candidate with fresh independent read-only reviewers and the required checks; a genuine finding stays open until a fresh independent assessment of its responsibility closes it, resolved on a corrected candidate or disproved with evidence on the unchanged one in a new complete Verify, and a failed required check cannot be disputed away.
  Route corrections through the earliest necessary normal work Pass followed by a complete fresh Verify; clean means no open genuine finding and passing required checks.
  Success requires clean Verify and an applied or no-change publication with exact read-back of the verified bytes; definite rejections fail, and unfinished work, exhausted limits, unresolved waits or uncertainty stay visibly incomplete with their evidence.
  Keep execution semantics independent of SQL, provider protocols and repository acquisition.
