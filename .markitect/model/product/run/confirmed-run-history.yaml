imports:
  - package: vocabulary
    as: Vocab
id: confirmed-run-history
kind: Vocab.Rule
body: >-
  Bind each Run to the exact starting commit, model and dependency locks, ownership, execution settings, ignore policy, request, authority and finite limits; these authority inputs stay immutable, while owners change their own artifacts and local registry metadata only within the current Pass's write rights.
  Before any Agent work, run the strict Model check and File check of the captured stand; a failure ends the Run with its diagnostics, starts nothing and repairs nothing.
  The execution settings select the Apply strategy explicitly; before any Agent work the Run binds it with its effective settings and the implementation identity of the product build, records that binding in its evidence and refuses unknown strategies and settings, and tests and ordinary Apply resolve it through the same preparation and binding. Direct composes Implement, in which every Manager plans and prepares its own contribution, and staged composes Plan, Prepare and Implement, each then a separate Verify, as Passes of one recursive base process with a new identity each; a strategy changes only the work composition, never ownership, gates, evidence, Verify or acceptance strength, only the mandate, effects, purpose payload and acceptance differ between Passes, and no strategy, purpose or correction has an engine of its own; provider, model and container backend choices stay separate from the strategy.
  Every Manager receives the Pass mandate, own obligations and authority, and starts when its actual prerequisites are available; no universal basis submission or parent preapproval is required. Parents supply coordination context and contracts or decisions their children actually need, remain available for questions, accept complete child results and integrate them with their own contribution. Whole-stand gates close the Pass with one sealed result.
  A submitted proposal wakes its parent before the child is Done; a returned proposal stays its owner's work in the same Pass; a changed accepted basis explicitly invalidates its consumers.
  Managers are Ready, Working, Waiting or Done in each Pass. The Host records each observed Turn end exactly once as a submission of its work and short semantic assessment, deriving the captured stand, changed paths, actual execution observations and identities itself. Only a successful native completion with observed stop may offer that assessment for acceptance; ending a Turn is not task completion, Verify or publication, and failure, timeout or uncertain stop never establishes success.
  An assigned Manager may answer routed questions in read-only turns while its actual productive dependencies are blocked; this neither clears those dependencies nor completes its work.
  At every Pass boundary quiesce the writers, capture the whole stand, require it to equal the accepted stand and pass the Model check and the File check; a failure ends the Run failed without a repair Pass.
  Verify assesses one immutable candidate with fresh independent read-only reviewers and the required checks; a genuine finding stays open until a fresh independent assessment of its responsibility closes it, resolved on a corrected candidate or disproved with evidence on the unchanged one in a new complete Verify, and a failed required check cannot be disputed away.
  Implement and artifact reviewers assess material conditions, exceptions and interactions from the bound model and explain relevant evidence and gaps in a concise result. Executable public behavior needs relevant evidence through its actual boundary; assessed existing tests may supply it, and new probes address material gaps. One execution can support several conclusions; no one-receipt/one-Definition/one-use restriction or mandatory per-obligation evidence-mapping artifact applies. Static properties may use reasoned source inspection; green totals alone do not establish semantic completeness.
  Every parent, including Root without own Definitions, assesses composed workflows, interfaces and shared invariants in its result using relevant child evidence and concrete challenges, without routine repetition of all child tests. Accepted children alone do not discharge integration; corrections remain with actual owners.
  Fresh independent reviewers derive their own conditions and counterexamples from the bound authority before assessing author coverage, including valid values wrongly refused and invalid values wrongly accepted.
  In model-authoritative Apply Verify, fresh independent reviewers receive the bound model and immutable candidate, derive their own expectations and scrutinize actual author assertions rather than trusting the author checklist. There is no separate pre-candidate basis artifact, basis approval or whole-tree waiting barrier. Independent reviewer conversations remain required; candidate-blind preregistration is not.
  Implement completion is a checked submission to Verify, not verified conformance. Bind an optional earlier finite work cutoff and preserve the declared capacity for independent Verify and observed stop/cleanup; expiry cancels unfinished work as Incomplete without skipping work or review, extending limits or publishing.
  Reviewers actively seek model-permitted counterexamples to material claims and assess public boundaries and interactions; accepting Managers challenge the actual assertions and evidence of their children rather than their success labels.
  Bind each executed behavioral observation used to accept conformance to a tool-produced receipt of the claim and expectation, exact candidate and probe bytes, permitted execution profile, actual invocation, outcome and observed stop; source-only observations identify the captured source and reasoning, and neither kind proves exhaustive coverage by its metadata.
  Retain adverse probe observations. Correct a demonstrated script setup error before candidate execution and rerun the relevant check under ordinary review and parent integration, without another whole Verify solely to disprove the broken script or a new error-classification workflow. Genuine product findings, ambiguous hangs and uncertain execution remain unresolved until adequately assessed; mandatory-check failures cannot be waived or hidden by relabeling.
  An unsupported success claim or a concrete unresolved question affecting a required obligation cannot yield clean Verify; do not invent defects or optional changes to satisfy a finding quota.
  Declare only actual dependencies on accepted contracts, decisions or results; preserve version binding, affected-consumer invalidation and cycle rejection. No implicit universal parent-basis edge or Verify preapproval is introduced. Unchanged idle waiting starts no Agent Turn; technical continuation, check timing and bounded cessation belong to the runtime rather than prompt-level scheduling recipes.
  Route corrections through the earliest necessary normal work Pass of the bound strategy, Implement in direct, followed by a complete fresh Verify; clean means no open genuine finding and passing required checks.
  Success requires clean Verify and an applied or no-change publication with exact read-back of the verified bytes; definite rejections fail, and unfinished work, exhausted limits, unresolved waits or uncertainty stay visibly incomplete with their evidence.
  The Agent leaves a concise final assessment of status, findings and open points rather than making a separate report-tool call. Expose only actual execution, communication, wait and necessary coordination actions. Missing or ambiguous semantic content stays unresolved with one targeted finite correction, without a repeated missing-report loop. Host-derived execution facts remain distinct from semantic judgments; claimed tests create no execution receipt.
  Keep execution semantics independent of SQL, provider protocols and repository acquisition.
