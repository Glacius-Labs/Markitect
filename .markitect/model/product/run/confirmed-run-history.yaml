imports:
  - package: vocabulary
    as: Vocab
id: confirmed-run-history
kind: Vocab.Rule
body: >-
  Every Assessment, Implement and Verify executes the complete model-derived Manager hierarchy, including Root, intermediate and empty Packages, in fresh Run environments. Project intent and its complete input inventory remain fixed; an invalid or incompletely acquired input starts no Manager work.
  Before ordinary work, open one fresh environment and working copy per Manager and one Git Workspace Service for the Run. Run has no domain Passes or Turns. Every Manager receives its own selected context, mandate, bound candidate, concrete findings and direct tools. Managers delegate to their direct children, remain available for questions, inspect complete fixed child diffs, review exact commits and integrate accepted work upward through actual Git history. In Implement every submitted child candidate is fixed and reaches its parent with its deterministic check result, also when the check fails; an invalid candidate cannot be approved or integrated; invalidity refers to the checks that apply to the fixed child state, and integration still outstanding elsewhere is not invalidity. A child can run the same check on its current copy before submitting.
  Questions and replies remain inside the Run and follow the tree: a Manager asks only its direct parent or a direct child, sibling coordination goes through the common parent and cross-level coordination step by step through the Managers in between. Correlate actual incoming questions and answers, support crossed waits and keep completed Managers reachable in their same ordinary conversation. No question crosses Root to the invoking AI or owner. Required late findings invalidate affected acceptance; an answer alone does not change an already fixed Git handoff.
  A judgment belongs to the assignment and the assessed state, not to a message. Parent rejection or correction, new mandatory findings, a late adverse child finding or a change of the assessed state invalidate it; a message that only handles questions or answers does not, also before the first judgment. The end of a provider response is not a completion attempt, and Run does not demand a judgment merely because a response ended; completion validity is checked when the Manager judges and before Run relies on an earlier judgment (Root completion). The host keeps an explicit assignment state per Manager and states the concrete reason when a completion is not valid. Harness text and messages carry role, rules, context, task and answer format, not host process states.
  Correction stays with the responsible Manager and uses concrete findings and the actual integrated parent baseline. Parent integration never subtracts previously accepted child paths from the complete diff. Actual delegation bases, fixed results, parent before/after commits, accepted child commits and judgments survive closure.
  Implement submits a structurally checked candidate and required scoped check results; it cannot approve publication. Assessment and Verify judge the immutable input independently in fresh Runs, and scratch edits never become product. Root checks the complete declared suite on the final fixed candidate. Required check failures cannot be waived by a semantic approval; actual startup, acquisition or observation failures remain technical failures.
  Managers assess material conditions, exceptions, interfaces and composed workflows from the bound model, challenging the actual work and evidence of their children. Green totals and provider completion do not establish semantic completeness. Reject and model blocker require concrete findings; no finding quota or custom evidence-mapping protocol is required.
  One finite outer deadline and message allowance bound the invocation, including correction Runs; Manager count is explicitly bounded before environments start. Exhausted capacity, cancellation, incomplete observations or uncertain closure never become success. Cleanup and persistence have separate finite bounds and grant no further productive work.
  Candidates retain their exact commit, tree and complete ancestry in self-contained Git storage. Verify independent reopening before exposing the stored reference. Mandatory terminal results include the exact input reference, binding, technical and semantic outcomes, findings, handoffs, checks and actual cleanup observations. Return no live resource handle and confirm terminal storage by read-back after resource closure.
  Shared project Notes persist across Runs, retain their originating Run, Manager and context and preserve concurrent appends. Managers read them in bounded, stably ordered pages within the tool transport limit, without silent truncation. They are operational memory, not authority, assignments or model decisions.
  Assessment approves model readiness, including an unrealized or outdated product; it validates fixed structural inputs without requiring already-passing realization commands. Assessment Approve always enables a complete Implement, even when its complete captured Census remains unchanged. Assessment Reject or a model blocker stops without publication. Verify judges the exact fixed realization; its Reject carries mandatory Findings and the exact candidate into fresh Implement and Verify Runs under the original allowance. Apply alone composes Assessment, Implement, fresh Verify and bounded corrections and publishes only the exact stored acceptance after every Run resource has closed and target bytes have been read back. Standalone Run completion is not Apply, publication, provider qualification, release or owner acceptance.
