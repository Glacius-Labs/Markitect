apiVersion: project.markitect.example.org/v1alpha1
kind: Artifact
metadata:
  name: foundation-layer
  namespace: product
purpose: Maps the pure Apply foundation to its reserved package paths.
spec:
  role: implementation
  realizes:
    - namespace: product
      name: product
    - namespace: product
      name: core-stays-generic
    - namespace: product
      name: explicit-relationships
    - namespace: product
      name: legacy-removal
    - namespace: ""
      name: canonical-sources
    - namespace: ""
      name: project-local-policy
    - namespace: product
      name: declared-inputs
  paths:
    - internal/model/
    - internal/snapshot/
    - internal/organization/
    - internal/realization/
  checks:
    - namespace: ""
      name: go-tests
    - namespace: ""
      name: go-vet
    - namespace: tooling
      name: architecture-gate
  required: false
  reason: These pure foundation paths own actual files as packages arrive; empty reserved paths do not require producer stubs before cutover.
