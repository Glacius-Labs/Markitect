imports:
  - package: vocabulary
    as: Vocab
id: honest-read-only-interface
kind: Vocab.Rule
body: "Expose check and context over actual PreparationService reports, with structural preparation as the default requested stage and explicitly selected Orchestrator metadata as an additional stage. Preserve actual statuses, sources and inclusion reasons. Apply acts only with an explicit Runtime profile and run configuration and reports actual preparation, assignment commits and messages, assessment/reviews/checks and cleanup observations, publication, outcome and retained evidence. A Run is closed: the command line offers no way to answer a question of a run or to preload an owner decision, and a run configuration with an unknown key, ownerDecisions included, is refused. Usage, known failure and incomplete work have distinct exit statuses."
spec: {}
