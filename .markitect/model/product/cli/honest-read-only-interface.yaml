imports:
  - package: vocabulary
    as: Vocab
id: honest-read-only-interface
kind: Vocab.Rule
body: "Expose check and context over actual Project preparation, with structural preparation as the default requested stage and explicitly selected runtime metadata as an additional stage. Preserve actual statuses, sources and inclusion reasons. The generated model view has its own source/target-bound guarded write. Apply binds committed inputs and an isolated non-protected target branch before Manager work, uses complete fresh Assessment, Implement and Verify Runs with one shared finite allowance and publishes only independently reopened stored Verify approval after every Run resource closes. A Run is closed: the command line offers no answer command or preloaded owner decision. Invocation configuration is closed and requires explicit finite limits and normal account credential sources. Report actual technical and semantic results, cleanup, completed publication paths and readback; retained reports and printed JSON use the same final projection. Usage, known failure and incomplete work have distinct exit statuses. Source composition, native provider qualification and owner acceptance remain separate claims."
spec: {}
