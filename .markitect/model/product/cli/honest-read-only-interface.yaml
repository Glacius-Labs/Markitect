imports:
  - package: vocabulary
    as: Vocab
id: honest-read-only-interface
kind: Vocab.Rule
body: "Expose check and context over actual Project preparation, with structural preparation as the default requested stage and explicitly selected runtime metadata as an additional stage. Preserve actual statuses, sources and inclusion reasons. The generated model view has its own source/target-bound guarded write. At the S2 boundary Apply explicitly reports unavailable until the S3 workflow and publication are integrated; it starts no Run or resource. A Run is closed: the command line offers no answer command or preloaded owner decision. Invocation configuration is closed and requires explicit finite limits and normal account credential sources. Usage, known failure and incomplete work have distinct exit statuses."
spec: {}
