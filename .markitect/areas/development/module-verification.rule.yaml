apiVersion: markitect.example.org/v1alpha1
kind: Rule
metadata:
    name: module-verification
    namespace: development
spec:
    text: |
        Keep Git hook and pipeline verification explicit and read-only. The configured pre-commit entrypoint is a tracked artifact; this Project does not install it or change Git hook settings. Pipeline assertions compare only the configured YAML scalar with the literal space-joined Project argv, not shell or provider execution semantics.
    files:
        - .markitect/modules/githooks.config
        - .markitect/modules/pipelines.config
        - .githooks/pre-commit
        - .github/workflows/ci.yaml
