apiVersion: markitect.example.org/v1alpha1
kind: Skill
metadata:
    name: engineering-change
    namespace: development
spec:
    text: |
        Follow the canonical Markitect-first Change workflow for each task in this repository. Use `go run ./src/cmd/markitect` while developing the candidate; an installed release is a different input. Resolve BASE to the full immutable source commit before compiling context. Begin with `go run ./src/cmd/markitect check --repo . --revision BASE` and `go run ./src/cmd/markitect context --repo . --revision BASE --namespace development --kind Skill --name engineering-change`.

        Classify the task before implementation. Representation repairs use unchanged desired state and do not require invented model edits. Every governed change starts from Markitect; intent changes re-plan before materialization. Engineering-intent changes update the canonical owner before the implementation and compare the committed intent candidate to BASE with impact. Ordinary failed policies may be inspected only through explicit read-only analysis; structural failures remain blockers.

        The managed scope is deliberately narrower than the entire repository. `markitect-artifacts.yaml` owns that scope. New files inside it must be canonical sources, declared inputs, generated outputs, explicitly declared projected representations, tool/vendor-owned or exactly excluded with a reason. Run the standalone artifact check against the working tree to catch newly created files, then run the configured check through fixed-revision verify. Files outside the managed roots still require ordinary review and the contribution gates.

        Generated Markdown, Codex and Claude files are deterministic projections. AI-materialized representations are separate candidates with declared freedom and project-owned verification; file ownership or a green agent-authored test is not complete semantic proof. Intent changes update their canonical owner and re-plan; unchanged-intent repairs leave that owner unchanged. Regenerate deterministic outputs through render or reviewed projection Apply; write AI targets only through a complete digest-bound candidate. Commit the candidate, then check/impact/verify that exact revision. Do not claim passing fixed verification for uncommitted changes. Publication and adopter mutation need destination-specific authority.
    description: Begin Markitect repository changes from fixed engineering context and finish with accounted artifacts and verification.
    rules:
        - name: repository-boundaries
        - name: module-verification
    uses:
        - kind: Workflow
          name: markitect-first-change
          namespace: core
