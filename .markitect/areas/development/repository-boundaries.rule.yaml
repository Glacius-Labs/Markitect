apiVersion: markitect.example.org/v1alpha1
kind: Rule
metadata:
    name: repository-boundaries
    namespace: development
spec:
    text: |
        Keep Markitect Core independent of adopting repositories and model providers. Project artifacts remain opaque declared bytes; specialized checks/adapters own implementation-specific interpretation. Relationships and input scope are explicit, fixed-snapshot results are deterministic, unknown impact stays conservative, and generated projections have one canonical owner.

        Preserve strict check/verify acceptance, read-only failed-policy analysis, explicit exceptions and observe/plan/apply/verify trust boundaries. Desired, observed, inferred, candidate and generated state remain distinct. AI evidence is not owner acceptance. Follow the declared contribution checks; a source change does not update a published immutable release. The architecture and engineering-constitution documents retain technical contract ownership; this rule routes their exact bytes into development context.
    files:
        - docs/architecture.md
        - docs/engineering-constitution.md
        - CONTRIBUTING.md
