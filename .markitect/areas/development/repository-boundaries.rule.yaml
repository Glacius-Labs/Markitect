apiVersion: markitect.example.org/v1alpha1
kind: Rule
metadata:
    name: repository-boundaries
    namespace: development
spec:
    text: |
        - Core stays generic. It does not depend on Modules, Host, CLI, adopting repositories or model providers. A capability Module imports only Core and its own subtree. Host composes; CLI entrypoints delegate to Host. The import gate in `src/internal/tooling/architecture` enforces these directions; do not add exceptions to it.
        - Product packages do not import legacy packages: the host root package, `compat/v0_13`, the canonical projection alpha and their helpers. Change the legacy lines only to remove them. Compatibility is not a reason to keep a function, mode or fallback (DEC-014).
        - Adopting-project files are declared inputs. Markitect may track their exact paths and bytes but does not infer their structure or meaning; specialized checks and adapters own that interpretation.
        - Relationships and input scope are explicit. Do not infer dependencies from prose, README links or paths. Fixed-snapshot results are deterministic, unknown impact stays conservative, and every generated output has one canonical owner.
        - Typed YAML is the canonical model; generated Markdown, Codex and Claude files are its views. Change the canonical source and regenerate the views; do not edit generated files.
        - Keep desired, observed, inferred, candidate and generated state distinct. Keep preview before write, digest-bound writes, stale-plan rejection, independent review and guarded Apply.
        - AI evidence, passing checks and digests are not human acceptance. Agent settings and owned workspaces are not an operating-system sandbox.
        - Keep project-local policy in the project that owns it unless a deliberate product decision makes it a general rule. Changes to an adopting project belong in its checkout and follow its instructions.
        - A source change does not update a published release. Published releases, pins and original evidence stay immutable records.
    files:
        - docs/architecture.md
        - CONTRIBUTING.md
        - docs/design/clean-architecture-consolidation.md
        - docs/design/managed-artifact-coverage.md
