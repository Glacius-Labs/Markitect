# Proposed author format. Names and topic patterns are synthetic design examples.
# These are intended-project definitions, not live messages, tenants or processes.
apiVersion: connector.example.org/v1alpha1
kind: System
metadata: {namespace: connector, name: platform}
definition: >-
  Die Connector-Plattform macht ausgewaehlte Funktionen lokaler Systeme ueber
  eine gemeinsame Cloud-API verfuegbar. Die API und der Connector sind getrennte
  Anwendungen. Der Kunde benoetigt fuer die MQTT-Verbindung keinen eingehenden
  Listener am Connector. Zunaechst wird das Auflisten von DMS-Dokumenten beschrieben.
spec:
  containers:
    - {namespace: connector, name: api}
    - {namespace: connector, name: onprem}
  exchanges:
    - {namespace: connector, name: list-documents}
---
apiVersion: connector.example.org/v1alpha1
kind: System
metadata: {namespace: connector, name: dms}
definition: >-
  Eigenstaendige Dokumentenverwaltung in der Kundenumgebung. Ihre angebotene
  Lesefunktion und ihre lokalen Zugriffsregeln sind die Integrationsgrenze.
  Ihre interne Architektur wird durch dieses Projekt nicht festgelegt.
spec:
  provides:
    - {namespace: connector, name: dms-access}
---
apiVersion: connector.example.org/v1alpha1
kind: Container
metadata: {namespace: connector, name: api}
definition: >-
  Die Cloud-Anwendung stellt den HTTP-Zugang bereit, bestimmt den Mandanten aus
  dem authentifizierten Kontext und wartet auf das Resultat des Auftrags. Ihre
  Prozessinstanzen besitzen unterschiedliche Antwortadressen. Ein Neustart
  uebernimmt in diesem kleinen Entwurf keinen vorherigen Wartezustand.
spec:
  location: cloud
  components:
    - {namespace: connector, name: http-edge}
---
apiVersion: connector.example.org/v1alpha1
kind: Container
metadata: {namespace: connector, name: onprem}
definition: >-
  Die Anwendung in der Kundenumgebung baut ihre MQTT-Verbindung ausgehend auf.
  Sie verarbeitet nur fuer ihre autorisierte Umgebung bestimmte Auftraege.
  Ihre Kommunikation mit DMS findet innerhalb der Kundenumgebung statt.
spec:
  location: onprem
  components:
    - {namespace: connector, name: dms-handler}
---
apiVersion: connector.example.org/v1alpha1
kind: Component
metadata: {namespace: connector, name: http-edge}
definition: >-
  Der HTTP-Endpunkt bildet einen gueltigen Request auf den beschriebenen
  Dokumentlisten-Command ab und das Resultat wieder auf eine HTTP-Response.
  Eine frei gesetzte Mandantenangabe ersetzt nicht den authentifizierten Kontext.
spec:
  provides:
    - {namespace: connector, name: public-api}
  emits:
    - {namespace: connector, name: list-documents-command}
---
apiVersion: connector.example.org/v1alpha1
kind: Component
metadata: {namespace: connector, name: dms-handler}
definition: >-
  Die Auftragsbearbeitung liest die Dokumentmetadaten des gewaehlten Ordners
  ueber den DMS-Vertrag. Sie erhaelt die geltenden lokalen Benutzerberechtigungen
  und erzeugt das beschriebene Resultat oder einen fachlichen Fehler.
spec:
  consumes:
    - {namespace: connector, name: dms-access}
  handles:
    - {namespace: connector, name: list-documents-command}
---
apiVersion: connector.example.org/v1alpha1
kind: Interface
metadata: {namespace: connector, name: public-api}
definition: >-
  POST /v1/dms/documents/list akzeptiert einen Ordnerbezug und optionale
  Seitengroesse und Fortsetzungsinformation. Der Aufrufer muss authentifiziert
  und zum Lesen im gewaehlten Mandanten berechtigt sein. Erfolg liefert
  Dokumentmetadaten und gegebenenfalls eine Fortsetzungsinformation.
  Ungueltige Eingaben werden als HTTP 400, fehlende Berechtigung als 403,
  ausbleibende Antwort als 504 und ein technischer Fehler als 502 beschrieben.
spec: {}
---
apiVersion: connector.example.org/v1alpha1
kind: Interface
metadata: {namespace: connector, name: dms-access}
definition: >-
  Der DMS-Zugriff liefert die Metadaten der fuer den Benutzer lesbaren Dokumente
  eines Ordners. Ein fehlender Zugriff wird als fachlicher Fehler gemeldet.
  Die gewuenschte Pagination des Cloud-Vertrags muss auf die angebotenen
  DMS-Funktionen abgebildet werden; konkrete SDK- oder Dateinamen sind offen.
spec: {}
---
apiVersion: connector.example.org/v1alpha1
kind: MqttService
metadata: {namespace: connector, name: messaging}
definition: >-
  Ein eigener MQTT-Dienst ist aus Cloud und Kundenumgebung erreichbar. Seine
  Laufzeit ist von API und On-Premise-Connector getrennt. Zugriffsvorgaben
  begrenzen Publikation und Abonnements auf die autorisierten Adressen.
  Die konkrete Brokerimplementierung und Bereitstellung bleiben offen.
spec: {}
---
apiVersion: connector.example.org/v1alpha1
kind: Channel
metadata: {namespace: connector, name: requests}
definition: >-
  tenantId wird aus der autorisierten Zielumgebung eingesetzt. Die Adresse
  bestimmt wohin ein Auftrag gelangt; die Operation steht im Command-Vertrag
  beziehungsweise in der Nachrichtenhuelle. Connector-Replikas abonnieren die
  Zieladresse ueber eine gemeinsame Shared Subscription. Jeder moegliche
  Empfaenger dieses Pools muss die in diesem Entwurf verteilte Operation beherrschen.
spec:
  topicPattern: bridge/{tenantId}/requests
  delivery: at-least-once
  broker: {namespace: connector, name: messaging}
---
apiVersion: connector.example.org/v1alpha1
kind: Channel
metadata: {namespace: connector, name: replies}
definition: >-
  senderInstanceId bezeichnet die ausstellende API-Prozessinstanz. Der Sender
  uebergibt die konkrete Antwortadresse im Auftrag. Antworten werden an diese
  Adresse geschickt und innerhalb der Instanz ueber die MessageId zugeordnet.
  Fuer diese Antwortadresse wird keine konkurrierende Shared Subscription verwendet.
spec:
  topicPattern: bridge/replies/{senderInstanceId}
  delivery: at-least-once
  broker: {namespace: connector, name: messaging}
---
apiVersion: connector.example.org/v1alpha1
kind: Command
metadata: {namespace: connector, name: list-documents-command}
definition: >-
  Der Auftrag fordert die fuer den Benutzer lesbaren Dokumentmetadaten eines
  Ordners an. Eingaben sind FolderId, optionale PageSize und ContinuationToken.
  Das Resultat enthaelt Dokumentmetadaten und gegebenenfalls NextContinuationToken
  oder einen beschriebenen fachlichen Fehler. Der Auftrag veraendert keine
  Dokumente. Konkrete Commands erhalten ihre Laufzeitdaten erst bei der Ausfuehrung.
spec:
  operationId: dms.documents.list.v1
---
apiVersion: connector.example.org/v1alpha1
kind: Exchange
metadata: {namespace: connector, name: list-documents}
definition: >-
  Die API bestimmt den autorisierten Mandanten, bildet den Command und
  registriert den wartenden Austausch vor der Publikation. Der Connector waehlt
  anhand der Operationskennung die Auftragsbearbeitung. Der Transporterfolg und
  der fachliche Resultstatus werden unterschieden. Wiederholungen verwenden
  dieselbe MessageId; spaete Antworten ohne Wartezustand werden verworfen.
  Dieser lesende Durchstich verlangt keine globale Exactly-once-Garantie.
  Bei schreibenden Operationen ist die erlaubte Wiederholungswirkung gesondert
  zu entscheiden. Die Versuchszahl ist ein endliches Budget; ein Timeout
  beweist keine Nichtausfuehrung. Eine Gesamtfrist und Retry-Verzoegerung sind
  in dieser minimalen Instanz noch offen.
spec:
  sender: {namespace: connector, name: api}
  receiver: {namespace: connector, name: onprem}
  command: {namespace: connector, name: list-documents-command}
  requestChannel: {namespace: connector, name: requests}
  replyChannel: {namespace: connector, name: replies}
  timeoutSeconds: 30
  maxAttempts: 2
