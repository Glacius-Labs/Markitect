# Design fixture: fixed core/v1 seed; not a supported product input.
id: core/v1/Kind
kind: core/v1/Kind
body: Deklariert einen Typ. properties benennt die erlaubten Angaben seiner Definitionen.
  Der body einer solchen Typdefinition erklaert deren gemeinsame Bedeutung.
spec:
  properties:
  - core/v1/Kind/properties
---
id: core/v1/Property
kind: core/v1/Kind
body: Deklariert eine benannte Property mit Werttyp, Kardinalitaet und gegebenenfalls
  Zieltyp, Enumwerten oder Objektfeldern. Ihr body erklaert die Bedeutung der Werte.
spec:
  properties:
  - core/v1/Property/name
  - core/v1/Property/type
  - core/v1/Property/minCount
  - core/v1/Property/maxCount
  - core/v1/Property/values
  - core/v1/Property/target
  - core/v1/Property/properties
---
id: core/v1/Kind/properties
kind: core/v1/Property
body: Die Propertyvertraege dieses Kinds; ihre Namen muessen innerhalb dieses Kinds
  eindeutig sein.
spec:
  name: properties
  type: reference
  minCount: 0
  maxCount: -1
  target: core/v1/Property
---
id: core/v1/Property/name
kind: core/v1/Property
body: Der nichtleere Wertschluessel dieser Property in einer konkreten spec.
spec:
  name: name
  type: string
  minCount: 1
  maxCount: 1
---
id: core/v1/Property/type
kind: core/v1/Property
body: Der vom Core verstandene Werttyp.
spec:
  name: type
  type: enum
  minCount: 1
  maxCount: 1
  values:
  - string
  - boolean
  - integer
  - number
  - enum
  - object
  - reference
---
id: core/v1/Property/minCount
kind: core/v1/Property
body: Nichtnegative Mindestanzahl von Werten.
spec:
  name: minCount
  type: integer
  minCount: 1
  maxCount: 1
---
id: core/v1/Property/maxCount
kind: core/v1/Property
body: Hoechstanzahl von Werten; -1 bedeutet unbegrenzt innerhalb der Werkzeuggrenzen.
  Genau 1 bezeichnet einen Einzelwert, andere Werte eine Liste.
spec:
  name: maxCount
  type: integer
  minCount: 1
  maxCount: 1
---
id: core/v1/Property/values
kind: core/v1/Property
body: 'Nur bei enum: nichtleere Liste eindeutiger erlaubter Stringwerte.'
spec:
  name: values
  type: string
  minCount: 0
  maxCount: -1
---
id: core/v1/Property/target
kind: core/v1/Property
body: 'Nur bei reference erforderlich: exakt referenzierter Ziel-Kind.'
spec:
  name: target
  type: reference
  minCount: 0
  maxCount: 1
  target: core/v1/Kind
---
id: core/v1/Property/properties
kind: core/v1/Property
body: 'Nur bei object: Vertraege seiner geschlossenen Objektfelder.'
spec:
  name: properties
  type: reference
  minCount: 0
  maxCount: -1
  target: core/v1/Property
