# Design fixture: explicit IDs and body; not a supported product input.
# Fresh representation of the eight kinds and thirteen elements in the earlier example.
id: connector/v1/System/containers
kind: core/v1/Property
body: Die Laufzeitanwendungen, die zur beschriebenen Loesung gehoeren.
spec:
  name: containers
  type: reference
  minCount: 0
  maxCount: -1
  target: connector/v1/Container
---
id: connector/v1/System/exchanges
kind: core/v1/Property
body: Die Kommunikationsvertraege, welche die Loesung festlegt.
spec:
  name: exchanges
  type: reference
  minCount: 0
  maxCount: -1
  target: connector/v1/Exchange
---
id: connector/v1/System/provides
kind: core/v1/Property
body: Die an der Systemgrenze angebotenen Vertraege.
spec:
  name: provides
  type: reference
  minCount: 0
  maxCount: -1
  target: connector/v1/Interface
---
id: connector/v1/System
kind: core/v1/Kind
body: Beschreibt eine zusammengehoerige Softwareloesung, ihren Zweck und ihre Grenze
  zur Umgebung. containers benennt Anwendungen dieser Loesung. exchanges ordnet ihr
  beschriebene Kommunikationsvertraege zu. Ein extern verwendetes System darf ohne
  seine interne Architektur beschrieben sein.
spec:
  properties:
  - connector/v1/System/containers
  - connector/v1/System/exchanges
  - connector/v1/System/provides
---
id: connector/v1/Container/location
kind: core/v1/Property
body: Die im Beispiel vorgesehene Umgebung dieser Anwendung.
spec:
  name: location
  type: enum
  values:
  - cloud
  - onprem
  minCount: 1
  maxCount: 1
---
id: connector/v1/Container/components
kind: core/v1/Property
body: Die innerhalb dieser Anwendung zu realisierenden Funktionseinheiten.
spec:
  name: components
  type: reference
  minCount: 0
  maxCount: -1
  target: connector/v1/Component
---
id: connector/v1/Container
kind: core/v1/Kind
body: Beschreibt eine Anwendung mit eigener Laufzeitgrenze. components benennt ihre
  funktionalen Teile. Dies ist eine Sollbeschreibung und keine konkrete laufende Prozessinstanz.
  Die vollstaendige Infrastrukturmodellierung ist nicht Gegenstand dieses kleinen
  Durchstichs.
spec:
  properties:
  - connector/v1/Container/location
  - connector/v1/Container/components
---
id: connector/v1/Component/provides
kind: core/v1/Property
body: Von diesem Baustein angebotene Vertraege.
spec:
  name: provides
  type: reference
  minCount: 0
  maxCount: -1
  target: connector/v1/Interface
---
id: connector/v1/Component/consumes
kind: core/v1/Property
body: Von diesem Baustein benoetigte Vertraege.
spec:
  name: consumes
  type: reference
  minCount: 0
  maxCount: -1
  target: connector/v1/Interface
---
id: connector/v1/Component/emits
kind: core/v1/Property
body: Die Operationsauftraege, die dieser Baustein aus externen Eingaben bildet.
spec:
  name: emits
  type: reference
  minCount: 0
  maxCount: -1
  target: connector/v1/Command
---
id: connector/v1/Component/handles
kind: core/v1/Property
body: Die Operationsauftraege, deren fachliche Ausfuehrung dieser Baustein uebernimmt.
spec:
  name: handles
  type: reference
  minCount: 0
  maxCount: -1
  target: connector/v1/Command
---
id: connector/v1/Component
kind: core/v1/Kind
body: Beschreibt eine funktionale Verantwortung innerhalb einer Anwendung und die
  Vertraege, die sie bereitstellt oder verwendet. Sie legt keine eigene Prozess-,
  Quellcodedatei- oder Paketgrenze fest. emits benennt die von ihr erzeugten Operationsauftraege;
  handles benennt die von ihr ausgefuehrten.
spec:
  properties:
  - connector/v1/Component/provides
  - connector/v1/Component/consumes
  - connector/v1/Component/emits
  - connector/v1/Component/handles
---
id: connector/v1/Interface
kind: core/v1/Kind
body: Beschreibt einen Vertrag der Zusammenarbeit mit angebotenen Operationen, benoetigten
  Eingaben, Ergebnissen und Fehlern. Die Definition darf sowohl den aeusseren Zugang
  als auch einen internen Integrationsvertrag ausdruecken.
spec:
  properties: []
---
id: connector/v1/MqttService
kind: core/v1/Kind
body: Beschreibt die benoetigte MQTT-Laufzeitinfrastruktur. Sie vermittelt nach Topics
  und Abonnements und interpretiert keine fachliche Command-Bedeutung. Ihre Bereitstellung
  ist von den logischen Channel-Vertraegen zu unterscheiden. Dieser projektspezifische
  Typ behauptet keine neue C4-Abstraktion.
spec:
  properties: []
---
id: connector/v1/Channel/topicPattern
kind: core/v1/Property
body: Die in diesem Projekt geltende Adressschablone mit erklaerten Parametern.
spec:
  name: topicPattern
  type: string
  minCount: 1
  maxCount: 1
---
id: connector/v1/Channel/delivery
kind: core/v1/Property
body: Gewuenschte Zustellsemantik des Nachrichtentransports.
spec:
  name: delivery
  type: enum
  values:
  - at-most-once
  - at-least-once
  minCount: 1
  maxCount: 1
---
id: connector/v1/Channel/broker
kind: core/v1/Property
body: Der MQTT-Dienst, ueber den diese Channel-Familie verfuegbar ist.
spec:
  name: broker
  type: reference
  minCount: 1
  maxCount: 1
  target: connector/v1/MqttService
---
id: connector/v1/Channel
kind: core/v1/Kind
body: Beschreibt eine parametrisierte Familie logischer MQTT-Adressen. topicPattern
  bindet Platzhalter an die im Koerper erklaerten Laufzeitwerte; es ist kein vom Core
  auszufuehrendes Programm. broker benennt den benoetigten MQTT-Dienst. delivery beschreibt
  die gewuenschte Transportzustellung, nicht die Zahl der fachlichen Ausfuehrungen.
  In diesem Beispiel sind die Platzhalter tenantId und senderInstanceId zulaessig
  und ihre Werte duerfen keine Topicseparatoren oder Wildcards enthalten. Der Koerper
  legt fest, welche Werte erforderlich sind.
spec:
  properties:
  - connector/v1/Channel/topicPattern
  - connector/v1/Channel/delivery
  - connector/v1/Channel/broker
---
id: connector/v1/Command/operationId
kind: core/v1/Property
body: Stabile Kennung der versionierten Operation.
spec:
  name: operationId
  type: string
  minCount: 1
  maxCount: 1
---
id: connector/v1/Command
kind: core/v1/Kind
body: Beschreibt eine versionierte Operationsanforderung, deren Eingaben und erwartetes
  Resultat. Die Definition ist der Vertrag eines Auftragstyps; konkrete versendete
  Commands sind Laufzeitdaten. operationId ist die eindeutige Operationskennung in
  diesem Projekt. Der Koerper beschreibt Eingaben, Ergebnisse und fachliche Fehler.
spec:
  properties:
  - connector/v1/Command/operationId
---
id: connector/v1/Exchange/sender
kind: core/v1/Property
body: Anwendung in der Rolle des ausstellenden Auftraggebers.
spec:
  name: sender
  type: reference
  minCount: 1
  maxCount: 1
  target: connector/v1/Container
---
id: connector/v1/Exchange/receiver
kind: core/v1/Property
body: Anwendung in der Rolle des empfangenden Auftragsbearbeiters.
spec:
  name: receiver
  type: reference
  minCount: 1
  maxCount: 1
  target: connector/v1/Container
---
id: connector/v1/Exchange/command
kind: core/v1/Property
body: Operationsvertrag des ueber diesen Austausch ausgefuehrten Commands.
spec:
  name: command
  type: reference
  minCount: 1
  maxCount: 1
  target: connector/v1/Command
---
id: connector/v1/Exchange/requestChannel
kind: core/v1/Property
body: Kanal fuer Auftraege vom Sender zum Empfaenger.
spec:
  name: requestChannel
  type: reference
  minCount: 1
  maxCount: 1
  target: connector/v1/Channel
---
id: connector/v1/Exchange/replyChannel
kind: core/v1/Property
body: Kanal fuer Antworten an die ausstellende Senderinstanz.
spec:
  name: replyChannel
  type: reference
  minCount: 1
  maxCount: 1
  target: connector/v1/Channel
---
id: connector/v1/Exchange/timeoutSeconds
kind: core/v1/Property
body: Positive maximale Wartezeit eines einzelnen Versuchs in Sekunden.
spec:
  name: timeoutSeconds
  type: integer
  minCount: 1
  maxCount: 1
---
id: connector/v1/Exchange/maxAttempts
kind: core/v1/Property
body: Positive maximale Versuchszahl einschliesslich des ersten Versuchs.
spec:
  name: maxAttempts
  type: integer
  minCount: 1
  maxCount: 1
---
id: connector/v1/Exchange
kind: core/v1/Kind
body: Beschreibt den Request-/Reply-Vertrag einer Operation zwischen sender und receiver.
  Der Sender veroeffentlicht den Command auf requestChannel und abonniert seine instanzbezogene
  Antwortadresse auf replyChannel. Der Empfaenger verarbeitet Requests und veroeffentlicht
  das Resultat an die mitgesendete Antwortadresse. Antworten behalten die MessageId
  des Requests; MessageId ordnet sie dem wartenden Austausch zu. CorrelationId dient
  der uebergreifenden Nachverfolgung. Der Koerper legt Fehler, Wiederholungswirkung
  und Abbruchgrenzen fest. timeoutSeconds gilt pro Versuch und maxAttempts zaehlt
  den ersten Versuch mit. Positive Werte sind eine semantische Verpflichtung dieses
  Typs; eine allgemeine Integer-Property erzwingt diese Bereichsregel noch nicht.
  Das Objekt beschreibt den Vertrag, keinen einzelnen laufenden Nachrichtenaustausch.
spec:
  properties:
  - connector/v1/Exchange/sender
  - connector/v1/Exchange/receiver
  - connector/v1/Exchange/command
  - connector/v1/Exchange/requestChannel
  - connector/v1/Exchange/replyChannel
  - connector/v1/Exchange/timeoutSeconds
  - connector/v1/Exchange/maxAttempts
---
id: project/v1/platform
kind: connector/v1/System
body: Die Connector-Plattform macht ausgewaehlte Funktionen lokaler Systeme ueber
  eine gemeinsame Cloud-API verfuegbar. Die API und der Connector sind getrennte Anwendungen.
  Der Kunde benoetigt fuer die MQTT-Verbindung keinen eingehenden Listener am Connector.
  Zunaechst wird das Auflisten von DMS-Dokumenten beschrieben.
spec:
  containers:
  - project/v1/api
  - project/v1/onprem
  exchanges:
  - project/v1/list-documents
---
id: project/v1/dms
kind: connector/v1/System
body: Eigenstaendige Dokumentenverwaltung in der Kundenumgebung. Ihre angebotene Lesefunktion
  und ihre lokalen Zugriffsregeln sind die Integrationsgrenze. Ihre interne Architektur
  wird durch dieses Projekt nicht festgelegt.
spec:
  provides:
  - project/v1/dms-access
---
id: project/v1/api
kind: connector/v1/Container
body: Die Cloud-Anwendung stellt den HTTP-Zugang bereit, bestimmt den Mandanten aus
  dem authentifizierten Kontext und wartet auf das Resultat des Auftrags. Ihre Prozessinstanzen
  besitzen unterschiedliche Antwortadressen. Ein Neustart uebernimmt in diesem kleinen
  Entwurf keinen vorherigen Wartezustand.
spec:
  location: cloud
  components:
  - project/v1/http-edge
---
id: project/v1/onprem
kind: connector/v1/Container
body: Die Anwendung in der Kundenumgebung baut ihre MQTT-Verbindung ausgehend auf.
  Sie verarbeitet nur fuer ihre autorisierte Umgebung bestimmte Auftraege. Ihre Kommunikation
  mit DMS findet innerhalb der Kundenumgebung statt.
spec:
  location: onprem
  components:
  - project/v1/dms-handler
---
id: project/v1/http-edge
kind: connector/v1/Component
body: Der HTTP-Endpunkt bildet einen gueltigen Request auf den beschriebenen Dokumentlisten-Command
  ab und das Resultat wieder auf eine HTTP-Response. Eine frei gesetzte Mandantenangabe
  ersetzt nicht den authentifizierten Kontext.
spec:
  provides:
  - project/v1/public-api
  emits:
  - project/v1/list-documents-command
---
id: project/v1/dms-handler
kind: connector/v1/Component
body: Die Auftragsbearbeitung liest die Dokumentmetadaten des gewaehlten Ordners ueber
  den DMS-Vertrag. Sie erhaelt die geltenden lokalen Benutzerberechtigungen und erzeugt
  das beschriebene Resultat oder einen fachlichen Fehler.
spec:
  consumes:
  - project/v1/dms-access
  handles:
  - project/v1/list-documents-command
---
id: project/v1/public-api
kind: connector/v1/Interface
body: POST /v1/dms/documents/list akzeptiert einen Ordnerbezug und optionale Seitengroesse
  und Fortsetzungsinformation. Der Aufrufer muss authentifiziert und zum Lesen im
  gewaehlten Mandanten berechtigt sein. Erfolg liefert Dokumentmetadaten und gegebenenfalls
  eine Fortsetzungsinformation. Ungueltige Eingaben werden als HTTP 400, fehlende
  Berechtigung als 403, ausbleibende Antwort als 504 und ein technischer Fehler als
  502 beschrieben.
spec: {}
---
id: project/v1/dms-access
kind: connector/v1/Interface
body: Der DMS-Zugriff liefert die Metadaten der fuer den Benutzer lesbaren Dokumente
  eines Ordners. Ein fehlender Zugriff wird als fachlicher Fehler gemeldet. Die gewuenschte
  Pagination des Cloud-Vertrags muss auf die angebotenen DMS-Funktionen abgebildet
  werden; konkrete SDK- oder Dateinamen sind offen.
spec: {}
---
id: project/v1/messaging
kind: connector/v1/MqttService
body: Ein eigener MQTT-Dienst ist aus Cloud und Kundenumgebung erreichbar. Seine Laufzeit
  ist von API und On-Premise-Connector getrennt. Zugriffsvorgaben begrenzen Publikation
  und Abonnements auf die autorisierten Adressen. Die konkrete Brokerimplementierung
  und Bereitstellung bleiben offen.
spec: {}
---
id: project/v1/requests
kind: connector/v1/Channel
body: tenantId wird aus der autorisierten Zielumgebung eingesetzt. Die Adresse bestimmt
  wohin ein Auftrag gelangt; die Operation steht im Command-Vertrag beziehungsweise
  in der Nachrichtenhuelle. Connector-Replikas abonnieren die Zieladresse ueber eine
  gemeinsame Shared Subscription. Jeder moegliche Empfaenger dieses Pools muss die
  in diesem Entwurf verteilte Operation beherrschen.
spec:
  topicPattern: bridge/{tenantId}/requests
  delivery: at-least-once
  broker: project/v1/messaging
---
id: project/v1/replies
kind: connector/v1/Channel
body: senderInstanceId bezeichnet die ausstellende API-Prozessinstanz. Der Sender
  uebergibt die konkrete Antwortadresse im Auftrag. Antworten werden an diese Adresse
  geschickt und innerhalb der Instanz ueber die MessageId zugeordnet. Fuer diese Antwortadresse
  wird keine konkurrierende Shared Subscription verwendet.
spec:
  topicPattern: bridge/replies/{senderInstanceId}
  delivery: at-least-once
  broker: project/v1/messaging
---
id: project/v1/list-documents-command
kind: connector/v1/Command
body: Der Auftrag fordert die fuer den Benutzer lesbaren Dokumentmetadaten eines Ordners
  an. Eingaben sind FolderId, optionale PageSize und ContinuationToken. Das Resultat
  enthaelt Dokumentmetadaten und gegebenenfalls NextContinuationToken oder einen beschriebenen
  fachlichen Fehler. Der Auftrag veraendert keine Dokumente. Konkrete Commands erhalten
  ihre Laufzeitdaten erst bei der Ausfuehrung.
spec:
  operationId: dms.documents.list.v1
---
id: project/v1/list-documents
kind: connector/v1/Exchange
body: Die API bestimmt den autorisierten Mandanten, bildet den Command und registriert
  den wartenden Austausch vor der Publikation. Der Connector waehlt anhand der Operationskennung
  die Auftragsbearbeitung. Der Transporterfolg und der fachliche Resultstatus werden
  unterschieden. Wiederholungen verwenden dieselbe MessageId; spaete Antworten ohne
  Wartezustand werden verworfen. Dieser lesende Durchstich verlangt keine globale
  Exactly-once-Garantie. Bei schreibenden Operationen ist die erlaubte Wiederholungswirkung
  gesondert zu entscheiden. Die Versuchszahl ist ein endliches Budget; ein Timeout
  beweist keine Nichtausfuehrung. Eine Gesamtfrist und Retry-Verzoegerung sind in
  dieser minimalen Instanz noch offen.
spec:
  sender: project/v1/api
  receiver: project/v1/onprem
  command: project/v1/list-documents-command
  requestChannel: project/v1/requests
  replyChannel: project/v1/replies
  timeoutSeconds: 30
  maxAttempts: 2
