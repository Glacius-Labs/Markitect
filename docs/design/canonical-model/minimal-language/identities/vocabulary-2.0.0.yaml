# Synthetic design fixture; not supported by the current product loader.
package: example/connector-vocabulary
version: 2.0.0
imports:
  core:
    package: markitect/core
    version: 1.0.0
definitions:
- id: System
  kind: core:Kind
  body: Beschreibt eine zusammengehoerige Softwareloesung, ihren Zweck und ihre Grenze
    zur Umgebung. containers benennt Anwendungen dieser Loesung. exchanges ordnet
    ihr beschriebene Kommunikationsvertraege zu. Ein extern verwendetes System darf
    ohne seine interne Architektur beschrieben sein.
  spec:
    properties:
      containers:
        body: Die Laufzeitanwendungen, die zur beschriebenen Loesung gehoeren.
        type: reference
        minCount: 0
        maxCount: -1
        target: Container
      exchanges:
        body: Die Kommunikationsvertraege, welche die Loesung festlegt.
        type: reference
        minCount: 0
        maxCount: -1
        target: Exchange
      provides:
        body: Die an der Systemgrenze angebotenen Vertraege.
        type: reference
        minCount: 0
        maxCount: -1
        target: Interface
- id: Container
  kind: core:Kind
  body: Beschreibt eine Anwendung mit eigener Laufzeitgrenze. components benennt ihre
    funktionalen Teile. Dies ist eine Sollbeschreibung und keine konkrete laufende
    Prozessinstanz. Die vollstaendige Infrastrukturmodellierung ist nicht Gegenstand
    dieses kleinen Durchstichs.
  spec:
    properties:
      location:
        body: Die im Beispiel vorgesehene Umgebung dieser Anwendung.
        type: enum
        values:
        - cloud
        - onprem
        minCount: 1
        maxCount: 1
      components:
        body: Die innerhalb dieser Anwendung zu realisierenden Funktionseinheiten.
        type: reference
        minCount: 0
        maxCount: -1
        target: Component
- id: Component
  kind: core:Kind
  body: Beschreibt eine funktionale Verantwortung innerhalb einer Anwendung und die
    Vertraege, die sie bereitstellt oder verwendet. Sie legt keine eigene Prozess-,
    Quellcodedatei- oder Paketgrenze fest. emits benennt die von ihr erzeugten Operationsauftraege;
    handles benennt die von ihr ausgefuehrten.
  spec:
    properties:
      provides:
        body: Von diesem Baustein angebotene Vertraege.
        type: reference
        minCount: 0
        maxCount: -1
        target: Interface
      consumes:
        body: Von diesem Baustein benoetigte Vertraege.
        type: reference
        minCount: 0
        maxCount: -1
        target: Interface
      emits:
        body: Die Operationsauftraege, die dieser Baustein aus externen Eingaben bildet.
        type: reference
        minCount: 0
        maxCount: -1
        target: Command
      handles:
        body: Die Operationsauftraege, deren fachliche Ausfuehrung dieser Baustein
          uebernimmt.
        type: reference
        minCount: 0
        maxCount: -1
        target: Command
- id: Interface
  kind: core:Kind
  body: Beschreibt einen Vertrag der Zusammenarbeit mit angebotenen Operationen, benoetigten
    Eingaben, Ergebnissen und Fehlern. Die Definition darf sowohl den aeusseren Zugang
    als auch einen internen Integrationsvertrag ausdruecken.
  spec:
    properties: {}
- id: MqttService
  kind: core:Kind
  body: Beschreibt die benoetigte MQTT-Laufzeitinfrastruktur. Sie vermittelt nach
    Topics und Abonnements und interpretiert keine fachliche Command-Bedeutung. Ihre
    Bereitstellung ist von den logischen Channel-Vertraegen zu unterscheiden. Dieser
    projektspezifische Typ behauptet keine neue C4-Abstraktion.
  spec:
    properties: {}
- id: Channel
  kind: core:Kind
  body: Beschreibt eine parametrisierte Familie logischer MQTT-Adressen. topicPattern
    bindet Platzhalter an die im Koerper erklaerten Laufzeitwerte; es ist kein vom
    Core auszufuehrendes Programm. broker benennt den benoetigten MQTT-Dienst. delivery
    beschreibt die gewuenschte Transportzustellung, nicht die Zahl der fachlichen
    Ausfuehrungen. In diesem Beispiel sind die Platzhalter tenantId und senderInstanceId
    zulaessig und ihre Werte duerfen keine Topicseparatoren oder Wildcards enthalten.
    Der Koerper legt fest, welche Werte erforderlich sind.
  spec:
    properties:
      topicPattern:
        body: Die in diesem Projekt geltende Adressschablone mit erklaerten Parametern.
        type: string
        minCount: 1
        maxCount: 1
      delivery:
        body: Gewuenschte Zustellsemantik des Nachrichtentransports.
        type: enum
        values:
        - at-most-once
        - at-least-once
        minCount: 1
        maxCount: 1
      broker:
        body: Der MQTT-Dienst, ueber den diese Channel-Familie verfuegbar ist.
        type: reference
        minCount: 1
        maxCount: 1
        target: MqttService
- id: Command
  kind: core:Kind
  body: Beschreibt eine versionierte Operationsanforderung, deren Eingaben und erwartetes
    Resultat. Die Definition ist der Vertrag eines Auftragstyps; konkrete versendete
    Commands sind Laufzeitdaten. operationId ist die eindeutige Operationskennung
    in diesem Projekt. Der Koerper beschreibt Eingaben, Ergebnisse und fachliche Fehler.
  spec:
    properties:
      operationId:
        body: Stabile Kennung der versionierten Operation.
        type: string
        minCount: 1
        maxCount: 1
- id: Exchange
  kind: core:Kind
  body: Beschreibt den Request-/Reply-Vertrag einer Operation zwischen requester und
    receiver. Der Sender veroeffentlicht den Command auf requestChannel und abonniert
    seine instanzbezogene Antwortadresse auf replyChannel. Der Empfaenger verarbeitet
    Requests und veroeffentlicht das Resultat an die mitgesendete Antwortadresse.
    Antworten behalten die MessageId des Requests; MessageId ordnet sie dem wartenden
    Austausch zu. CorrelationId dient der uebergreifenden Nachverfolgung. Der Koerper
    legt Fehler, Wiederholungswirkung und Abbruchgrenzen fest. timeoutSeconds gilt
    pro Versuch und maxAttempts zaehlt den ersten Versuch mit. Positive Werte sind
    eine semantische Verpflichtung dieses Typs; eine allgemeine Integer-Property erzwingt
    diese Bereichsregel noch nicht. Das Objekt beschreibt den Vertrag, keinen einzelnen
    laufenden Nachrichtenaustausch. Der Sender muss die Wartefrist jedes Versuchs
    anhand monotoner Zeitmessung bestimmen.
  spec:
    properties:
      requester:
        id: sender
        body: Anwendung in der Rolle des ausstellenden Auftraggebers.
        type: reference
        minCount: 1
        maxCount: 1
        target: Container
      receiver:
        body: Anwendung in der Rolle des empfangenden Auftragsbearbeiters.
        type: reference
        minCount: 1
        maxCount: 1
        target: Container
      command:
        body: Operationsvertrag des ueber diesen Austausch ausgefuehrten Commands.
        type: reference
        minCount: 1
        maxCount: 1
        target: Command
      requestChannel:
        body: Kanal fuer Auftraege vom Sender zum Empfaenger.
        type: reference
        minCount: 1
        maxCount: 1
        target: Channel
      replyChannel:
        body: Kanal fuer Antworten an die ausstellende Senderinstanz.
        type: reference
        minCount: 1
        maxCount: 1
        target: Channel
      timeoutSeconds:
        body: Positive maximale Wartezeit eines einzelnen Versuchs in Sekunden.
        type: integer
        minCount: 1
        maxCount: 1
      maxAttempts:
        body: Positive maximale Versuchszahl einschliesslich des ersten Versuchs.
        type: integer
        minCount: 1
        maxCount: 1
