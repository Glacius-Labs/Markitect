# Synthetic design fixture; not supported by the current product loader.
package: markitect/core
version: 1.0.0
imports: {}
definitions:
- id: Kind
  kind: Kind
  body: Deklariert einen Typ. properties benennt die erlaubten Angaben seiner Definitionen.
    Der body einer solchen Typdefinition erklaert deren gemeinsame Bedeutung.
  spec:
    properties:
    - Kind/properties
- id: Property
  kind: Kind
  body: Deklariert eine benannte Property mit Werttyp, Kardinalitaet und gegebenenfalls
    Zieltyp, Enumwerten oder Objektfeldern. Ihr body erklaert die Bedeutung der Werte.
  spec:
    properties:
    - Property/name
    - Property/type
    - Property/minCount
    - Property/maxCount
    - Property/values
    - Property/target
    - Property/properties
- id: Kind/properties
  kind: Property
  body: Die Propertyvertraege dieses Kinds; ihre Namen muessen innerhalb dieses Kinds
    eindeutig sein.
  spec:
    name: properties
    type: reference
    minCount: 0
    maxCount: -1
    target: Property
- id: Property/name
  kind: Property
  body: Der nichtleere Wertschluessel dieser Property in einer konkreten spec.
  spec:
    name: name
    type: string
    minCount: 1
    maxCount: 1
- id: Property/type
  kind: Property
  body: Der vom Core verstandene Werttyp.
  spec:
    name: type
    type: enum
    minCount: 1
    maxCount: 1
    values:
    - string
    - boolean
    - integer
    - number
    - enum
    - object
    - reference
- id: Property/minCount
  kind: Property
  body: Nichtnegative Mindestanzahl von Werten.
  spec:
    name: minCount
    type: integer
    minCount: 1
    maxCount: 1
- id: Property/maxCount
  kind: Property
  body: Hoechstanzahl von Werten; -1 bedeutet unbegrenzt innerhalb der Werkzeuggrenzen.
    Genau 1 bezeichnet einen Einzelwert, andere Werte eine Liste.
  spec:
    name: maxCount
    type: integer
    minCount: 1
    maxCount: 1
- id: Property/values
  kind: Property
  body: 'Nur bei enum: nichtleere Liste eindeutiger erlaubter Stringwerte.'
  spec:
    name: values
    type: string
    minCount: 0
    maxCount: -1
- id: Property/target
  kind: Property
  body: 'Nur bei reference erforderlich: exakt referenzierter Ziel-Kind.'
  spec:
    name: target
    type: reference
    minCount: 0
    maxCount: 1
    target: Kind
- id: Property/properties
  kind: Property
  body: 'Nur bei object: Vertraege seiner geschlossenen Objektfelder.'
  spec:
    name: properties
    type: reference
    minCount: 0
    maxCount: -1
    target: Property
