imports:
  - package: example/connector/vocabulary
    as: Connector
id: list-documents-command
kind: example/connector/vocabulary/Command
body: >-
  Requests the user-readable document metadata of a folder. Inputs are
  FolderId and, optionally, PageSize and ContinuationToken. The result contains document metadata
  and, where applicable, NextContinuationToken. Invalid inputs, a non-existent folder
  and missing read permission are distinguished as domain errors. The request does not change
  any documents.
spec:
  operationId: dms.documents.list.v1
