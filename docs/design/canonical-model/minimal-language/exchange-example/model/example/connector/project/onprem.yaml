imports:
  - package: example/connector/vocabulary
    as: Connector
id: onprem
kind: Container
body: >-
  Die Anwendung läuft in der Kundenumgebung und baut ihre MQTT-Verbindung ausgehend auf. Sie
  verarbeitet ausschließlich Aufträge für ihre autorisierte Umgebung. Der Zugriff auf die
  Dokumentenverwaltung erfolgt innerhalb der Kundenumgebung unter den geltenden Benutzerberechtigungen.
spec:
  location: onprem
