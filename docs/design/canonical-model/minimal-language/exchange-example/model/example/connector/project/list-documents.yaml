imports:
  - package: example/connector/vocabulary
    as: Connector
id: list-documents
kind: Exchange
body: >-
  The [[api|API]] requests document metadata from [[onprem|the Connector]]. It registers
  the waiting exchange before publication and discards late replies after the waiting period has expired.
spec:
  requester: api
  receiver: onprem
  command: list-documents-command
  requestChannel: requests
  replyChannel: replies
  timeoutSeconds: 30
  maxAttempts: 2
