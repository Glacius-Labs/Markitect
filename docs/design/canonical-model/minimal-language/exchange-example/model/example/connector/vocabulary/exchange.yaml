imports:
  - package: markitect/core
    as: Core
id: Exchange
kind: Kind
body: >-
  Describes a Request/Reply contract between requester and receiver. Replies keep
  the MessageId of the Request. timeoutSeconds applies per attempt; maxAttempts includes the first
  attempt.
spec:
  properties:
  - requester
  - receiver
  - command
  - requestChannel
  - replyChannel
  - timeoutSeconds
  - maxAttempts
