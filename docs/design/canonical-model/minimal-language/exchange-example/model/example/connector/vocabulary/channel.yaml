imports:
  - package: markitect/core
    as: Core
id: Channel
kind: Kind
body: >-
  Describes a family of logical MQTT addresses. topicPattern contains placeholders for the
  runtime values explained in the body. Placeholder values must not contain topic separators or wildcards.
  delivery describes the transport delivery and does not guarantee exactly-once domain
  execution. broker denotes the MQTT service used.
spec:
  properties:
  - topicPattern
  - delivery
  - broker
