imports:
  - package: example/connector/vocabulary
    as: Connector
id: messaging
kind: MqttService
body: >-
  The MQTT service is reachable from the cloud and from the customer environment. Its runtime is separate
  from the API and the on-premises Connector. Access rules limit publication and subscriptions
  to the addresses authorized in each case. Broker implementation and concrete provisioning
  remain open.
