imports:
  - package: example/connector/vocabulary
    as: Connector
id: replies
kind: Channel
body: >-
  senderInstanceId denotes the issuing API process instance. The API passes its concrete
  reply address in the request. Replies keep the MessageId of the Request and are assigned, within
  this instance, to the waiting exchange. No competing Shared Subscription is used for the
  reply address. Access is limited to the authorized participants.
spec:
  topicPattern: bridge/replies/{senderInstanceId}
  delivery: at-least-once
  broker: messaging
