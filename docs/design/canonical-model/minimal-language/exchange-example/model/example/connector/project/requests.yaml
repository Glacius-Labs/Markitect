imports:
  - package: example/connector/vocabulary
    as: Connector
id: requests
kind: Channel
body: >-
  tenantId denotes the authorized target environment. The address determines the receiver scope;
  the operation is determined by the operation identifier of the message. Connector replicas
  use a common Shared Subscription. Every possible receiver in this pool must
  be able to handle the operation.
spec:
  topicPattern: bridge/{tenantId}/requests
  delivery: at-least-once
  broker: messaging
