imports:
  - package: software
    as: Software
  - package: library
    as: Library
  - package: members
    as: Members
  - package: catalog
    as: Catalog
id: loan
kind: Software.Concept
body: >-
  A loan associates one registered [[Members.member]] with one registered
  [[Catalog.copy]] in [[Library.library]]. A successful [[borrow]] creates its
  own unique stable loan identifier, member identifier, copy identifier,
  borrowing date and due date under [[loan-policy]] and [[Library.inputs]].
  It starts open. [[return]] records a return date and closes it. Closed loans
  stay inspectable, preserve their dates and never have their identifiers
  reused. Loan records describe current state and retained facts, not a service
  for reconstructing the entire library at a historical date.
spec: {}
