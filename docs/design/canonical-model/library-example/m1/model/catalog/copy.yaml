imports:
  - package: software
    as: Software
  - package: library
    as: Library
id: copy
kind: Software.Concept
body: >-
  A copy is one physical book in [[Library.library]], with a unique stable
  identifier and a nonempty title under [[Library.inputs]]. Different copies
  may have the same title and are borrowed independently. Identifier and title
  remain unchanged after registration. There is no separate title or edition
  catalogue. The copy's current availability follows [[availability]].
spec: {}
