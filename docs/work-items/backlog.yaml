  - id: RUN-04
    title: Safe read-only and analysis helper returns
    stream: RUN
    wave: 3
    status: proposed
    owner: runtime
    depends_on: [RUN-02]
    zone: runtime
    note: Former Product Readiness item P11.
    inputs:
      - docs/work-items/surveys/product-readiness-lessons-20261010.md (former P11 and helper limits)
