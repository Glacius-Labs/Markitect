      - Helpers can return read-only inspection or analysis results without authoring files, with the same scope and review rules.

  - id: RUN-05
    title: Exchangeable executor follow-ups from the RUN-01 review
    stream: RUN
    wave: 2
    status: proposed
    owner: runtime
    depends_on: [RUN-01]
    zone: runtime
    inputs:
      - docs/provider-adapters.md#bring-your-own-executor
      - pull request 104 (independent review)
    acceptance:
      - The exchange adapter takes a deadline shorter than the role timeout, removes its request directory when it gives up, and refuses an exchange directory that is not private to the user, on Windows through an ACL check.
      - Setup either rejects script executors (#!, .cmd, .bat) as it does for the native provider, or pins their interpreter.
      - Declared checks get the same environment whether or not the owning Manager is a process executor, including HOME and cache directories.
      - maxCostMicros is optional when every role is unmetered.
      - The next release notes state that setup no longer pins the Codex model and effort.

  - id: RUN-06
    title: Complete native cost accounting
    stream: RUN
    wave: 2
    status: proposed
    owner: runtime
    depends_on: [RUN-01]
    note: From IDEA-01, native cost is a lower bound because helper and child usage are not counted.
    zone: runtime
    inputs:
