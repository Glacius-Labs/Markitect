# Single owner of work-package status. The roadmap explains streams, waves,
# zones and rules; this file records each package's current state.
# The owner's 12 October instruction, "Beginne die Wellen selbstständig neu",
# authorizes continuous assignment of dependency-ready accepted packages.
# The integrator still reserves each zone explicitly; needs_owner, parked,
# intent, provider/study budget and publication gates remain in force.
#
# status: proposed | ready | active | review | done | blocked | parked
#   proposed  scope written, not yet started; may still need an owner decision
#   ready     unblocked and waiting for a session
#   active    a session works on it on the named branch
#   review    a pull request is open
#   done      merged to main and documentation updated
#   blocked   waits for the listed dependency or owner decision
#   parked    recorded under the planning hold (register DEC-011) or deferred
# zone: the code zone the package holds while active (see roadmap "Zones");
#   free means it does not hold a zone.
# owner: the session that works on the package, or unassigned.

packages:

