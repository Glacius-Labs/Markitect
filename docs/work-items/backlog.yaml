main_basis: 02c7e5297defd66e2635c2b590de5ebb0fd4b388

# Single owner of work-package status. The roadmap explains streams, waves,
# zones and rules; this file records each package's current state.
#
# status: proposed | ready | active | review | done | blocked | parked
#   proposed  scope written, not yet started; may still need an owner decision
#   ready     unblocked and waiting for a session
#   active    a session works on it on the named branch
#   review    a pull request is open
#   done      merged to main and documentation updated
#   blocked   waits for the listed dependency or owner decision
#   parked    recorded under the planning hold (register DEC-011) or deferred
# zone: the code zone the package holds while active (see roadmap "Zones");
#   free means it does not hold a zone.
# owner: the session that works on the package, or unassigned.

packages:

  # --- OPS: roadmap, integration and repository hygiene -----------------
  - id: OPS-01
    title: Fresh roadmap and lean backlog on main
    stream: OPS
    wave: 0
    status: review
    owner: integrator
    branch: docs/roadmap
    zone: docs-entry
    acceptance:
      - docs/implementation-plan.md is the roadmap; this file is the single status owner.
      - Product Readiness is recorded as a completed program; its open follow-ups are migrated here.
      - Owner decisions this roadmap needs are listed and linked to the concept register.

  - id: OPS-02
    title: Secure work that exists only on this machine
    stream: OPS
    wave: 0
    status: done
    owner: integrator
    note: Done 10 October 2026. Archive references are listed in the branch survey; the playground branch is on the research-backup remote, which already holds its research base. Refresh the playground snapshot once that session has stopped.
    zone: free
    scope: >-
      Push or bundle the branches with unique unmerged work that have no remote:
      claude/case-playground-v2, codex/government-implementation-20261010,
      codex/markitect-historian-working-history, codex/astra-assessment-snapshot,
      codex/vision-method-alignment. Untracked files in live worktrees stay with their sessions.
    acceptance:
      - Every branch with unique work has a remote copy or a verified git bundle.

  - id: OPS-03
    title: Archive merged and superseded branches and stale worktrees
    stream: OPS
    wave: 1
    status: ready
    owner: integrator
    note: Owner approved the archive list on 10 October 2026.
    depends_on: [OPS-02]
    zone: free
    inputs:
      - docs/work-items/surveys/branches-and-worktrees-20261010.md
    acceptance:
      - Each archived branch has an archive/<name> tag; branches are deleted only after approval.
      - Empty and stale worktree folders are removed; live worktrees are untouched.
      - Besides main, only branches with the current prefixes (dev/, fix/, docs/, exp/) and archive references remain.

  - id: OPS-04
    title: Integration routine and contribution rules for parallel work
    stream: OPS
    wave: 0
    status: proposed
    owner: integrator
    zone: docs-entry
    acceptance:
      - CONTRIBUTING states the branch naming, one package per PR, no pushes to a PR head during CI, and the merge order.
      - The pull-request template asks for the package ID, zone and acceptance evidence.

