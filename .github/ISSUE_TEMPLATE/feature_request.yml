name: Feature request
description: Propose a product capability or improvement.
title: "feature: "
body:
  - type: markdown
    attributes:
      value: |
        With Markitect, people architect their project in Markdown, and agents realize it. See [the concept](https://github.com/Glacius-Labs/Markitect/blob/main/docs/concept.md), [the decisions](https://github.com/Glacius-Labs/Markitect/blob/main/docs/decisions.md) and [the roadmap](https://github.com/Glacius-Labs/Markitect/blob/main/docs/roadmap.md) before proposing a change.
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      description: Describe the concrete problem with writing, checking or realizing a spec.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Explain what a user would be able to do and any relevant inputs or outputs.
    validations:
      required: true
  - type: textarea
    id: boundaries
    attributes:
      label: Product boundaries
      description: Note effects on the spec language, the record of what was verified, the agents' rights or a project's own files.
      render: markdown
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Include existing workflows or tools that could address the problem.
