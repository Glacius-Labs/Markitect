name: Published release benchmark

on:
  release:
    types: [published]

permissions:
  contents: read
  attestations: read

jobs:
  benchmark:
    name: Fixture v1 (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            asset: linux-amd64
          - os: windows-latest
            asset: windows-amd64.exe
    steps:
      - name: Check out the immutable release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false

      - name: Set up Go for the fixture verification gate
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Resolve two immutable published releases and download attested binaries
        id: releases
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
          ASSET: ${{ matrix.asset }}
        run: |
          $ErrorActionPreference = 'Stop'
          $repo = $env:GITHUB_REPOSITORY
          $current = gh api "repos/$repo/releases/tags/$env:TAG" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or -not $current.immutable -or $current.draft -or -not $current.published_at) { throw 'Current release is not published and immutable' }
          if ($current.target_commitish -and $current.target_commitish -match '^[0-9a-f]{40}$' -and $current.target_commitish -ne $env:GITHUB_SHA) { throw 'Release source commit differs from the checkout' }
          $pages = gh api --paginate --slurp "repos/$repo/releases?per_page=100" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'Could not list releases' }
          $all = foreach ($page in $pages) { foreach ($release in $page) { $release } }
          $previous = $all | Where-Object { $_.immutable -and -not $_.draft -and $_.published_at -and [datetime]$_.published_at -lt [datetime]$current.published_at } | Sort-Object { [datetime]$_.published_at } -Descending | Select-Object -First 1
          if (-not $previous) { throw 'No previous immutable published release exists' }
          $currentDir = Join-Path $env:RUNNER_TEMP 'markitect-current'
          $previousDir = Join-Path $env:RUNNER_TEMP 'markitect-previous'
          New-Item -ItemType Directory -Force $currentDir,$previousDir | Out-Null
          foreach ($release in @(@{tag=$current.tag_name; dir=$currentDir}, @{tag=$previous.tag_name; dir=$previousDir})) {
            gh release verify $release.tag -R $repo | Out-Null
            if ($LASTEXITCODE -ne 0) { throw "Release attestation failed for $($release.tag)" }
            $filename = "markitect-$($release.tag)-$env:ASSET"
            gh release download $release.tag -R $repo -p $filename -D $release.dir
            if ($LASTEXITCODE -ne 0) { throw "Could not download $filename" }
            gh release verify-asset $release.tag (Join-Path $release.dir $filename) -R $repo | Out-Null
            if ($LASTEXITCODE -ne 0) { throw "Asset attestation failed for $filename" }
          }
          "previous=$($previous.tag_name)" >> $env:GITHUB_OUTPUT
          "current_binary=$(Join-Path $currentDir "markitect-$($current.tag_name)-$env:ASSET")" >> $env:GITHUB_OUTPUT
          "previous_binary=$(Join-Path $previousDir "markitect-$($previous.tag_name)-$env:ASSET")" >> $env:GITHUB_OUTPUT

      - name: Make Linux binaries executable
        if: runner.os == 'Linux'
        shell: bash
        env:
          CURRENT_BINARY: ${{ steps.releases.outputs.current_binary }}
          PREVIOUS_BINARY: ${{ steps.releases.outputs.previous_binary }}
        run: chmod +x "$CURRENT_BINARY" "$PREVIOUS_BINARY"

      - name: Measure both releases on one versioned fixture
        shell: pwsh
        env:
          CURRENT_BINARY: ${{ steps.releases.outputs.current_binary }}
          PREVIOUS_BINARY: ${{ steps.releases.outputs.previous_binary }}
          CURRENT_TAG: ${{ github.event.release.tag_name }}
          PREVIOUS_TAG: ${{ steps.releases.outputs.previous }}
        run: |
          ./benchmark/run.ps1 -CurrentBinary $env:CURRENT_BINARY -PreviousBinary $env:PREVIOUS_BINARY -CurrentTag $env:CURRENT_TAG -PreviousTag $env:PREVIOUS_TAG -FixtureRoot ./benchmark/fixtures/v1 -OutputDirectory (Join-Path $env:RUNNER_TEMP 'markitect-benchmark')

      - name: Upload raw data and summary even after measurement failure
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-benchmark-${{ github.event.release.tag_name }}-${{ matrix.os }}
          path: ${{ runner.temp }}/markitect-benchmark/results.json
          if-no-files-found: warn

      - name: Upload summary
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0 # v7.0.1
        with:
          name: release-benchmark-summary-${{ github.event.release.tag_name }}-${{ matrix.os }}
          path: ${{ runner.temp }}/markitect-benchmark/summary.md
          if-no-files-found: warn
