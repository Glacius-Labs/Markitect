name: CI

on:
  # Development policy: full validation is explicitly requested, not a merge wait.
  # CI is Linux only (owner decision of 27 October 2026); no job waits for Windows.
  # Only the native input adds Markitect Desktop's native app on Windows, macOS
  # and Linux, for work on that app.
  workflow_dispatch:
    inputs:
      native:
        description: Also build and start Markitect Desktop's native app on Windows, macOS and Linux
        type: boolean
        default: false
  workflow_call:

permissions:
  contents: read

# Preserve the verdict and evidence of each explicit or release-owned run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  quality:
    name: Quality (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04]
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Verify module checksums
        run: go mod verify

      - name: Test
        shell: bash
        run: |
          # The event stream goes to a file; the live log shows each finished package.
          set +e
          go test ./... -count=1 -timeout=20m -json | tee "$RUNNER_TEMP/go-test.json" | grep --line-buffered -E '"Action":"(pass|fail)","Package":"[^"]*","Elapsed"' | sed -u -E 's/.*"Action":"([a-z]+)","Package":"([^"]*)","Elapsed":([0-9.]+).*/\1 \3s \2/'
          status=${PIPESTATUS[0]}
          set -e
          report=0
          python -B scripts/go-test-report.py "$RUNNER_TEMP/go-test.json" --summary "$GITHUB_STEP_SUMMARY" --title "Go tests (${{ matrix.os }})" > "$RUNNER_TEMP/go-test-report.txt" || report=$?
          cat "$RUNNER_TEMP/go-test-report.txt"
          if [ "$status" -ne 0 ]; then exit "$status"; fi
          exit "$report"

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      - name: Build Markitect Desktop's native app for Windows
        # The native app builds only with the native tag. For Windows it needs
        # no C toolchain, so every run checks that it still compiles.
        env:
          GOOS: windows
        run: |
          go vet -tags native ./cmd/markitect-desktop
          go build -tags native -ldflags=-H=windowsgui -o /dev/null ./cmd/markitect-desktop

      - name: Verify modules
        run: go mod verify

      - name: Check Go formatting
        shell: bash
        run: |
          unformatted="$(git ls-files -z '*.go' | xargs -0 -n 32 gofmt -l)"
          if [ -n "$unformatted" ]; then echo "Run gofmt -w on these files:"; echo "$unformatted"; exit 1; fi

      - name: Check diff whitespace
        run: git diff --check

      - name: Smoke the packaged distribution
        run: go run ./tools/smoke -repo . -work "${{ runner.temp }}/smoke"

      - name: Test repository scripts
        run: python -B -m unittest discover -s scripts -p 'test_*.py'

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Test and rebuild Markitect Desktop's UI
        shell: bash
        working-directory: desktop
        run: |
          npm ci --no-audit --no-fund
          npm test
          npm run build
          if ! git diff --quiet -- ../internal/adapters/desktop/ui || [ -n "$(git status --porcelain -- ../internal/adapters/desktop/ui)" ]; then
            echo "The committed UI build differs from desktop/; run npm run build in desktop/ and commit internal/adapters/desktop/ui."
            git status --short -- ../internal/adapters/desktop/ui
            exit 1
          fi

      - name: Check maintained documentation links
        run: python -B scripts/check-docs.py

      - name: Check independent library oracle and bounded transport
        run: python -B -m unittest discover -s tools/library-oracle

      - name: Test comparison, evaluation and Makerspace oracle tools
        shell: bash
        run: |
          python -B -m unittest discover -s tools/comparison
          python -B -m unittest discover -s tools/evaluation
          python -B -m unittest discover -s tools/makerspace-oracle -p 'test_*.py'

      - name: Upload Go test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          # One artifact per attempt: a re-run must not replace the results of
          # a failed attempt, or the flake report would never see the failure.
          name: go-test-${{ matrix.os }}-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/go-test.json
            ${{ runner.temp }}/go-test-report.txt
          if-no-files-found: warn
          retention-days: 14

  race:
    # The suite under the race detector, in parallel with the quality job
    # (backlog CI-07). Linux only: -race needs cgo.
    name: Race detector (ubuntu-24.04)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Test with the race detector
        shell: bash
        run: |
          set +e
          go test -race ./... -count=1 -timeout=25m -json | tee "$RUNNER_TEMP/go-test.json" | grep --line-buffered -E '"Action":"(pass|fail)","Package":"[^"]*","Elapsed"' | sed -u -E 's/.*"Action":"([a-z]+)","Package":"([^"]*)","Elapsed":([0-9.]+).*/\1 \3s \2/'
          status=${PIPESTATUS[0]}
          set -e
          report=0
          python -B scripts/go-test-report.py "$RUNNER_TEMP/go-test.json" --summary "$GITHUB_STEP_SUMMARY" --title "Go tests with -race (ubuntu-24.04)" > "$RUNNER_TEMP/go-test-report.txt" || report=$?
          cat "$RUNNER_TEMP/go-test-report.txt"
          if grep -q 'WARNING: DATA RACE' "$RUNNER_TEMP/go-test.json"; then echo "::error::The race detector reported a data race; see the failed tests above."; fi
          if [ "$status" -ne 0 ]; then exit "$status"; fi
          exit "$report"

      - name: Upload Go test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: go-test-ubuntu-24.04-race-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/go-test.json
            ${{ runner.temp }}/go-test-report.txt
          if-no-files-found: warn
          retention-days: 14

  desktop-native:
    # Markitect Desktop's native app, built and started on each platform. It
    # runs only when the native input asks for it, so default runs stay Linux
    # only.
    name: Desktop native app (${{ matrix.os }})
    if: ${{ inputs.native }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Install GTK 4, WebKitGTK 6 and an X server
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgtk-4-dev libwebkitgtk-6.0-dev xvfb x11-utils dbus-x11
          # WebKitGTK sandboxes its web process with bubblewrap, which needs
          # unprivileged user namespaces. Ubuntu desktops allow them for
          # bubblewrap through AppArmor; the runner forbids them outright.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Build the native app and the command line
        shell: bash
        run: |
          ext=""; ldflags=""
          if [ "$RUNNER_OS" = Windows ]; then ext=".exe"; ldflags="-H=windowsgui"; fi
          go vet -tags native ./cmd/markitect-desktop
          go build -tags native -ldflags="$ldflags" -o "$RUNNER_TEMP/bin/markitect-desktop$ext" ./cmd/markitect-desktop
          go build -o "$RUNNER_TEMP/bin/markitect$ext" ./cmd/markitect
          ls -l "$RUNNER_TEMP/bin"

      - name: Start the native app
        shell: bash
        run: |
          ext=""
          if [ "$RUNNER_OS" = Windows ]; then ext=".exe"; fi
          bash scripts/desktop-native-smoke.sh "$RUNNER_TEMP/bin/markitect-desktop$ext" "$RUNNER_TEMP/bin/markitect$ext" "$RUNNER_TEMP/desktop-smoke"

  publish-source-artifact:
    name: Publish main source artifact
    needs:
      - quality
      - race
    if: ${{ success() && github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Package pinned source and bootstrap files
        shell: bash
        run: |
          package_dir="$RUNNER_TEMP/markitect-source-$GITHUB_SHA"
          go run ./cmd/markitect-release package --repo . --output "$package_dir"
          mkdir -p "$package_dir/.markitect/bootstrap"
          cp packaging/bootstrap/run-markitect.go "$package_dir/.markitect/bootstrap/run.go"
          cp packaging/bootstrap/run-markitect_test.go "$package_dir/.markitect/bootstrap/run_test.go"

      - name: Upload commit-scoped source artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          include-hidden-files: true
          name: markitect-source-${{ github.sha }}
          path: ${{ runner.temp }}/markitect-source-${{ github.sha }}/
          if-no-files-found: error
          retention-days: 7
