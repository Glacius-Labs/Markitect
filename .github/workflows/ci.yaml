name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Verify module checksums
        run: go mod verify

      - name: Test
        run: go test ./...

      - name: Validate authoring benchmark fixtures
        run: go test ./internal/app -run '^$' -bench Authoring -benchtime=1x

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      - name: Check generated schemas
        run: go run ./cmd/markitect schema --repo .

      - name: Check canonical formatting
        run: go run ./cmd/markitect format --repo examples/minimal

      - name: Check minimal example
        run: go run ./cmd/markitect check --repo examples/minimal

      - name: Check repository layout example
        run: go run ./cmd/markitect check --repo examples/repository-layout

      - name: Check repository layout example formatting
        run: go run ./cmd/markitect format --repo examples/repository-layout

      - name: Check versioned release benchmark fixture
        run: go run ./cmd/markitect check --repo benchmark/fixtures/v2

      - name: Check code and documentation example
        run: go run ./cmd/markitect check --repo examples/documentation

      - name: Check code and documentation example formatting
        run: go run ./cmd/markitect format --repo examples/documentation

      - name: Check onboarding example
        run: go run ./cmd/markitect check --repo examples/onboarding/delivery-service

      - name: Check onboarding example formatting
        run: go run ./cmd/markitect format --repo examples/onboarding/delivery-service

      - name: Replay onboarding workflow
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $binary = Join-Path $env:RUNNER_TEMP 'markitect-onboarding.exe'
          go build -o $binary ./cmd/markitect
          if ($LASTEXITCODE -ne 0) { throw 'Could not build the onboarding candidate' }
          ./scripts/onboarding/Measure-Adoption.ps1 -MarkitectBinary $binary -OutputDirectory (Join-Path $env:RUNNER_TEMP "markitect-onboarding-$env:GITHUB_SHA")

      - name: Upload onboarding evidence
        if: always() && runner.os == 'Windows'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: onboarding-${{ github.sha }}
          path: ${{ runner.temp }}/markitect-onboarding-${{ github.sha }}/
          if-no-files-found: warn
          retention-days: 14
      - name: Check documentation placement example
        run: go run ./cmd/markitect check --repo examples/documentation-placement

      - name: Check documentation placement example formatting
        run: go run ./cmd/markitect format --repo examples/documentation-placement

      - name: Check pinned content package consumer
        run: go run ./cmd/markitect check --repo examples/package-consumer

      - name: Compile imported package context
        run: go run ./cmd/markitect context --repo examples/package-consumer --package review-guidance --namespace review --kind Workflow --name review-change

      - name: Compile consumer wrapper context
        run: go run ./cmd/markitect context --repo examples/package-consumer --namespace consumer --kind Skill --name local-review-entry

      - name: Check diff whitespace
        run: git diff --check

      - name: Create package and copy bootstrap (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          package_dir="$RUNNER_TEMP/markitect-source-smoke-$GITHUB_SHA"
          go run ./cmd/markitect package --repo . --output "$package_dir"
          mkdir -p "$package_dir/.markitect/bootstrap"
          cp integration/run-markitect.go "$package_dir/.markitect/bootstrap/run.go"
          cp integration/run-markitect_test.go "$package_dir/.markitect/bootstrap/run_test.go"
          echo "MARKITECT_PACKAGE_DIR=$package_dir" >> "$GITHUB_ENV"

      - name: Create package and copy bootstrap (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $packageDir = Join-Path $env:RUNNER_TEMP "markitect-source-smoke-$env:GITHUB_SHA"
          go run ./cmd/markitect package --repo . --output $packageDir
          if ($LASTEXITCODE -ne 0) { throw "Markitect package failed with exit code $LASTEXITCODE" }
          New-Item -ItemType Directory -Path (Join-Path $packageDir '.markitect/bootstrap') | Out-Null
          Copy-Item integration/run-markitect.go (Join-Path $packageDir '.markitect/bootstrap/run.go')
          Copy-Item integration/run-markitect_test.go (Join-Path $packageDir '.markitect/bootstrap/run_test.go')
          "MARKITECT_PACKAGE_DIR=$packageDir" >> $env:GITHUB_ENV

      - name: Test standalone bootstrap and packaged commands (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          cd "$MARKITECT_PACKAGE_DIR"
          go test .markitect/bootstrap/run.go .markitect/bootstrap/run_test.go
          output="$(go run .markitect/bootstrap/run.go authoring)"
          grep -Fq 'core/Skill/authoring' <<< "$output"
          notices="$(go run .markitect/bootstrap/run.go licenses)"
          grep -Fq 'Copyright 2009 The Go Authors.' <<< "$notices"
          grep -Fq 'END OF TERMS AND CONDITIONS' <<< "$notices"
          check_output="$(go run .markitect/bootstrap/run.go check --repo "$GITHUB_WORKSPACE/examples/minimal")"
          grep -Eq '^status: passed$' <<< "$check_output"
          init_dir="$RUNNER_TEMP/markitect-init-$GITHUB_SHA"
          git init -b feature/authoring "$init_dir"
          go run .markitect/bootstrap/run.go init --repo "$init_dir" --name started-project --namespace engineering
          test ! -e "$init_dir/markitect.yaml"
          go run .markitect/bootstrap/run.go init --repo "$init_dir" --name started-project --namespace engineering --write
          test -f "$init_dir/.markitect/areas/engineering/README.md"
          init_check="$(go run .markitect/bootstrap/run.go check --repo "$init_dir")"
          grep -Eq '^status: passed$' <<< "$init_check"

      - name: Test standalone bootstrap and packaged commands (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Push-Location $env:MARKITECT_PACKAGE_DIR
          go test .markitect/bootstrap/run.go .markitect/bootstrap/run_test.go
          if ($LASTEXITCODE -ne 0) { throw "Bootstrap tests failed with exit code $LASTEXITCODE" }
          $output = go run .markitect/bootstrap/run.go authoring
          if ($LASTEXITCODE -ne 0) { throw "Bootstrap authoring smoke failed with exit code $LASTEXITCODE" }
          if (($output -join "`n") -notmatch 'core/Skill/authoring') { throw 'Packaged binary omitted the embedded authoring Skill' }
          $notices = go run .markitect/bootstrap/run.go licenses
          if ($LASTEXITCODE -ne 0) { throw 'Packaged third-party notices failed' }
          if (($notices -join "`n") -notmatch 'Copyright 2009 The Go Authors.' -or ($notices -join "`n") -notmatch 'END OF TERMS AND CONDITIONS') { throw 'Packaged binary omitted third-party notices' }
          $example = Join-Path $env:GITHUB_WORKSPACE 'examples/minimal'
          $checkOutput = go run .markitect/bootstrap/run.go check --repo $example
          if ($LASTEXITCODE -ne 0) { throw "Bootstrap example check failed with exit code $LASTEXITCODE" }
          if (($checkOutput -join "`n") -notmatch '(?m)^status: passed$') { throw 'Packaged binary did not pass the minimal example check' }
          $initDir = Join-Path $env:RUNNER_TEMP "markitect-init-$env:GITHUB_SHA"
          git init -b feature/authoring $initDir
          if ($LASTEXITCODE -ne 0) { throw 'Could not initialize the smoke repository' }
          go run .markitect/bootstrap/run.go init --repo $initDir --name started-project --namespace engineering
          if ($LASTEXITCODE -ne 0) { throw 'Packaged initialization preview failed' }
          if (Test-Path (Join-Path $initDir 'markitect.yaml')) { throw 'Initialization preview changed the destination' }
          go run .markitect/bootstrap/run.go init --repo $initDir --name started-project --namespace engineering --write
          if ($LASTEXITCODE -ne 0) { throw 'Packaged initialization failed' }
          if (-not (Test-Path (Join-Path $initDir '.markitect/areas/engineering/README.md'))) { throw 'Default canonical area README is missing' }
          $initCheck = go run .markitect/bootstrap/run.go check --repo $initDir
          if ($LASTEXITCODE -ne 0) { throw 'Initialized project failed structural checks' }
          if (($initCheck -join "`n") -notmatch '(?m)^status: passed$') { throw 'Initialized project did not pass structural checks' }
          Pop-Location

  publish-source-artifact:
    name: Publish main source artifact
    needs:
      - quality
    if: ${{ success() && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Package pinned source and bootstrap files
        shell: bash
        run: |
          package_dir="$RUNNER_TEMP/markitect-source-$GITHUB_SHA"
          go run ./cmd/markitect package --repo . --output "$package_dir"
          mkdir -p "$package_dir/.markitect/bootstrap"
          cp integration/run-markitect.go "$package_dir/.markitect/bootstrap/run.go"
          cp integration/run-markitect_test.go "$package_dir/.markitect/bootstrap/run_test.go"

      - name: Upload commit-scoped source artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          include-hidden-files: true
          name: markitect-source-${{ github.sha }}
          path: ${{ runner.temp }}/markitect-source-${{ github.sha }}/
          if-no-files-found: error
          retention-days: 30
