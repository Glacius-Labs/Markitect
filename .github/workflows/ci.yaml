name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Verify module checksums
        run: go mod verify

      - name: Enforce Core, Module, Host and CLI import boundaries
        run: go test ./src/internal/tooling/architecture

      - name: Test
        run: go test ./... -count=1 -timeout=60m

      - name: Repeat temporary Git fixture cleanup regression (Linux)
        if: runner.os == 'Linux'
        run: go test ./src/harness/examples -run '^TestUnknownOntologyLoadsExactPackagesAndPreparesBoundedScope$' -count=100

      - name: Validate authoring benchmark fixtures
        run: go test ./src/internal/host -run '^$' -bench Authoring -benchtime=1x

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      - name: Verify modules
        run: go mod verify

      - name: Check Markitect-first dogfood project
        run: go run ./src/cmd/markitect check --repo . --revision ${{ github.sha }}

      - name: Check dogfood canonical formatting
        run: go run ./src/cmd/markitect format --repo .

      - name: Check managed artifact accounting
        run: go run ./src/cmd/markitect-check-artifacts --repo . --config markitect-artifacts.yaml

      - name: Check configured modules
        run: go run ./src/cmd/markitect-check-modules --repo . --hooks .markitect/modules/githooks.config --pipelines .markitect/modules/pipelines.config

      - name: Check Claude proposal adapter protocol
        run: python -B -m unittest discover -s src/internal/tooling/clauderunner

      - name: Check Codex proposal adapter protocol
        run: python -B -m unittest discover -s src/internal/tooling/codexrunner

      - name: Compile fixed dogfood engineering context
        run: go run ./src/cmd/markitect context --repo . --revision ${{ github.sha }} --namespace development --kind Skill --name engineering-change

      - name: Verify fixed dogfood engineering state
        run: go run ./src/cmd/markitect verify --repo . --revision ${{ github.sha }}

      - name: Replay independent greenfield AI candidate bytes
        run: go test ./src/internal/host -run '^TestProjectionGreenfieldCandidatesConvergeAgainstIndependentEvidence$' -count=1

      - name: Verify fixed projection-first example
        shell: python {0}
        run: |
          import os, pathlib, shutil, subprocess
          root = pathlib.Path(os.environ["RUNNER_TEMP"]) / ("markitect-projection-" + os.environ["GITHUB_SHA"])
          shutil.copytree("examples/projection-first", root, symlinks=True)
          def git(*args):
              return subprocess.check_output(["git", "-C", str(root), *args], text=True).strip()
          git("init", "-b", "codex/projection-example")
          git("config", "user.name", "Markitect CI")
          git("config", "user.email", "markitect-ci@users.noreply.github.com")
          git("config", "core.autocrlf", "false")
          git("add", ".")
          git("commit", "-m", "Freeze projection example from " + os.environ["GITHUB_SHA"])
          revision = git("rev-parse", "HEAD")
          print("Projection fixture source=" + os.environ["GITHUB_SHA"] + " revision=" + revision, flush=True)
          subprocess.run(["go", "run", "./src/cmd/markitect", "projection", "--repo", str(root), "--action", "verify", "--config", "projections.config", "--coverage", "markitect-artifacts.yaml", "--revision", revision], check=True)

      - name: Compile fixed canonical source alpha
        run: go run ./src/cmd/markitect canonical --repo . --config examples/canonical-projection/canonical.yaml --action model --revision ${{ github.sha }}

      - name: Replay canonical candidate, records, verification and drift
        run: go test ./src/harness/examples -run '^TestCanonicalProjectionBoundCandidateApplyVerifyAndRepair$' -count=1

      - name: Check generated schemas
        run: go run ./src/cmd/markitect schema --repo .

      - name: Check canonical formatting
        run: go run ./src/cmd/markitect format --repo examples/minimal

      - name: Check minimal example
        run: go run ./src/cmd/markitect check --repo examples/minimal

      - name: Check repository layout example
        run: go run ./src/cmd/markitect check --repo examples/repository-layout

      - name: Check repository layout example formatting
        run: go run ./src/cmd/markitect format --repo examples/repository-layout

      - name: Check Markdown navigation example
        run: go run ./src/cmd/markitect check --repo examples/markdown-navigation

      - name: Check Markdown navigation example formatting
        run: go run ./src/cmd/markitect format --repo examples/markdown-navigation

      - name: Check versioned release benchmark fixture
        run: go run ./src/cmd/markitect check --repo benchmark/fixtures/v2

      - name: Check code and documentation example
        run: go run ./src/cmd/markitect check --repo examples/documentation

      - name: Check code and documentation example formatting
        run: go run ./src/cmd/markitect format --repo examples/documentation

      - name: Check onboarding example
        run: go run ./src/cmd/markitect check --repo examples/onboarding/delivery-service

      - name: Check onboarding example formatting
        run: go run ./src/cmd/markitect format --repo examples/onboarding/delivery-service

      - name: Check canonical engineering example
        run: go run ./src/cmd/markitect check --repo examples/canonical-engineering

      - name: Compile canonical engineering context
        run: go run ./src/cmd/markitect context --repo examples/canonical-engineering --kind Skill --name architecture-review --namespace engineering

      - name: Compile canonical engineering model
        run: go run ./src/cmd/markitect model --repo examples/canonical-engineering

      - name: Check canonical engineering formatting
        run: go run ./src/cmd/markitect format --repo examples/canonical-engineering

      - name: Check reusable engineering constitution
        run: go run ./src/cmd/markitect check --repo examples/engineering-constitution

      - name: Compile engineering constitution context
        run: go run ./src/cmd/markitect context --repo examples/engineering-constitution --namespace engineering --kind Skill --name add-order

      - name: Compile engineering constitution model
        run: go run ./src/cmd/markitect model --repo examples/engineering-constitution

      - name: Check engineering constitution formatting
        run: go run ./src/cmd/markitect format --repo examples/engineering-constitution

      - name: Check discovery workflow example
        run: go run ./src/cmd/markitect check --repo examples/engineering-discovery

      - name: Check discovery workflow formatting
        run: go run ./src/cmd/markitect format --repo examples/engineering-discovery

      - name: Check software architecture stress case
        run: go run ./src/cmd/markitect check --repo examples/software-architecture

      - name: Compile software architecture context
        run: go run ./src/cmd/markitect context --repo examples/software-architecture --namespace engineering --kind Skill --name implement-order

      - name: Compile software architecture model
        run: go run ./src/cmd/markitect model --repo examples/software-architecture

      - name: Check software architecture formatting
        run: go run ./src/cmd/markitect format --repo examples/software-architecture

      - name: Check Delivery target equality
        run: go run ./src/cmd/markitect check --repo examples/delivery-target-equality

      - name: Compile Delivery target equality model
        run: go run ./src/cmd/markitect model --repo examples/delivery-target-equality

      - name: Compile Delivery target equality context
        run: go run ./src/cmd/markitect context --repo examples/delivery-target-equality --namespace engineering --kind Skill --name deployment-review

      - name: Check Delivery target equality formatting
        run: go run ./src/cmd/markitect format --repo examples/delivery-target-equality

      - name: Replay onboarding workflow
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $binary = Join-Path $env:RUNNER_TEMP 'markitect-onboarding.exe'
          go build -o $binary ./src/cmd/markitect
          if ($LASTEXITCODE -ne 0) { throw 'Could not build the onboarding candidate' }
          ./scripts/onboarding/Measure-Adoption.ps1 -MarkitectBinary $binary -OutputDirectory (Join-Path $env:RUNNER_TEMP "markitect-onboarding-$env:GITHUB_SHA")

      - name: Upload onboarding evidence
        if: always() && runner.os == 'Windows'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: onboarding-${{ github.sha }}
          path: ${{ runner.temp }}/markitect-onboarding-${{ github.sha }}/
          if-no-files-found: warn
          retention-days: 14
      - name: Check documentation placement example
        run: go run ./src/cmd/markitect check --repo examples/documentation-placement

      - name: Check documentation placement example formatting
        run: go run ./src/cmd/markitect format --repo examples/documentation-placement

      - name: Check pinned content package consumer
        run: go run ./src/cmd/markitect check --repo examples/package-consumer

      - name: Compile imported package context
        run: go run ./src/cmd/markitect context --repo examples/package-consumer --package review-guidance --namespace review --kind Workflow --name review-change

      - name: Compile consumer wrapper context
        run: go run ./src/cmd/markitect context --repo examples/package-consumer --namespace consumer --kind Skill --name local-review-entry

      - name: Check diff whitespace
        run: git diff --check

      - name: Create package and copy bootstrap (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          package_dir="$RUNNER_TEMP/markitect-source-smoke-$GITHUB_SHA"
          go run ./src/cmd/markitect package --repo . --output "$package_dir"
          mkdir -p "$package_dir/.markitect/bootstrap"
          cp integration/run-markitect.go "$package_dir/.markitect/bootstrap/run.go"
          cp integration/run-markitect_test.go "$package_dir/.markitect/bootstrap/run_test.go"
          echo "MARKITECT_PACKAGE_DIR=$package_dir" >> "$GITHUB_ENV"

      - name: Create package and copy bootstrap (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $packageDir = Join-Path $env:RUNNER_TEMP "markitect-source-smoke-$env:GITHUB_SHA"
          go run ./src/cmd/markitect package --repo . --output $packageDir
          if ($LASTEXITCODE -ne 0) { throw "Markitect package failed with exit code $LASTEXITCODE" }
          New-Item -ItemType Directory -Path (Join-Path $packageDir '.markitect/bootstrap') | Out-Null
          Copy-Item integration/run-markitect.go (Join-Path $packageDir '.markitect/bootstrap/run.go')
          Copy-Item integration/run-markitect_test.go (Join-Path $packageDir '.markitect/bootstrap/run_test.go')
          "MARKITECT_PACKAGE_DIR=$packageDir" >> $env:GITHUB_ENV

      - name: Test standalone bootstrap and packaged commands (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          cd "$MARKITECT_PACKAGE_DIR"
          go test .markitect/bootstrap/run.go .markitect/bootstrap/run_test.go
          output="$(go run .markitect/bootstrap/run.go authoring)"
          grep -Fq 'core/Skill/authoring' <<< "$output"
          notices="$(go run .markitect/bootstrap/run.go licenses)"
          grep -Fq 'Copyright 2009 The Go Authors.' <<< "$notices"
          grep -Fq 'END OF TERMS AND CONDITIONS' <<< "$notices"
          check_output="$(go run .markitect/bootstrap/run.go check --repo "$GITHUB_WORKSPACE/examples/minimal")"
          grep -Eq '^status: passed$' <<< "$check_output"
          adapter_source="$RUNNER_TEMP/markitect-adapter-source-$GITHUB_SHA"
          adapter_bin="$RUNNER_TEMP/markitect-adapter-bin-$GITHUB_SHA"
          mkdir -p "$adapter_source" "$adapter_bin"
          unzip -q "$MARKITECT_PACKAGE_DIR/.markitect/tool/source.zip" -d "$adapter_source"
          (cd "$adapter_source" && go build -trimpath -buildvcs=false -o "$adapter_bin/markitect-adapter-dotnet" ./src/cmd/markitect-adapter-dotnet)
          echo "$adapter_bin" >> "$GITHUB_PATH"
          export PATH="$adapter_bin:$PATH"
          domain_check_output="$(go run .markitect/bootstrap/run.go check --repo "$GITHUB_WORKSPACE/examples/canonical-engineering")"
          grep -Eq '^status: passed$' <<< "$domain_check_output"
          go run .markitect/bootstrap/run.go context --repo "$GITHUB_WORKSPACE/examples/canonical-engineering" --kind Skill --name architecture-review --namespace engineering
          go run .markitect/bootstrap/run.go model --repo "$GITHUB_WORKSPACE/examples/canonical-engineering"
          go run .markitect/bootstrap/run.go format --repo "$GITHUB_WORKSPACE/examples/canonical-engineering"
          go run .markitect/bootstrap/run.go check --repo "$GITHUB_WORKSPACE/examples/software-architecture"
          go run .markitect/bootstrap/run.go model --repo "$GITHUB_WORKSPACE/examples/software-architecture"
          go run .markitect/bootstrap/run.go context --repo "$GITHUB_WORKSPACE/examples/software-architecture" --namespace engineering --kind Skill --name implement-order
          go run .markitect/bootstrap/run.go format --repo "$GITHUB_WORKSPACE/examples/software-architecture"
          go run .markitect/bootstrap/run.go check --repo "$GITHUB_WORKSPACE/examples/delivery-target-equality"
          go run .markitect/bootstrap/run.go model --repo "$GITHUB_WORKSPACE/examples/delivery-target-equality"
          go run .markitect/bootstrap/run.go context --repo "$GITHUB_WORKSPACE/examples/delivery-target-equality" --namespace engineering --kind Skill --name deployment-review
          go run .markitect/bootstrap/run.go format --repo "$GITHUB_WORKSPACE/examples/delivery-target-equality"
          domain_repo="$RUNNER_TEMP/markitect-canonical-engineering-$GITHUB_SHA"
          mkdir -p "$domain_repo"
          cp -R "$GITHUB_WORKSPACE/examples/canonical-engineering/." "$domain_repo/"
          git -C "$domain_repo" init -b feature/canonical-smoke
          git -C "$domain_repo" config user.name 'Markitect Release CI'
          git -C "$domain_repo" config user.email 'markitect-release-ci@users.noreply.github.com'
          git -C "$domain_repo" add .
          git -C "$domain_repo" commit -m 'Create isolated canonical engineering fixture'
          go run .markitect/bootstrap/run.go reconcile --repo "$domain_repo" --action observe --adapter markitect-render
          mkdir -p "$domain_repo/.artifacts/markitect/reconcile"
          domain_plan="$domain_repo/.artifacts/markitect/reconcile/plan.yaml"
          go run .markitect/bootstrap/run.go reconcile --repo "$domain_repo" --action plan --adapter markitect-render > "$domain_plan"
          go run .markitect/bootstrap/run.go reconcile --repo "$domain_repo" --action apply --adapter markitect-render --plan "$domain_plan" --write
          go run .markitect/bootstrap/run.go reconcile --repo "$domain_repo" --action verify --adapter markitect-render --plan "$domain_plan"
          adapter_plan="$domain_repo/.artifacts/markitect/reconcile/dotnet-plan.yaml"
          go run .markitect/bootstrap/run.go reconcile --repo "$domain_repo" --action observe --adapter dotnet-dependencies
          go run .markitect/bootstrap/run.go reconcile --repo "$domain_repo" --action plan --adapter dotnet-dependencies > "$adapter_plan"
          go run .markitect/bootstrap/run.go reconcile --repo "$domain_repo" --action verify --adapter dotnet-dependencies --plan "$adapter_plan"
          init_dir="$RUNNER_TEMP/markitect-init-$GITHUB_SHA"
          git init -b feature/authoring "$init_dir"
          go run .markitect/bootstrap/run.go init --repo "$init_dir" --name started-project --namespace engineering
          test ! -e "$init_dir/markitect.yaml"
          go run .markitect/bootstrap/run.go init --repo "$init_dir" --name started-project --namespace engineering --write
          test -f "$init_dir/.markitect/areas/engineering/README.md"
          init_check="$(go run .markitect/bootstrap/run.go check --repo "$init_dir")"
          grep -Eq '^status: passed$' <<< "$init_check"

      - name: Replay selective adoption with packaged CLI (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          adoption_source="$RUNNER_TEMP/markitect-adoption-source-$GITHUB_SHA"
          adoption_binary="$RUNNER_TEMP/markitect-adoption-$GITHUB_SHA"
          mkdir "$adoption_source"
          unzip -q "$MARKITECT_PACKAGE_DIR/.markitect/tool/source.zip" -d "$adoption_source"
          (cd "$adoption_source" && go build -trimpath -buildvcs=false -o "$adoption_binary" ./src/cmd/markitect)
          MARKITECT_ADOPTION_BINARY="$adoption_binary" go test ./src/harness/examples -run '^TestSelectiveAdoptionCLI$' -count=1
          MARKITECT_POLICY_ANALYSIS_BINARY="$adoption_binary" go test ./src/internal/host/cli -run '^(TestPolicyFailureAnalysisCLIIsExplicitAndKeepsAcceptanceStrict|TestPolicyFailingWorkingTreeRejectsReconciliationAndWritersWithoutMutation|TestPolicyFailureAnalysisBlocksStructuralDiagnostics)$' -count=1
          artifact_binary="$RUNNER_TEMP/markitect-check-artifacts-$GITHUB_SHA"
          (cd "$adoption_source" && go build -trimpath -buildvcs=false -o "$artifact_binary" ./src/cmd/markitect-check-artifacts)
          "$artifact_binary" --repo "$GITHUB_WORKSPACE" --config markitect-artifacts.yaml

      - name: Replay selective adoption with packaged CLI (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $adoptionSource = Join-Path $env:RUNNER_TEMP "markitect-adoption-source-$env:GITHUB_SHA"
          $adoptionBinary = Join-Path $env:RUNNER_TEMP "markitect-adoption-$env:GITHUB_SHA.exe"
          Expand-Archive -LiteralPath (Join-Path $env:MARKITECT_PACKAGE_DIR '.markitect/tool/source.zip') -DestinationPath $adoptionSource
          Push-Location $adoptionSource
          try {
            go build -trimpath -buildvcs=false -o $adoptionBinary ./src/cmd/markitect
            if ($LASTEXITCODE -ne 0) { throw 'Packaged adoption CLI build failed' }
          } finally { Pop-Location }
          $env:MARKITECT_ADOPTION_BINARY = $adoptionBinary
          go test ./src/harness/examples -run '^TestSelectiveAdoptionCLI$' -count=1
          if ($LASTEXITCODE -ne 0) { throw 'Packaged selective adoption replay failed' }
          $env:MARKITECT_POLICY_ANALYSIS_BINARY = $adoptionBinary
          go test ./src/internal/host/cli -run '^(TestPolicyFailureAnalysisCLIIsExplicitAndKeepsAcceptanceStrict|TestPolicyFailingWorkingTreeRejectsReconciliationAndWritersWithoutMutation|TestPolicyFailureAnalysisBlocksStructuralDiagnostics)$' -count=1
          if ($LASTEXITCODE -ne 0) { throw 'Packaged policy failure analysis replay failed' }
          $artifactBinary = Join-Path $env:RUNNER_TEMP "markitect-check-artifacts-$env:GITHUB_SHA.exe"
          Push-Location $adoptionSource
          try {
            go build -trimpath -buildvcs=false -o $artifactBinary ./src/cmd/markitect-check-artifacts
            if ($LASTEXITCODE -ne 0) { throw 'Packaged artifact checker build failed' }
          } finally { Pop-Location }
          & $artifactBinary --repo $env:GITHUB_WORKSPACE --config markitect-artifacts.yaml
          if ($LASTEXITCODE -ne 0) { throw 'Packaged artifact checker dogfood failed' }

      - name: Test standalone bootstrap and packaged commands (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Push-Location $env:MARKITECT_PACKAGE_DIR
          go test .markitect/bootstrap/run.go .markitect/bootstrap/run_test.go
          if ($LASTEXITCODE -ne 0) { throw "Bootstrap tests failed with exit code $LASTEXITCODE" }
          $output = go run .markitect/bootstrap/run.go authoring
          if ($LASTEXITCODE -ne 0) { throw "Bootstrap authoring smoke failed with exit code $LASTEXITCODE" }
          if (($output -join "`n") -notmatch 'core/Skill/authoring') { throw 'Packaged binary omitted the embedded authoring Skill' }
          $notices = go run .markitect/bootstrap/run.go licenses
          if ($LASTEXITCODE -ne 0) { throw 'Packaged third-party notices failed' }
          if (($notices -join "`n") -notmatch 'Copyright 2009 The Go Authors.' -or ($notices -join "`n") -notmatch 'END OF TERMS AND CONDITIONS') { throw 'Packaged binary omitted third-party notices' }
          $example = Join-Path $env:GITHUB_WORKSPACE 'examples/minimal'
          $checkOutput = go run .markitect/bootstrap/run.go check --repo $example
          if ($LASTEXITCODE -ne 0) { throw "Bootstrap example check failed with exit code $LASTEXITCODE" }
          if (($checkOutput -join "`n") -notmatch '(?m)^status: passed$') { throw 'Packaged binary did not pass the minimal example check' }
          $adapterSource = Join-Path $env:RUNNER_TEMP "markitect-adapter-source-$env:GITHUB_SHA"
          $adapterBin = Join-Path $env:RUNNER_TEMP "markitect-adapter-bin-$env:GITHUB_SHA"
          New-Item -ItemType Directory -Path $adapterSource, $adapterBin -Force | Out-Null
          Expand-Archive -LiteralPath (Join-Path $env:MARKITECT_PACKAGE_DIR '.markitect/tool/source.zip') -DestinationPath $adapterSource
          Push-Location $adapterSource
          go build -trimpath -buildvcs=false -o (Join-Path $adapterBin 'markitect-adapter-dotnet.exe') ./src/cmd/markitect-adapter-dotnet
          if ($LASTEXITCODE -ne 0) { throw 'Could not build .NET reference adapter from packaged source' }
          Pop-Location
          $adapterBin >> $env:GITHUB_PATH
          $env:PATH = "$adapterBin;$env:PATH"
          $domainExample = Join-Path $env:GITHUB_WORKSPACE 'examples/canonical-engineering'
          $domainCheck = go run .markitect/bootstrap/run.go check --repo $domainExample
          if ($LASTEXITCODE -ne 0) { throw 'Packaged binary canonical engineering check failed' }
          if (($domainCheck -join "`n") -notmatch '(?m)^status: passed$') { throw 'Packaged binary did not pass the canonical engineering example check' }
          go run .markitect/bootstrap/run.go context --repo $domainExample --kind Skill --name architecture-review --namespace engineering
          if ($LASTEXITCODE -ne 0) { throw 'Packaged binary canonical engineering context failed' }
          go run .markitect/bootstrap/run.go model --repo $domainExample
          if ($LASTEXITCODE -ne 0) { throw 'Packaged binary canonical engineering model failed' }
          go run .markitect/bootstrap/run.go format --repo $domainExample
          if ($LASTEXITCODE -ne 0) { throw 'Packaged binary canonical engineering format failed' }
          $architectureExample = Join-Path $env:GITHUB_WORKSPACE 'examples/software-architecture'
          go run .markitect/bootstrap/run.go check --repo $architectureExample
          if ($LASTEXITCODE -ne 0) { throw 'Packaged binary software architecture check failed' }
          go run .markitect/bootstrap/run.go model --repo $architectureExample
          if ($LASTEXITCODE -ne 0) { throw 'Packaged binary software architecture model failed' }
          go run .markitect/bootstrap/run.go context --repo $architectureExample --namespace engineering --kind Skill --name implement-order
          if ($LASTEXITCODE -ne 0) { throw 'Packaged binary software architecture context failed' }
          go run .markitect/bootstrap/run.go format --repo $architectureExample
          if ($LASTEXITCODE -ne 0) { throw 'Packaged binary software architecture format failed' }
          $deliveryExample = Join-Path $env:GITHUB_WORKSPACE 'examples/delivery-target-equality'
          go run .markitect/bootstrap/run.go check --repo $deliveryExample
          if ($LASTEXITCODE -ne 0) { throw 'Packaged binary Delivery equality check failed' }
          go run .markitect/bootstrap/run.go model --repo $deliveryExample
          if ($LASTEXITCODE -ne 0) { throw 'Packaged binary Delivery equality model failed' }
          go run .markitect/bootstrap/run.go context --repo $deliveryExample --namespace engineering --kind Skill --name deployment-review
          if ($LASTEXITCODE -ne 0) { throw 'Packaged binary Delivery equality context failed' }
          go run .markitect/bootstrap/run.go format --repo $deliveryExample
          if ($LASTEXITCODE -ne 0) { throw 'Packaged binary Delivery equality format failed' }
          $domainRepo = Join-Path $env:RUNNER_TEMP "markitect-canonical-engineering-$env:GITHUB_SHA"
          New-Item -ItemType Directory -Path $domainRepo | Out-Null
          Get-ChildItem -LiteralPath $domainExample -Force | Copy-Item -Destination $domainRepo -Recurse -Force
          if ($LASTEXITCODE -ne 0) { throw 'Could not prepare canonical engineering reconciliation fixture' }
          git -C $domainRepo init -b feature/canonical-smoke
          if ($LASTEXITCODE -ne 0) { throw 'Could not initialize canonical engineering feature branch' }
          git -C $domainRepo config user.name 'Markitect Release CI'
          if ($LASTEXITCODE -ne 0) { throw 'Could not configure canonical engineering fixture identity' }
          git -C $domainRepo config user.email 'markitect-release-ci@users.noreply.github.com'
          if ($LASTEXITCODE -ne 0) { throw 'Could not configure canonical engineering fixture email' }
          git -C $domainRepo add .
          if ($LASTEXITCODE -ne 0) { throw 'Could not stage canonical engineering fixture' }
          git -C $domainRepo commit -m 'Create isolated canonical engineering fixture'
          if ($LASTEXITCODE -ne 0) { throw 'Could not commit canonical engineering fixture' }
          go run .markitect/bootstrap/run.go reconcile --repo $domainRepo --action observe --adapter markitect-render
          if ($LASTEXITCODE -ne 0) { throw 'Packaged binary canonical engineering observe failed' }
          $evidenceDir = Join-Path $domainRepo '.artifacts/markitect/reconcile'
          New-Item -ItemType Directory -Path $evidenceDir -Force | Out-Null
          $domainPlan = Join-Path $evidenceDir 'plan.yaml'
          go run .markitect/bootstrap/run.go reconcile --repo $domainRepo --action plan --adapter markitect-render | Set-Content -LiteralPath $domainPlan -Encoding utf8
          if ($LASTEXITCODE -ne 0) { throw 'Packaged binary canonical engineering plan failed' }
          go run .markitect/bootstrap/run.go reconcile --repo $domainRepo --action apply --adapter markitect-render --plan $domainPlan --write
          if ($LASTEXITCODE -ne 0) { throw 'Packaged binary canonical engineering apply failed' }
          go run .markitect/bootstrap/run.go reconcile --repo $domainRepo --action verify --adapter markitect-render --plan $domainPlan
          if ($LASTEXITCODE -ne 0) { throw 'Packaged binary canonical engineering verify failed' }
          $adapterPlan = Join-Path $evidenceDir 'dotnet-plan.yaml'
          go run .markitect/bootstrap/run.go reconcile --repo $domainRepo --action observe --adapter dotnet-dependencies
          if ($LASTEXITCODE -ne 0) { throw 'Packaged binary .NET adapter observe failed' }
          go run .markitect/bootstrap/run.go reconcile --repo $domainRepo --action plan --adapter dotnet-dependencies | Set-Content -LiteralPath $adapterPlan -Encoding utf8
          if ($LASTEXITCODE -ne 0) { throw 'Packaged binary .NET adapter plan failed' }
          go run .markitect/bootstrap/run.go reconcile --repo $domainRepo --action verify --adapter dotnet-dependencies --plan $adapterPlan
          if ($LASTEXITCODE -ne 0) { throw 'Packaged binary .NET adapter verify failed' }
          $initDir = Join-Path $env:RUNNER_TEMP "markitect-init-$env:GITHUB_SHA"
          git init -b feature/authoring $initDir
          if ($LASTEXITCODE -ne 0) { throw 'Could not initialize the smoke repository' }
          go run .markitect/bootstrap/run.go init --repo $initDir --name started-project --namespace engineering
          if ($LASTEXITCODE -ne 0) { throw 'Packaged initialization preview failed' }
          if (Test-Path (Join-Path $initDir 'markitect.yaml')) { throw 'Initialization preview changed the destination' }
          go run .markitect/bootstrap/run.go init --repo $initDir --name started-project --namespace engineering --write
          if ($LASTEXITCODE -ne 0) { throw 'Packaged initialization failed' }
          if (-not (Test-Path (Join-Path $initDir '.markitect/areas/engineering/README.md'))) { throw 'Default canonical area README is missing' }
          $initCheck = go run .markitect/bootstrap/run.go check --repo $initDir
          if ($LASTEXITCODE -ne 0) { throw 'Initialized project failed structural checks' }
          if (($initCheck -join "`n") -notmatch '(?m)^status: passed$') { throw 'Initialized project did not pass structural checks' }
          Pop-Location

  publish-source-artifact:
    name: Publish main source artifact
    needs:
      - quality
    if: ${{ success() && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Package pinned source and bootstrap files
        shell: bash
        run: |
          package_dir="$RUNNER_TEMP/markitect-source-$GITHUB_SHA"
          go run ./src/cmd/markitect package --repo . --output "$package_dir"
          mkdir -p "$package_dir/.markitect/bootstrap"
          cp integration/run-markitect.go "$package_dir/.markitect/bootstrap/run.go"
          cp integration/run-markitect_test.go "$package_dir/.markitect/bootstrap/run_test.go"

      - name: Upload commit-scoped source artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          include-hidden-files: true
          name: markitect-source-${{ github.sha }}
          path: ${{ runner.temp }}/markitect-source-${{ github.sha }}/
          if-no-files-found: error
          retention-days: 30
