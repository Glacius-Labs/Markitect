name: CI

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: '23 2 * * *'
  workflow_dispatch:
    inputs:
      windows:
        description: Also run the Windows job
        type: boolean
        default: true
  workflow_call:
    inputs:
      windows:
        description: Also run the Windows job
        type: boolean
        default: true

permissions:
  contents: read

# A new push cancels a pull request's running CI. Every other run, including
# each main commit, has its own group and always reaches a verdict.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    name: Quality (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.os == 'windows-latest' && 90 || 30 }}
    strategy:
      fail-fast: false
      matrix:
        # Linux is the pull-request and main gate (register DEC-013). Windows runs
        # nightly, on manual dispatch and in releases, and does not block merges.
        os: ${{ fromJSON((github.event_name == 'schedule' || inputs.windows) && '["ubuntu-24.04","windows-latest"]' || '["ubuntu-24.04"]') }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Verify module checksums
        run: go mod verify

      - name: Enforce Core, Module, Host and CLI import boundaries
        run: go test ./src/internal/tooling/architecture

      - name: Test
        shell: bash
        run: |
          # The event stream goes to a file; the live log shows each finished package.
          set +e
          go test ./... -count=1 -timeout=${{ matrix.os == 'windows-latest' && '60m' || '20m' }} -json | tee "$RUNNER_TEMP/go-test.json" | grep --line-buffered -E '"Action":"(pass|fail)","Package":"[^"]*","Elapsed"' | sed -u -E 's/.*"Action":"([a-z]+)","Package":"([^"]*)","Elapsed":([0-9.]+).*/\1 \3s \2/'
          status=${PIPESTATUS[0]}
          set -e
          report=0
          python -B scripts/go-test-report.py "$RUNNER_TEMP/go-test.json" --summary "$GITHUB_STEP_SUMMARY" --title "Go tests (${{ matrix.os }})" > "$RUNNER_TEMP/go-test-report.txt" || report=$?
          cat "$RUNNER_TEMP/go-test-report.txt"
          if [ "$status" -ne 0 ]; then exit "$status"; fi
          exit "$report"

      - name: Validate authoring benchmark fixtures
        run: go test ./src/internal/host -run '^$' -bench Authoring -benchtime=1x

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      - name: Verify modules
        run: go mod verify

      - name: Check Markitect-first dogfood project
        run: go run ./src/cmd/markitect-legacy check --repo . --revision ${{ github.sha }}

      - name: Check dogfood canonical formatting
        run: go run ./src/cmd/markitect-legacy format --repo .

      - name: Check managed artifact accounting
        run: go run ./src/cmd/markitect-check-artifacts --repo . --config markitect-artifacts.yaml

      - name: Check configured modules
        run: go run ./src/cmd/markitect-check-modules --repo . --hooks .markitect/modules/githooks.config --pipelines .markitect/modules/pipelines.config

      - name: Check Claude proposal adapter protocol
        run: python -B -m unittest discover -s src/internal/tooling/clauderunner

      - name: Check Codex proposal adapter protocol
        run: python -B -m unittest discover -s src/internal/tooling/codexrunner

      - name: Check Go formatting
        shell: bash
        run: |
          unformatted="$(gofmt -l $(git ls-files '*.go'))"
          if [ -n "$unformatted" ]; then echo "Run gofmt -w on these files:"; echo "$unformatted"; exit 1; fi

      - name: Compile fixed dogfood engineering context
        run: go run ./src/cmd/markitect-legacy context --repo . --revision ${{ github.sha }} --namespace development --kind Skill --name engineering-change

      - name: Verify fixed dogfood engineering state
        run: go run ./src/cmd/markitect-legacy verify --repo . --revision ${{ github.sha }}

      - name: Replay independent greenfield AI candidate bytes
        run: go test ./src/internal/host -run '^TestProjectionGreenfieldCandidatesConvergeAgainstIndependentEvidence$' -count=1

      - name: Verify fixed projection-first example
        shell: python {0}
        run: |
          import os, pathlib, shutil, subprocess
          root = pathlib.Path(os.environ["RUNNER_TEMP"]) / ("markitect-projection-" + os.environ["GITHUB_SHA"])
          shutil.copytree("examples/projection-first", root, symlinks=True)
          def git(*args):
              return subprocess.check_output(["git", "-C", str(root), *args], text=True).strip()
          git("init", "-b", "codex/projection-example")
          git("config", "user.name", "Markitect CI")
          git("config", "user.email", "markitect-ci@users.noreply.github.com")
          git("config", "core.autocrlf", "false")
          git("add", ".")
          git("commit", "-m", "Freeze projection example from " + os.environ["GITHUB_SHA"])
          revision = git("rev-parse", "HEAD")
          print("Projection fixture source=" + os.environ["GITHUB_SHA"] + " revision=" + revision, flush=True)
          subprocess.run(["go", "run", "./src/cmd/markitect-legacy", "projection", "--repo", str(root), "--action", "verify", "--config", "projections.config", "--coverage", "markitect-artifacts.yaml", "--revision", revision], check=True)

      - name: Check generated schemas
        run: go run ./src/cmd/markitect-legacy schema --repo .

      - name: Check canonical formatting
        run: go run ./src/cmd/markitect-legacy format --repo examples/minimal

      - name: Check minimal example
        run: go run ./src/cmd/markitect-legacy check --repo examples/minimal

      - name: Check repository layout example
        run: go run ./src/cmd/markitect-legacy check --repo examples/repository-layout

      - name: Check repository layout example formatting
        run: go run ./src/cmd/markitect-legacy format --repo examples/repository-layout

      - name: Check Markdown navigation example
        run: go run ./src/cmd/markitect-legacy check --repo examples/markdown-navigation

      - name: Check Markdown navigation example formatting
        run: go run ./src/cmd/markitect-legacy format --repo examples/markdown-navigation

      - name: Check versioned release benchmark fixture
        run: go run ./src/cmd/markitect-legacy check --repo benchmark/fixtures/v2

      - name: Check code and documentation example
        run: go run ./src/cmd/markitect-legacy check --repo examples/documentation

      - name: Check code and documentation example formatting
        run: go run ./src/cmd/markitect-legacy format --repo examples/documentation

      - name: Check onboarding example
        run: go run ./src/cmd/markitect-legacy check --repo examples/onboarding/delivery-service

      - name: Check onboarding example formatting
        run: go run ./src/cmd/markitect-legacy format --repo examples/onboarding/delivery-service

      - name: Check canonical engineering example
        run: go run ./src/cmd/markitect-legacy check --repo examples/canonical-engineering

      - name: Compile canonical engineering context
        run: go run ./src/cmd/markitect-legacy context --repo examples/canonical-engineering --kind Skill --name architecture-review --namespace engineering

      - name: Compile canonical engineering model
        run: go run ./src/cmd/markitect-legacy model --repo examples/canonical-engineering

      - name: Check canonical engineering formatting
        run: go run ./src/cmd/markitect-legacy format --repo examples/canonical-engineering

      - name: Check reusable engineering constitution
        run: go run ./src/cmd/markitect-legacy check --repo examples/engineering-constitution

      - name: Compile engineering constitution context
        run: go run ./src/cmd/markitect-legacy context --repo examples/engineering-constitution --namespace engineering --kind Skill --name add-order

      - name: Compile engineering constitution model
        run: go run ./src/cmd/markitect-legacy model --repo examples/engineering-constitution

      - name: Check engineering constitution formatting
        run: go run ./src/cmd/markitect-legacy format --repo examples/engineering-constitution

      - name: Check discovery workflow example
        run: go run ./src/cmd/markitect-legacy check --repo examples/engineering-discovery

      - name: Check discovery workflow formatting
        run: go run ./src/cmd/markitect-legacy format --repo examples/engineering-discovery

      - name: Check software architecture stress case
        run: go run ./src/cmd/markitect-legacy check --repo examples/software-architecture

      - name: Compile software architecture context
        run: go run ./src/cmd/markitect-legacy context --repo examples/software-architecture --namespace engineering --kind Skill --name implement-order

      - name: Compile software architecture model
        run: go run ./src/cmd/markitect-legacy model --repo examples/software-architecture

      - name: Check software architecture formatting
        run: go run ./src/cmd/markitect-legacy format --repo examples/software-architecture

      - name: Check Delivery target equality
        run: go run ./src/cmd/markitect-legacy check --repo examples/delivery-target-equality

      - name: Compile Delivery target equality model
        run: go run ./src/cmd/markitect-legacy model --repo examples/delivery-target-equality

      - name: Compile Delivery target equality context
        run: go run ./src/cmd/markitect-legacy context --repo examples/delivery-target-equality --namespace engineering --kind Skill --name deployment-review

      - name: Check Delivery target equality formatting
        run: go run ./src/cmd/markitect-legacy format --repo examples/delivery-target-equality

      - name: Check documentation placement example
        run: go run ./src/cmd/markitect-legacy check --repo examples/documentation-placement

      - name: Check documentation placement example formatting
        run: go run ./src/cmd/markitect-legacy format --repo examples/documentation-placement

      - name: Check pinned content package consumer
        run: go run ./src/cmd/markitect-legacy check --repo examples/package-consumer

      - name: Compile imported package context
        run: go run ./src/cmd/markitect-legacy context --repo examples/package-consumer --package review-guidance --namespace review --kind Workflow --name review-change

      - name: Compile consumer wrapper context
        run: go run ./src/cmd/markitect-legacy context --repo examples/package-consumer --namespace consumer --kind Skill --name local-review-entry

      - name: Check diff whitespace
        run: git diff --check

      - name: Smoke the packaged distribution
        run: go run ./tools/smoke -repo . -work "${{ runner.temp }}/smoke"

      - name: Test repository scripts
        run: python -B -m unittest discover -s scripts -p 'test_*.py'

      - name: Check maintained documentation links
        run: python -B scripts/check-docs.py

      - name: Upload Go test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          # One artifact per attempt: a re-run must not replace the results of
          # a failed attempt, or the flake report would never see the failure.
          name: go-test-${{ matrix.os }}-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/go-test.json
            ${{ runner.temp }}/go-test-report.txt
          if-no-files-found: warn
          retention-days: 14

  publish-source-artifact:
    name: Publish main source artifact
    needs:
      - quality
    if: ${{ success() && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Package pinned source and bootstrap files
        shell: bash
        run: |
          package_dir="$RUNNER_TEMP/markitect-source-$GITHUB_SHA"
          go run ./src/cmd/markitect-legacy package --repo . --output "$package_dir"
          mkdir -p "$package_dir/.markitect/bootstrap"
          cp integration/run-markitect.go "$package_dir/.markitect/bootstrap/run.go"
          cp integration/run-markitect_test.go "$package_dir/.markitect/bootstrap/run_test.go"

      - name: Upload commit-scoped source artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          include-hidden-files: true
          name: markitect-source-${{ github.sha }}
          path: ${{ runner.temp }}/markitect-source-${{ github.sha }}/
          if-no-files-found: error
          retention-days: 30
