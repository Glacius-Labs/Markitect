name: CI

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: '23 2 * * *'
  workflow_dispatch:
    inputs:
      windows:
        description: Also run the Windows job
        type: boolean
        default: true
  workflow_call:
    inputs:
      windows:
        description: Also run the Windows job
        type: boolean
        default: true

permissions:
  contents: read

# A new push cancels a pull request's running CI. Every other run, including
# each main commit, has its own group and always reaches a verdict.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    name: Quality (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.os == 'windows-latest' && 90 || 30 }}
    strategy:
      fail-fast: false
      matrix:
        # Linux is the pull-request and main gate (register DEC-013). Windows runs
        # nightly, on manual dispatch and in releases, and does not block merges.
        os: ${{ fromJSON((github.event_name == 'schedule' || inputs.windows) && '["ubuntu-24.04","windows-latest"]' || '["ubuntu-24.04"]') }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Verify module checksums
        run: go mod verify

      - name: Enforce Core, Module, Host and CLI import boundaries
        run: go test ./src/internal/tooling/architecture

      - name: Test
        shell: bash
        run: |
          # The event stream goes to a file; the live log shows each finished package.
          set +e
          go test ./... -count=1 -timeout=${{ matrix.os == 'windows-latest' && '60m' || '20m' }} -json | tee "$RUNNER_TEMP/go-test.json" | grep --line-buffered -E '"Action":"(pass|fail)","Package":"[^"]*","Elapsed"' | sed -u -E 's/.*"Action":"([a-z]+)","Package":"([^"]*)","Elapsed":([0-9.]+).*/\1 \3s \2/'
          status=${PIPESTATUS[0]}
          set -e
          report=0
          python -B scripts/go-test-report.py "$RUNNER_TEMP/go-test.json" --summary "$GITHUB_STEP_SUMMARY" --title "Go tests (${{ matrix.os }})" > "$RUNNER_TEMP/go-test-report.txt" || report=$?
          cat "$RUNNER_TEMP/go-test-report.txt"
          if [ "$status" -ne 0 ]; then exit "$status"; fi
          exit "$report"

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      - name: Verify modules
        run: go mod verify

      - name: Check the self-hosted project model
        shell: bash
        run: |
          # The full report goes to a file; a failure prints only its findings.
          report="$RUNNER_TEMP/project-check.json"
          go run ./src/cmd/markitect check --repo . --revision ${{ github.sha }} > "$report" || { grep -A3 '"code":' "$report" | head -n 200; exit 1; }

      - name: Check that the project model view is current
        if: runner.os == 'Linux'
        shell: python {0}
        run: |
          # The docs preview's digest is the SHA-256 of the view it would write.
          import hashlib, json, subprocess, sys
          sha = "${{ github.sha }}"
          view = json.loads(subprocess.run(["go", "run", "./src/cmd/markitect", "docs", "--repo", ".", "--revision", sha], check=True, stdout=subprocess.PIPE).stdout)
          committed = subprocess.run(["git", "show", sha + ":" + view["path"]], check=True, stdout=subprocess.PIPE).stdout
          if "sha256:" + hashlib.sha256(committed).hexdigest() != view["digest"]:
              sys.exit(view["path"] + " is stale; regenerate it with 'go run ./src/cmd/markitect docs --repo . --expect DIGEST --write' and commit it.")

      - name: Check full project artifact accounting
        run: go run ./src/cmd/markitect check --repo .

      - name: Check configured modules
        run: go run ./src/cmd/markitect-check-modules --repo . --hooks .markitect/modules/githooks.config --pipelines .markitect/modules/pipelines.config

      - name: Check Claude proposal adapter protocol
        run: python -B -m unittest discover -s src/internal/tooling/clauderunner

      - name: Check Codex proposal adapter protocol
        run: python -B -m unittest discover -s src/internal/tooling/codexrunner

      - name: Check Go formatting
        shell: bash
        run: |
          unformatted="$(gofmt -l $(git ls-files '*.go'))"
          if [ -n "$unformatted" ]; then echo "Run gofmt -w on these files:"; echo "$unformatted"; exit 1; fi

      - name: Check diff whitespace
        run: git diff --check

      - name: Smoke the packaged distribution
        run: go run ./tools/smoke -repo . -work "${{ runner.temp }}/smoke"

      - name: Test repository scripts
        run: python -B -m unittest discover -s scripts -p 'test_*.py'

      - name: Check maintained documentation links
        run: python -B scripts/check-docs.py

      - name: Check library oracle and bounded transport
        run: python -B -m unittest discover -s experiments/library-playground -p 'test_*.py'

      - name: Upload Go test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          # One artifact per attempt: a re-run must not replace the results of
          # a failed attempt, or the flake report would never see the failure.
          name: go-test-${{ matrix.os }}-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/go-test.json
            ${{ runner.temp }}/go-test-report.txt
          if-no-files-found: warn
          retention-days: 14

  race:
    # The suite under the race detector, in parallel with the quality job
    # (backlog CI-07). Linux only: -race needs cgo.
    name: Race detector (ubuntu-24.04)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Test with the race detector
        shell: bash
        run: |
          set +e
          go test -race ./... -count=1 -timeout=25m -json | tee "$RUNNER_TEMP/go-test.json" | grep --line-buffered -E '"Action":"(pass|fail)","Package":"[^"]*","Elapsed"' | sed -u -E 's/.*"Action":"([a-z]+)","Package":"([^"]*)","Elapsed":([0-9.]+).*/\1 \3s \2/'
          status=${PIPESTATUS[0]}
          set -e
          report=0
          python -B scripts/go-test-report.py "$RUNNER_TEMP/go-test.json" --summary "$GITHUB_STEP_SUMMARY" --title "Go tests with -race (ubuntu-24.04)" > "$RUNNER_TEMP/go-test-report.txt" || report=$?
          cat "$RUNNER_TEMP/go-test-report.txt"
          if grep -q 'WARNING: DATA RACE' "$RUNNER_TEMP/go-test.json"; then echo "::error::The race detector reported a data race; see the failed tests above."; fi
          if [ "$status" -ne 0 ]; then exit "$status"; fi
          exit "$report"

      - name: Upload Go test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: go-test-ubuntu-24.04-race-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/go-test.json
            ${{ runner.temp }}/go-test-report.txt
          if-no-files-found: warn
          retention-days: 14

  publish-source-artifact:
    name: Publish main source artifact
    needs:
      - quality
      - race
    if: ${{ success() && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Package pinned source and bootstrap files
        shell: bash
        run: |
          package_dir="$RUNNER_TEMP/markitect-source-$GITHUB_SHA"
          go run ./src/cmd/markitect-release package --repo . --output "$package_dir"
          mkdir -p "$package_dir/.markitect/bootstrap"
          cp integration/run-markitect.go "$package_dir/.markitect/bootstrap/run.go"
          cp integration/run-markitect_test.go "$package_dir/.markitect/bootstrap/run_test.go"

      - name: Upload commit-scoped source artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          include-hidden-files: true
          name: markitect-source-${{ github.sha }}
          path: ${{ runner.temp }}/markitect-source-${{ github.sha }}/
          if-no-files-found: error
          retention-days: 30
