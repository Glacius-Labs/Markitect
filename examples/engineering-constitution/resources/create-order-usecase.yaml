apiVersion: engineering.markitect.org/v1alpha1
kind: UseCase
metadata:
    name: create-order
    namespace: engineering
spec:
    extensions:
        - kind: Authorizer
          name: order-write-authorization
          namespace: engineering
    handlers:
        - kind: Handler
          name: create-order-handler
          namespace: engineering
    intent: Command
    module:
        kind: Module
        name: orders
        namespace: engineering
    summary: Validate and accept a customer order.
    validators: []
