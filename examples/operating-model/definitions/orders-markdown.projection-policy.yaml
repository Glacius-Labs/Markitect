apiVersion: markitect.foundation/v1
kind: ProjectionPolicy
metadata:
  namespace: operating-model
  name: orders-markdown
purpose: Defines the Orders facts to preserve in the Markdown operating model.
spec:
  sourceKind:
    apiVersion: commerce.operating-model/v1
    kind: OrderRules
  targetTechnology: markdown
  guidance: >
    State the positive-quantity and nonnegative-unit-price conditions, the
    checked cents total, and the false-with-zero result for invalid input or
    overflow. Preserve the source Definition's Orders ownership.
