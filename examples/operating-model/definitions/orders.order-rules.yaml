apiVersion: commerce.operating-model/v1
kind: OrderRules
metadata:
  namespace: orders
  name: accepted-order-total
purpose: >
  The pure Orders operation succeeds only when quantity is positive and
  unitPriceCents is nonnegative. On success it returns their product when the
  product fits in a signed 64-bit integer. On invalid input or overflow it
  returns false and sets totalCents to zero.
spec: {}
