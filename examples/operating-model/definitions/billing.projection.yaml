apiVersion: markitect.foundation/v1
kind: Projection
metadata:
  namespace: operating-model
  name: billing-dotnet
purpose: Represents the independent Billing query in its .NET target root.
spec:
  source:
    definitions:
      - apiVersion: commerce.operating-model/v1
        kind: BillingQuery
        namespace: billing
        name: outstanding-order-total
  representation: dotnet
  target:
    repository: .
    path: src/Billing/
  policies:
    - apiVersion: markitect.foundation/v1
      kind: ProjectionPolicy
      namespace: operating-model
      name: billing-dotnet
