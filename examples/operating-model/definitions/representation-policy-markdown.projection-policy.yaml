apiVersion: markitect.foundation/v1
kind: ProjectionPolicy
metadata:
  namespace: operating-model
  name: representation-policy-markdown
purpose: Documents selected canonical representation contracts without creating a second API owner.
spec:
  sourceKind:
    apiVersion: markitect.foundation/v1
    kind: ProjectionPolicy
  targetTechnology: markdown
  guidance: >
    Represent each selected ProjectionPolicy as the canonical owner of its
    target-specific public API contract. Preserve its exact identity, purpose,
    source Kind, target technology and guidance so readers can find the declared
    API identifiers and behavior. Do not infer those contracts from generated
    implementation files or treat this documentation as their canonical owner.
