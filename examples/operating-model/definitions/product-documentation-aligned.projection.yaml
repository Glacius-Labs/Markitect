apiVersion: markitect.foundation/v1
kind: Projection
metadata:
  namespace: operating-model
  name: product-markdown
purpose: Represents ProductComposition, its exact child scopes and their canonical public API policies in Markdown.
spec:
  source:
    definitions:
      - apiVersion: commerce.operating-model/v1
        kind: ProductComposition
        namespace: commerce
        name: orders-and-billing
      - apiVersion: commerce.operating-model/v1
        kind: OrderRules
        namespace: orders
        name: accepted-order-total
      - apiVersion: commerce.operating-model/v1
        kind: BillingQuery
        namespace: billing
        name: outstanding-order-total
      - apiVersion: markitect.foundation/v1
        kind: ProjectionPolicy
        namespace: operating-model
        name: orders-dotnet
      - apiVersion: markitect.foundation/v1
        kind: ProjectionPolicy
        namespace: operating-model
        name: billing-dotnet
  representation: markdown
  target:
    repository: .
    path: docs/represented/
  policies:
    - apiVersion: markitect.foundation/v1
      kind: ProjectionPolicy
      namespace: operating-model
      name: orders-markdown
    - apiVersion: markitect.foundation/v1
      kind: ProjectionPolicy
      namespace: operating-model
      name: billing-markdown
    - apiVersion: markitect.foundation/v1
      kind: ProjectionPolicy
      namespace: operating-model
      name: product-markdown
    - apiVersion: markitect.foundation/v1
      kind: ProjectionPolicy
      namespace: operating-model
      name: representation-policy-markdown
