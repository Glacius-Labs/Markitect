apiVersion: markitect.foundation/v1
kind: ProjectionPolicy
metadata:
  namespace: operating-model
  name: product-markdown
purpose: Defines the product-level Markdown composition to preserve.
spec:
  sourceKind:
    apiVersion: commerce.operating-model/v1
    kind: ProductComposition
  targetTechnology: markdown
  guidance: >
    Show the explicit Orders-to-Billing relationship: pass the total from an
    accepted order into the Billing outstanding-total query together with
    prior open amounts. Keep the two child Definitions visibly independent.
