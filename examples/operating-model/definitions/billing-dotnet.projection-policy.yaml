apiVersion: markitect.foundation/v1
kind: ProjectionPolicy
metadata:
  namespace: operating-model
  name: billing-dotnet
purpose: Defines the Billing public .NET operation expected by this Project's check.
spec:
  sourceKind:
    apiVersion: commerce.operating-model/v1
    kind: BillingQuery
  targetTechnology: dotnet
  guidance: >
    Expose public static class OperatingModel.Billing.BillingQuery with public
    static long SumOutstandingCents(IEnumerable<long> amounts). It returns zero
    for an empty sequence, rejects negative amounts and uses checked signed
    64-bit addition. This is an API contract, not a filename or implementation
    template.
