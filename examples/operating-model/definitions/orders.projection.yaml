apiVersion: markitect.foundation/v1
kind: Projection
metadata:
  namespace: operating-model
  name: orders-dotnet
purpose: Represents the independent Orders rule in its .NET target root.
spec:
  source:
    definitions:
      - apiVersion: commerce.operating-model/v1
        kind: OrderRules
        namespace: orders
        name: accepted-order-total
  representation: dotnet
  target:
    repository: .
    path: src/Orders/
  policies:
    - apiVersion: markitect.foundation/v1
      kind: ProjectionPolicy
      namespace: operating-model
      name: orders-dotnet
