apiVersion: markitect.foundation/v1
kind: ProjectionPolicy
metadata:
  namespace: operating-model
  name: billing-markdown
purpose: Defines the Billing facts to preserve in the Markdown operating model.
spec:
  sourceKind:
    apiVersion: commerce.operating-model/v1
    kind: BillingQuery
  targetTechnology: markdown
  guidance: >
    State that the outstanding-total query returns zero for empty input, rejects
    negative amounts and uses checked signed 64-bit addition. Preserve the
    source Definition's Billing ownership.
