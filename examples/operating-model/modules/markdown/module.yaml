apiVersion: markitect.example.org/module/v1alpha1
name: operating-model-markdown
version: 1.0.0
type: projection
purpose: Registers bounded Markdown representation guidance for project-selected Definitions.
requires:
  core: "1"
  modules: []
provides:
  schemas: []
  projectors:
    - id: operating-model-markdown-docs
      version: 1.0.0
      target: markdown
      allKinds: true
      allowedRoots:
        - docs/represented/
      guidance: >
        Document only the selected canonical Definitions, including their
        explicit composition links and applicable ProjectionPolicies. Choose
        Markdown filenames from the representation; preserve each source
        Definition as the sole owner of its meaning. Escalate ambiguous or
        conflicting source intent and return a candidate for independent
        verification.
