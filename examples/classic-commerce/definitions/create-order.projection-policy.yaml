apiVersion: markitect.foundation/v1
kind: ProjectionPolicy
metadata:
  namespace: commerce
  name: use-case-to-dotnet
purpose: Guides the representation of commerce use cases in the selected .NET target.
spec:
  sourceKind:
    apiVersion: commerce.example.org/v1
    kind: UseCase
  targetTechnology: dotnet
  guidance: >
    Preserve externally visible behavior and keep application orchestration
    separate from persistence details. Represent this finite example as
    Commerce.Application.CreateOrderHandler with decimal Handle(int quantity,
    decimal unitPrice). Enforce the business behavior declared by the selected
    UseCase purpose, including its invalid-input exceptions and decimal
    arithmetic. No persistence or external service is needed.
