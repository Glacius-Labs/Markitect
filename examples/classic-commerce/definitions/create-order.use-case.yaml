apiVersion: commerce.example.org/v1
kind: UseCase
metadata:
  namespace: commerce
  name: create-order
purpose: >
  Creates an order total from a positive integer quantity and a non-negative
  decimal unit price. Returns quantity multiplied by unit price. Rejects zero
  or negative quantity and negative unit price with ArgumentOutOfRangeException.
spec:
  handledBy:
    apiVersion: commerce.example.org/v1
    kind: Handler
    namespace: commerce
    name: create-order-handler
