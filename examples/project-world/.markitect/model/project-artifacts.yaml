apiVersion: project.markitect.example.org/v1alpha1
kind: Artifact
metadata:
  name: repository-readme
  namespace: ""
purpose: Maintains the repository-level guide for the runnable Shop fixture.
spec:
  role: documentation
  realizes:
    - namespace: ""
      name: repository-overview
  paths:
    - README.md
  checks:
    - namespace: engineering
      name: readme-guide
  required: true
  reason: Contributors need a precise guide to the fixture and the CLI behavior it demonstrates.
