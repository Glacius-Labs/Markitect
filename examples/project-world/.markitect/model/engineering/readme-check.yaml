apiVersion: project.markitect.example.org/v1alpha1
kind: Check
metadata:
  name: readme-guide
  namespace: engineering
purpose: Confirms that the repository guide names only existing fixture paths, covers every Shop slice and keeps its no-provider promise.
spec:
  command:
    - python
    - -B
    - -m
    - unittest
    - tests.test_readme
    - -v
  uses:
    - namespace: ""
      name: repository-overview
  limitation: This checks named paths, slice coverage and two fixed promises; it does not review the guide's prose for accuracy or completeness.
