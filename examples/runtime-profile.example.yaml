apiVersion: markitect.runtime/v1
agentProfiles:
  markitect-agent:
    codexAppServer:
      profileVersion: 3
      engineExecutable: ENGINE_EXECUTABLE
      imageID: IMAGE_ID
      agentdVersion: AGENTD_BUILD
      recordedCodexSchemaDigest: CODEX_SCHEMA_DIGEST
      instructions: []
      credentialRef: example-account
      maxWireBytes: 1048576
      session:
        version: 1
        model: ACCOUNT_MODEL
        effort: high
        baseInstructions: ''
        developerInstructions: ''
        store: markitect-example
        cpus: 1
        memoryBytes: 2147483648
        pids: 192
        tmpBytes: 268435456
        network: ''
checkProfiles:
  go:
    container:
      profileVersion: 1
      engineExecutable: ENGINE_EXECUTABLE
      imageID: IMAGE_ID
      executable: /usr/local/go/bin/go
      argumentPrefix: []
      env:
        - GOTOOLCHAIN=local
        - GOCACHE=/home/agent/.cache/go-build
        - GOTMPDIR=/home/agent
      limits:
        milliCPUs: 1000
        memoryBytes: 2147483648
        processes: 64
      maxOutputBytes: 1048576
