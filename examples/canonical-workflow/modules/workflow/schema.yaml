apiVersion: workflow.example.org/v1
purpose: A project-owned vocabulary for describing an operational workflow and its guidance.
kinds:
  Rule:
    purpose: States a project-owned constraint relevant to workflow behavior.
    properties:
      statement:
        purpose: The canonical rule statement.
        type: string
        minCount: 1
        maxCount: 1
  Process:
    purpose: Describes a workflow process and its explicit related guidance.
    properties:
      rule:
        purpose: The rule associated with this process.
        type: reference
        minCount: 1
        maxCount: 1
        target:
          apiVersion: workflow.example.org/v1
          kind: Rule
      responsibility:
        purpose: The responsibility associated with this process.
        type: reference
        minCount: 1
        maxCount: 1
        target:
          apiVersion: workflow.example.org/v1
          kind: Responsibility
      gate:
        purpose: The gate associated with this process.
        type: reference
        minCount: 1
        maxCount: 1
        target:
          apiVersion: workflow.example.org/v1
          kind: Gate
      sequence:
        purpose: Ordered human-readable process steps.
        type: string
        minCount: 1
        maxCount: unbounded
  Responsibility:
    purpose: Identifies an accountable role or party for workflow work.
    properties:
      accountableParty:
        purpose: The project-defined role accountable for the process.
        type: string
        minCount: 1
        maxCount: 1
  Gate:
    purpose: States a review condition that controls workflow progression.
    properties:
      condition:
        purpose: The project-defined condition to satisfy before progression.
        type: string
        minCount: 1
        maxCount: 1
