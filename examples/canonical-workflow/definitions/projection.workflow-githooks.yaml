apiVersion: markitect.foundation/v1
kind: Projection
metadata:
  namespace: example
  name: workflow-githooks
purpose: Materializes the canonical workflow as a Git hooks representation.
spec:
  representation: githooks
  source:
    definitions:
      - apiVersion: workflow.example.org/v1
        kind: Rule
        namespace: example
        name: retain-source-authority
      - apiVersion: workflow.example.org/v1
        kind: Process
        namespace: example
        name: review-workflow-change
      - apiVersion: workflow.example.org/v1
        kind: Responsibility
        namespace: example
        name: workflow-owner
      - apiVersion: workflow.example.org/v1
        kind: Gate
        namespace: example
        name: source-review
  target:
    repository: .
    path: .githooks/
  policies:
    - apiVersion: markitect.foundation/v1
      kind: ProjectionPolicy
      namespace: example
      name: policy.rule-to-githooks
    - apiVersion: markitect.foundation/v1
      kind: ProjectionPolicy
      namespace: example
      name: policy.process-to-githooks
    - apiVersion: markitect.foundation/v1
      kind: ProjectionPolicy
      namespace: example
      name: policy.responsibility-to-githooks
    - apiVersion: markitect.foundation/v1
      kind: ProjectionPolicy
      namespace: example
      name: policy.gate-to-githooks
