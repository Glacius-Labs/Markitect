apiVersion: markitect.foundation/v1
kind: ProjectionPolicy
metadata:
  namespace: example
  name: policy.process-to-githooks
purpose: Expresses the Process in the githooks target.
spec:
  sourceKind:
    apiVersion: workflow.example.org/v1
    kind: Process
  targetTechnology: githooks
  guidance: >
    Preserve the project-defined workflow step order and render only the explicitly selected source.
