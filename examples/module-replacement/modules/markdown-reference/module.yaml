apiVersion: markitect.example.org/module/v1alpha1
name: markitect-markdown-reference
version: 1.0.0
type: projection
purpose: Registers an independent canonical Markdown reference-bundle target.
requires:
  core: "1"
  modules: []
provides:
  schemas: []
  projectors:
    - id: markdown-reference
      version: 1.0.0
      target: markdown
      allKinds: true
      allowedRoots:
        - docs/represented/
      guidance: >
        Emit a compact machine-readable Markdown reference bundle with separately
        marked JSON blocks. Preserve every selected Schema contract, exact Definition
        identity, purpose, spec, and selected ProjectionPolicy. Use only supplied
        canonical meaning and never claim acceptance.
