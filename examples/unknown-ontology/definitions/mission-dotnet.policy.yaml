apiVersion: markitect.foundation/v1
kind: ProjectionPolicy
metadata:
  namespace: unknown-ontology
  name: mission-dotnet
purpose: Defines the public .NET Mission value and capability decision expected for this target.
spec:
  sourceKind:
    apiVersion: public-mission.example.org/v1
    kind: Mission
  targetTechnology: dotnet
  guidance: >
    Place the public target types in namespace UnknownOntology.
    Expose public sealed record Mission(string Name, string EffectAxisName, string CapabilityName, string RequestedUnit, long RequestedMagnitude) and public static class MissionEvaluator with public static bool IsSupported(Mission mission, EffectAxis axis, Capability capability). Return true exactly when mission.EffectAxisName equals axis.Name, mission.CapabilityName equals capability.Name, capability.EffectAxisName equals axis.Name, mission.RequestedUnit equals axis.Unit using ordinal case-sensitive comparison, axis.MinimumMagnitude <= mission.RequestedMagnitude <= axis.MaximumMagnitude, and mission.RequestedMagnitude <= capability.MaximumMagnitude. Otherwise return false. This is target behavior, not a filename or implementation template.