apiVersion: public-mission.example.org/v1
kind: Mission
metadata:
  namespace: mission-planning
  name: daily-reflection
purpose: Request five minutes of focused reflection using the guided-focus capability.
spec:
  effectAxis:
    apiVersion: public-mission.example.org/v1
    kind: EffectAxis
    namespace: mission-planning
    name: focus-duration
  capability:
    apiVersion: public-mission.example.org/v1
    kind: Capability
    namespace: mission-planning
    name: guided-focus
  requestedUnit: minutes
  requestedMagnitude: 5