apiVersion: markitect.example.org/v1alpha1
kind: Domain
metadata:
    name: software
spec:
    apiVersion: software.markitect.org/v1alpha1
    kinds:
        Core:
            required:
                - purpose
            properties:
                purpose:
                    type: string
        Interface:
            required:
                - summary
            properties:
                summary:
                    type: string
        Module:
            required:
                - layer
            properties:
                dependsOn:
                    type: array
                    items:
                        type: ref
                layer:
                    type: string
                    enum:
                        - application
                owns:
                    type: array
                    items:
                        type: ref
        UseCase:
            required:
                - summary
            properties:
                summary:
                    type: string
    relations:
        dependsOn:
            description: Runtime or design dependency that contributes context and invalidates dependent checks.
            field: dependsOn
            sourceKinds:
                - Module
            targetKinds:
                - Module
                - Core
            context: true
            invalidate: true
            acyclic: true
        owns:
            description: Structural ownership used for navigation and ownership checks.
            field: owns
            sourceKinds:
                - Module
            targetKinds:
                - UseCase
                - Interface
            invalidate: true
    constraints:
        - name: application-modules-use-core
          description: Application modules are subject to this declared dependency-target rule.
          select:
            kind: Module
            labels:
                layer: application
          assert:
            op: allowed-targets
            relation: dependsOn
            values:
                - Core
