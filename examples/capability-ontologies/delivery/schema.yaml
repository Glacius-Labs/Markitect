apiVersion: delivery.example.org/v1
purpose: Describes deployments, environments and rollout intent.
kinds:
  Deployment:
    purpose: Selects a service deployment and its capacity.
    properties:
      service: {purpose: Names the deployed service., type: string, minCount: 1, maxCount: 1}
      environment: {purpose: Selects the environment., type: enum, minCount: 1, maxCount: 1, values: [development, staging, production]}
      replicas: {purpose: Declares the requested instance count., type: integer, minCount: 1, maxCount: 1}
  Rollout:
    purpose: Describes introduction of one deployment.
    properties:
      deployment: {purpose: Identifies the target deployment., type: reference, minCount: 1, maxCount: 1, target: {apiVersion: delivery.example.org/v1, kind: Deployment}}
      strategy: {purpose: Selects the rollout procedure., type: enum, minCount: 1, maxCount: 1, values: [rolling, blue-green]}
      approvalRequired: {purpose: Records whether an approval step is required., type: boolean, minCount: 1, maxCount: 1}
