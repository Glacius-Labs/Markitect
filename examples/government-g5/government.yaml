{
  "apiVersion": "markitect.government-source/v1alpha1",
  "kind": "GovernmentSource",
  "constitution": {"apiVersion":"markitect.government/v1alpha1","kind":"Constitution","namespace":"invoice","name":"active"},
  "schemas": [{
    "apiVersion":"markitect.government-example/v1alpha1",
    "purpose":"Requirements for a small invoice and its independently owned receipt format.",
    "kinds":{"Requirement":{"purpose":"A required invoice or receipt behavior.","properties":{
      "statement":{"purpose":"Normative observable behavior.","type":"string","minCount":1,"maxCount":1},
      "acceptance":{"purpose":"Deterministic acceptance condition.","type":"string","minCount":1,"maxCount":1}
    }}}
  }],
  "definitions": [
    {"apiVersion":"markitect.government-example/v1alpha1","kind":"Requirement","metadata":{"namespace":"invoice","name":"delivery-rule"},"purpose":"Defines how a published delivery charge participates in the invoice total.","spec":{"statement":"The invoice total equals quantity multiplied by unit price; delivery is included without a separate charge.","acceptance":"The current integration check expects total=units*unitPrice."}},
    {"apiVersion":"markitect.government-example/v1alpha1","kind":"Requirement","metadata":{"namespace":"invoice","name":"published-delivery"},"purpose":"The existing publisher sets delivery to exactly two whole currency units.","spec":{"statement":"The active published delivery charge is exactly 2 whole currency units.","acceptance":"delivery/rate.txt contains charge=2."}},
    {"apiVersion":"markitect.government-example/v1alpha1","kind":"Requirement","metadata":{"namespace":"invoice","name":"protected-total"},"purpose":"Protected root goal that the final invoice total is correct.","spec":{"statement":"The displayed invoice total is the amount the customer owes.","acceptance":"The active root goal and its protection are unchanged by delegated work."}},
    {"apiVersion":"markitect.government-example/v1alpha1","kind":"Requirement","metadata":{"namespace":"receipt","name":"receipt-format"},"purpose":"Defines the stable serialization label for an issued receipt.","spec":{"statement":"Receipts use the plain-v1 format label.","acceptance":"independent/receipt.txt contains format=plain-v1."}},
    {"apiVersion":"markitect.government/v1alpha1","kind":"Area","metadata":{"namespace":"invoice","name":"root"},"purpose":"Owns invoice integration and the small independent receipt task.","spec":{"capabilities":[]}},
    {"apiVersion":"markitect.government/v1alpha1","kind":"Mandate","metadata":{"namespace":"invoice","name":"root-prior"},"purpose":"Prior authority for invoice behavior, protected goal review, and independent receipt implementation.","spec":{"area":{"apiVersion":"markitect.government/v1alpha1","kind":"Area","namespace":"invoice","name":"root"},"scope":[
      {"apiVersion":"markitect.government-example/v1alpha1","kind":"Requirement","namespace":"invoice","name":"delivery-rule"},
      {"apiVersion":"markitect.government-example/v1alpha1","kind":"Requirement","namespace":"invoice","name":"published-delivery"},
      {"apiVersion":"markitect.government-example/v1alpha1","kind":"Requirement","namespace":"invoice","name":"protected-total"},
      {"apiVersion":"markitect.government-example/v1alpha1","kind":"Requirement","namespace":"receipt","name":"receipt-format"}
    ],"actions":["implement","review","amend-model"]}},
    {"apiVersion":"markitect.government/v1alpha1","kind":"Ressort","metadata":{"namespace":"invoice","name":"arithmetic"},"purpose":"Reviews arithmetic and invoice realization behavior.","spec":{"mandate":{"apiVersion":"markitect.government/v1alpha1","kind":"Mandate","namespace":"invoice","name":"root-prior"}}},
    {"apiVersion":"markitect.government/v1alpha1","kind":"Ressort","metadata":{"namespace":"invoice","name":"unaffected"},"purpose":"Explicitly records when an invoice proposal does not affect receipt-format policy.","spec":{"mandate":{"apiVersion":"markitect.government/v1alpha1","kind":"Mandate","namespace":"invoice","name":"root-prior"}}},
    {"apiVersion":"markitect.government/v1alpha1","kind":"Constitution","metadata":{"namespace":"invoice","name":"active"},"purpose":"Prior active model and complete frozen authority for this bounded fixture.","spec":{"root":{"apiVersion":"markitect.government/v1alpha1","kind":"Area","namespace":"invoice","name":"root"},"cabinet":[
      {"apiVersion":"markitect.government/v1alpha1","kind":"Ressort","namespace":"invoice","name":"arithmetic"},
      {"apiVersion":"markitect.government/v1alpha1","kind":"Ressort","namespace":"invoice","name":"unaffected"}
    ],"approval":"unanimous-explicit-assent","protectedSubjects":[{"apiVersion":"markitect.government-example/v1alpha1","kind":"Requirement","namespace":"invoice","name":"protected-total"}]}},
    {"apiVersion":"markitect.government/v1alpha1","kind":"Responsibility","metadata":{"namespace":"invoice","name":"delivery-owner"},"purpose":"Root remains accountable for the delivery-rule requirement.","spec":{"subject":{"apiVersion":"markitect.government-example/v1alpha1","kind":"Requirement","namespace":"invoice","name":"delivery-rule"},"area":{"apiVersion":"markitect.government/v1alpha1","kind":"Area","namespace":"invoice","name":"root"}}},
    {"apiVersion":"markitect.government/v1alpha1","kind":"Responsibility","metadata":{"namespace":"invoice","name":"published-delivery-owner"},"purpose":"Root remains accountable for the exact published delivery amount.","spec":{"subject":{"apiVersion":"markitect.government-example/v1alpha1","kind":"Requirement","namespace":"invoice","name":"published-delivery"},"area":{"apiVersion":"markitect.government/v1alpha1","kind":"Area","namespace":"invoice","name":"root"}}},
    {"apiVersion":"markitect.government/v1alpha1","kind":"Responsibility","metadata":{"namespace":"invoice","name":"protected-owner"},"purpose":"Root is accountable for protecting the customer amount goal.","spec":{"subject":{"apiVersion":"markitect.government-example/v1alpha1","kind":"Requirement","namespace":"invoice","name":"protected-total"},"area":{"apiVersion":"markitect.government/v1alpha1","kind":"Area","namespace":"invoice","name":"root"}}},
    {"apiVersion":"markitect.government/v1alpha1","kind":"Responsibility","metadata":{"namespace":"invoice","name":"receipt-owner"},"purpose":"Root is accountable for the independent receipt label.","spec":{"subject":{"apiVersion":"markitect.government-example/v1alpha1","kind":"Requirement","namespace":"receipt","name":"receipt-format"},"area":{"apiVersion":"markitect.government/v1alpha1","kind":"Area","namespace":"invoice","name":"root"}}},
    {"apiVersion":"markitect.government/v1alpha1","kind":"Artifact","metadata":{"namespace":"invoice","name":"government-source"},"purpose":"Canonical Government model source used to assess and compile the active Constitution.","spec":{"path":"government.yaml","class":"canonical","writer":{"apiVersion":"markitect.government/v1alpha1","kind":"Area","namespace":"invoice","name":"root"}}},
    {"apiVersion":"markitect.government/v1alpha1","kind":"Artifact","metadata":{"namespace":"invoice","name":"protected-goal-record"},"purpose":"Separate realization record for the protected root customer amount goal.","spec":{"path":"invoice/protected-goal.txt","class":"realization","writer":{"apiVersion":"markitect.government/v1alpha1","kind":"Area","namespace":"invoice","name":"root"}}},
    {"apiVersion":"markitect.government/v1alpha1","kind":"Artifact","metadata":{"namespace":"invoice","name":"delivery-rate"},"purpose":"Published delivery charge read by invoice composition.","spec":{"path":"delivery/rate.txt","class":"realization","writer":{"apiVersion":"markitect.government/v1alpha1","kind":"Area","namespace":"invoice","name":"root"}}},
    {"apiVersion":"markitect.government/v1alpha1","kind":"Artifact","metadata":{"namespace":"invoice","name":"invoice-source"},"purpose":"Executable arithmetic that realizes the delivery and total requirements.","spec":{"path":"invoice/invoice.go","class":"realization","writer":{"apiVersion":"markitect.government/v1alpha1","kind":"Area","namespace":"invoice","name":"root"}}},
    {"apiVersion":"markitect.government/v1alpha1","kind":"Artifact","metadata":{"namespace":"invoice","name":"invoice-check"},"purpose":"Deterministic integration acceptance check for the active delivery rule.","spec":{"path":"invoice/invoice_test.go","class":"realization","writer":{"apiVersion":"markitect.government/v1alpha1","kind":"Area","namespace":"invoice","name":"root"}}},
    {"apiVersion":"markitect.government/v1alpha1","kind":"Artifact","metadata":{"namespace":"receipt","name":"receipt-file"},"purpose":"Concrete receipt serialization label, separate from invoice dependencies.","spec":{"path":"independent/receipt.txt","class":"realization","writer":{"apiVersion":"markitect.government/v1alpha1","kind":"Area","namespace":"invoice","name":"root"}}},
    {"apiVersion":"markitect.government/v1alpha1","kind":"Realization","metadata":{"namespace":"invoice","name":"delivery-implementation"},"purpose":"Invoice source implements the active delivery rule.","spec":{"subject":{"apiVersion":"markitect.government-example/v1alpha1","kind":"Requirement","namespace":"invoice","name":"delivery-rule"},"artifact":{"apiVersion":"markitect.government/v1alpha1","kind":"Artifact","namespace":"invoice","name":"invoice-source"},"role":"Calculates the invoice total from units and unit price."}},
    {"apiVersion":"markitect.government/v1alpha1","kind":"Realization","metadata":{"namespace":"invoice","name":"delivery-rule-source"},"purpose":"Canonical Government source declares the delivery-rule domain requirement.","spec":{"subject":{"apiVersion":"markitect.government-example/v1alpha1","kind":"Requirement","namespace":"invoice","name":"delivery-rule"},"artifact":{"apiVersion":"markitect.government/v1alpha1","kind":"Artifact","namespace":"invoice","name":"government-source"},"role":"Declares the active delivery rule in the source model."}},
    {"apiVersion":"markitect.government/v1alpha1","kind":"Realization","metadata":{"namespace":"invoice","name":"delivery-acceptance"},"purpose":"The integration test checks the active delivery rule against actual model and rate bytes.","spec":{"subject":{"apiVersion":"markitect.government-example/v1alpha1","kind":"Requirement","namespace":"invoice","name":"delivery-rule"},"artifact":{"apiVersion":"markitect.government/v1alpha1","kind":"Artifact","namespace":"invoice","name":"invoice-check"},"role":"Checks both the active requirement text and calculated invoice amount."}},
    {"apiVersion":"markitect.government/v1alpha1","kind":"Realization","metadata":{"namespace":"invoice","name":"delivery-rate-input"},"purpose":"The published rate supplies the explicit delivery charge when the rule is amended.","spec":{"subject":{"apiVersion":"markitect.government-example/v1alpha1","kind":"Requirement","namespace":"invoice","name":"delivery-rule"},"artifact":{"apiVersion":"markitect.government/v1alpha1","kind":"Artifact","namespace":"invoice","name":"delivery-rate"},"role":"Provides the rate consumed by invoice composition."}},
    {"apiVersion":"markitect.government/v1alpha1","kind":"Realization","metadata":{"namespace":"invoice","name":"published-delivery-value"},"purpose":"The same rate artifact realizes the existing exactly-two delivery amount.","spec":{"subject":{"apiVersion":"markitect.government-example/v1alpha1","kind":"Requirement","namespace":"invoice","name":"published-delivery"},"artifact":{"apiVersion":"markitect.government/v1alpha1","kind":"Artifact","namespace":"invoice","name":"delivery-rate"},"role":"Publishes exactly two whole currency units."}},
    {"apiVersion":"markitect.government/v1alpha1","kind":"Realization","metadata":{"namespace":"invoice","name":"protected-goal-record"},"purpose":"A separate artifact realizes the protected customer amount goal without widening delivery change scope.","spec":{"subject":{"apiVersion":"markitect.government-example/v1alpha1","kind":"Requirement","namespace":"invoice","name":"protected-total"},"artifact":{"apiVersion":"markitect.government/v1alpha1","kind":"Artifact","namespace":"invoice","name":"protected-goal-record"},"role":"Records the protected customer total goal independently of delivery implementation."}},
    {"apiVersion":"markitect.government/v1alpha1","kind":"Realization","metadata":{"namespace":"receipt","name":"receipt-format-file"},"purpose":"The standalone receipt file realizes the independent receipt-format requirement.","spec":{"subject":{"apiVersion":"markitect.government-example/v1alpha1","kind":"Requirement","namespace":"receipt","name":"receipt-format"},"artifact":{"apiVersion":"markitect.government/v1alpha1","kind":"Artifact","namespace":"receipt","name":"receipt-file"},"role":"Stores the receipt format label."}}
  ],
  "observation": {"roots":["."],"exclusions":[
    {"path":"README.md","reason":"Public fixture instructions are not candidate product files."},
    {"path":"go.mod","reason":"The fixed fixture module declaration is runner setup."},
    {"path":"runner/main.go","reason":"Deterministic actor implementation is fixture infrastructure."},
    {"path":"trial.ps1","reason":"The native trial harness is external orchestration."}
  ],"admitIgnored":[]}
}
