apiVersion: markitect.example.org/v1alpha1
kind: Rule
metadata:
    name: operations-approval
    namespace: sample
spec:
    text: Review the release approval owner.
    files: [docs/operations-policy.md]
    assertions:
        - subject: release-approval
          predicate: owner
          value: operations
          source: docs/operations-policy.md
          quote: Operations owns release approval.
