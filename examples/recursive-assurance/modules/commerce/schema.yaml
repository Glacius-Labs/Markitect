apiVersion: commerce.recursive-assurance/v1
purpose: Project-owned vocabulary for pure order, billing and recursively composed checkout operations.
kinds:
  OrderRules:
    purpose: Defines positive quantity and nonnegative unit-price validation and line total calculation.
    properties: {}
  BillingQuery:
    purpose: Defines summation of nonnegative outstanding amounts with checked Int64 arithmetic.
    properties: {}
  CheckoutComposition:
    purpose: Defines one checkout that adds a validated order line to existing billing amounts.
    properties:
      orders:
        purpose: Selects the independent Orders operation used by this checkout.
        type: reference
        minCount: 1
        maxCount: 1
        target:
          apiVersion: commerce.recursive-assurance/v1
          kind: OrderRules
      billing:
        purpose: Selects the independent Billing operation used by this checkout.
        type: reference
        minCount: 1
        maxCount: 1
        target:
          apiVersion: commerce.recursive-assurance/v1
          kind: BillingQuery
  CommerceComposition:
    purpose: Defines combined totals for two checkouts and prior outstanding billing amounts.
    properties:
      checkout:
        purpose: Selects the checkout operation composed twice by Commerce.
        type: reference
        minCount: 1
        maxCount: 1
        target:
          apiVersion: commerce.recursive-assurance/v1
          kind: CheckoutComposition
      billing:
        purpose: Selects the shared Billing rule used to combine both checkout totals.
        type: reference
        minCount: 1
        maxCount: 1
        target:
          apiVersion: commerce.recursive-assurance/v1
          kind: BillingQuery