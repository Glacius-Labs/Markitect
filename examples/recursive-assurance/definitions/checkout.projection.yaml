apiVersion: markitect.foundation/v1
kind: Projection
metadata:
  namespace: recursive-assurance
  name: checkout-dotnet
purpose: Parent Checkout representation owns its glue and explicitly contains both child Definitions in a distinct root.
spec:
  source:
    definitions:
      - apiVersion: commerce.recursive-assurance/v1
        kind: CheckoutComposition
        namespace: checkout
        name: add-order-to-outstanding
      - apiVersion: commerce.recursive-assurance/v1
        kind: OrderRules
        namespace: orders
        name: calculate-line-total
      - apiVersion: commerce.recursive-assurance/v1
        kind: BillingQuery
        namespace: billing
        name: sum-outstanding
  representation: dotnet
  target:
    repository: .
    path: src/Checkout/
  policies:
    - apiVersion: markitect.foundation/v1
      kind: ProjectionPolicy
      namespace: recursive-assurance
      name: checkout-dotnet
    - apiVersion: markitect.foundation/v1
      kind: ProjectionPolicy
      namespace: recursive-assurance
      name: orders-dotnet
    - apiVersion: markitect.foundation/v1
      kind: ProjectionPolicy
      namespace: recursive-assurance
      name: billing-dotnet