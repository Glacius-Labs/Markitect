apiVersion: markitect.foundation/v1
kind: Projection
metadata:
  namespace: recursive-assurance
  name: billing-dotnet
purpose: Independently represents the Billing leaf Definition in its own .NET root.
spec:
  source:
    definitions:
      - apiVersion: commerce.recursive-assurance/v1
        kind: BillingQuery
        namespace: billing
        name: sum-outstanding
  representation: dotnet
  target:
    repository: .
    path: src/Billing/
  policies:
    - apiVersion: markitect.foundation/v1
      kind: ProjectionPolicy
      namespace: recursive-assurance
      name: billing-dotnet