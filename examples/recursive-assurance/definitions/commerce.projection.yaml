apiVersion: markitect.foundation/v1
kind: Projection
metadata:
  namespace: recursive-assurance
  name: commerce-dotnet
purpose: Top Commerce representation owns the two-checkout invariant and explicitly selects its descendant Definitions.
spec:
  source:
    definitions:
      - apiVersion: commerce.recursive-assurance/v1
        kind: CommerceComposition
        namespace: commerce
        name: combine-two-checkouts
      - apiVersion: commerce.recursive-assurance/v1
        kind: CheckoutComposition
        namespace: checkout
        name: add-order-to-outstanding
      - apiVersion: commerce.recursive-assurance/v1
        kind: OrderRules
        namespace: orders
        name: calculate-line-total
      - apiVersion: commerce.recursive-assurance/v1
        kind: BillingQuery
        namespace: billing
        name: sum-outstanding
  representation: dotnet
  target:
    repository: .
    path: src/Commerce/
  policies:
    - apiVersion: markitect.foundation/v1
      kind: ProjectionPolicy
      namespace: recursive-assurance
      name: commerce-dotnet
    - apiVersion: markitect.foundation/v1
      kind: ProjectionPolicy
      namespace: recursive-assurance
      name: checkout-dotnet
    - apiVersion: markitect.foundation/v1
      kind: ProjectionPolicy
      namespace: recursive-assurance
      name: orders-dotnet
    - apiVersion: markitect.foundation/v1
      kind: ProjectionPolicy
      namespace: recursive-assurance
      name: billing-dotnet