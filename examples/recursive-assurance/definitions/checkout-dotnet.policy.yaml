apiVersion: markitect.foundation/v1
kind: ProjectionPolicy
metadata:
  namespace: recursive-assurance
  name: checkout-dotnet
purpose: Defines the required public API and behavior for the CheckoutComposition .NET representation.
spec:
  sourceKind:
    apiVersion: commerce.recursive-assurance/v1
    kind: CheckoutComposition
  targetTechnology: dotnet
  guidance: >
    Expose public static class RecursiveAssurance.Checkout.CheckoutComposer with public static long AddAcceptedOrderToOutstandingCents(int quantity, long unitPriceCents, IEnumerable<long> priorAmounts). Use the selected Orders operation to validate and total the line, then pass that amount together with prior amounts to the selected Billing operation. Throw ArgumentOutOfRangeException when Orders rejects its input, and propagate Billing negative-input and overflow exceptions. This is a semantic API contract, not a filename or implementation template.