apiVersion: markitect.foundation/v1
kind: ProjectionPolicy
metadata:
  namespace: recursive-assurance
  name: checkout-dotnet
purpose: Defines the required public API and behavior for the CheckoutComposition .NET representation.
spec:
  sourceKind:
    apiVersion: commerce.recursive-assurance/v1
    kind: CheckoutComposition
  targetTechnology: dotnet
  guidance: >
    Expose public static long AddAcceptedOrderToOutstandingCents(int quantity, long unitPriceCents, IEnumerable<long> priorAmounts). Use the selected Orders operation to validate and total the line, then pass that amount together with prior amounts to the selected Billing operation. Propagate invalid input and overflow. This is a semantic API contract, not a filename or implementation template.