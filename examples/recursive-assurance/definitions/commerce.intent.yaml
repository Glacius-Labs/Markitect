apiVersion: commerce.recursive-assurance/v1
kind: CommerceComposition
metadata:
  namespace: commerce
  name: combine-two-checkouts
purpose: Run Checkout twice for distinct order lines and combine both results with prior amounts through the shared Billing rule.
spec:
  checkout:
    apiVersion: commerce.recursive-assurance/v1
    kind: CheckoutComposition
    namespace: checkout
    name: add-order-to-outstanding
  billing:
    apiVersion: commerce.recursive-assurance/v1
    kind: BillingQuery
    namespace: billing
    name: sum-outstanding