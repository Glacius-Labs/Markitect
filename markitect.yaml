apiVersion: markitect.example.org/v1alpha1
kind: Project
metadata:
    name: markitect-development
spec:
    targets:
        - codex
        - claude
        - markdown
    areas:
        - name: core
          path: internal/host/embedded/resources
          rules:
            - name: canonical-ownership
        - name: development
          path: .markitect/areas/development
          imports:
            - core
            - documentation
            - contribution
        - name: documentation
          path: docs
        - name: contribution
          path: CONTRIBUTING.md
    checks:
        - name: architecture-imports
          run:
            - go
            - run
            - ./cmd/markitect-check-architecture
            - --repo
            - .
        - name: managed-artifacts
          run:
            - go
            - run
            - ./cmd/markitect-check-artifacts
            - --repo
            - .
            - --config
            - markitect-artifacts.yaml
        - name: go-tests
          run:
            - go
            - test
            - ./...
